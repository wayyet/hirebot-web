function cloneObject(source) {
  return source ? JSON.parse(JSON.stringify(source)) : source;
}

function findEmployeeById(id) {
  return DEPT_EMPLOYEES.find(e => e.id === id) || MY_EMPLOYEES.find(e => e.id === id);
}

function findTemplateById(id) {
  return TEMPLATES.find(t => t.id === id);
}

function getViewer(role) {
  return VIEWER_META[role] || VIEWER_META.manager;
}

function getMyEmployeesForRole(role) {
  const viewer = getViewer(role);
  return MY_EMPLOYEES.filter(e => e.owner === viewer.name);
}

function updateEmployee(id, patch) {
  const target = findEmployeeById(id);
  if (!target) return null;
  Object.assign(target, patch);
  return target;
}

function generateId(prefix) {
  return `${prefix}_${Math.random().toString(36).slice(2, 8)}`;
}

function uniqueName(base, list) {
  const normalized = base.trim();
  if (!list.some(item => item.name === normalized)) return normalized;
  let idx = 2;
  while (list.some(item => item.name === `${normalized} ${idx}`)) idx += 1;
  return `${normalized} ${idx}`;
}

function readIMStore() {
  if (window.__NCREW_IM_BINDINGS__) return window.__NCREW_IM_BINDINGS__;
  try {
    const raw = window.localStorage && window.localStorage.getItem(IM_BINDING_STORAGE_KEY);
    window.__NCREW_IM_BINDINGS__ = raw ? JSON.parse(raw) : {};
  } catch (err) {
    window.__NCREW_IM_BINDINGS__ = {};
  }
  return window.__NCREW_IM_BINDINGS__;
}

function writeIMStore(nextStore) {
  window.__NCREW_IM_BINDINGS__ = nextStore;
  try {
    if (window.localStorage) window.localStorage.setItem(IM_BINDING_STORAGE_KEY, JSON.stringify(nextStore));
  } catch (err) {}
}

function buildSeedBindings(employee) {
  return cloneObject((employee && employee.seedBindings) || {});
}

function getEmployeeBindings(employeeId) {
  const store = readIMStore();
  if (store[employeeId]) return cloneObject(store[employeeId]);
  const seeded = buildSeedBindings(findEmployeeById(employeeId));
  store[employeeId] = seeded;
  writeIMStore(store);
  return cloneObject(seeded);
}

function getBinding(employeeId, channelId) {
  return getEmployeeBindings(employeeId)[channelId] || null;
}

function saveEmployeeBinding(employeeId, channelId, binding) {
  const store = readIMStore();
  const current = store[employeeId] ? cloneObject(store[employeeId]) : buildSeedBindings(findEmployeeById(employeeId));
  current[channelId] = binding;
  writeIMStore({ ...store, [employeeId]: current });
  return current[channelId];
}

function removeEmployeeBinding(employeeId, channelId) {
  const store = readIMStore();
  const current = store[employeeId] ? cloneObject(store[employeeId]) : buildSeedBindings(findEmployeeById(employeeId));
  delete current[channelId];
  writeIMStore({ ...store, [employeeId]: current });
  return current;
}

function getBindingStatus(employeeId, channelId) {
  const binding = getBinding(employeeId, channelId);
  return binding ? (binding.status || "connected") : "unconfigured";
}

function getConnectedChannels(employeeId) {
  const bindings = getEmployeeBindings(employeeId);
  return Object.keys(bindings).filter(channelId => bindings[channelId] && bindings[channelId].status !== "error");
}

function formatNow() {
  try {
    return new Date().toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  } catch (err) {
    return "刚刚";
  }
}

function resolveTopNav(route) {
  if (!route) return "templates";
  if (route.startsWith("templates") || route.startsWith("template/")) return "templates";
  if (route.startsWith("hire/new")) return "templates";
  if (route.startsWith("dept")) return "dept";
  if (route.startsWith("my")) return "my";

  const id = route.split("/")[1] ? route.split("/")[1].split("?")[0] : "";
  const employee = id ? window.findEmployeeById(id) : null;

  if (route.startsWith("clone/") || route.startsWith("quick-clone/")) return "dept";
  if (route.startsWith("chat/") || route.startsWith("im/")) return "my";
  if (route.startsWith("employee/") || route.startsWith("publish/") || route.startsWith("eval-ai/") || route.startsWith("eval-human/") || route.startsWith("review/")) {
    return employee && employee.type === "department" ? "dept" : "my";
  }
  if (route.startsWith("branch/")) return "my";
  if (route.startsWith("hire/")) return employee && employee.type === "department" ? "dept" : "my";
  return null;
}

function Lineage({ employee }) {
  const segments = [];
  const template = window.findTemplateById(employee.template);
  if (template) segments.push({ kind: "模板", name: template.name });

  if (employee.type === "department" && employee.clonedFrom) {
    const source = window.findEmployeeById(employee.clonedFrom);
    if (source) segments.push({ kind: "快捷复制源", name: source.name });
  }

  if (employee.type === "department") {
    segments.push({ kind: "部门员工", name: employee.name });
  }

  if (employee.type === "personal_clone") {
    const department = window.findEmployeeById(employee.parent);
    if (department) segments.push({ kind: "部门员工", name: department.name });
    segments.push({ kind: "我的分身", name: employee.name });
  }

  if (employee.type === "private_branch") {
    const parentClone = window.findEmployeeById(employee.parent);
    if (parentClone) {
      const department = window.findEmployeeById(parentClone.parent);
      if (department) segments.push({ kind: "部门员工", name: department.name });
      segments.push({ kind: "我的分身", name: parentClone.name });
    }
    segments.push({ kind: "私人定制", name: employee.name });
  }

  return (
    <div className="lineage">
      {segments.map((item, idx) => (
        <React.Fragment key={`${item.kind}-${idx}`}>
          <span className="seg"><span className="muted" style={{ fontSize: 11 }}>{item.kind}</span> · {item.name}</span>
          {idx < segments.length - 1 && <span className="arr">→</span>}
        </React.Fragment>
      ))}
    </div>
  );
}

function StepsBar({ steps, current, view = current, onStepClick, isStepClickable, isStepConfirmed }) {
  return (
    <div className="steps">
      {steps.map((step, idx) => {
        const classes = [];
        const clickable = typeof onStepClick === "function" && (typeof isStepClickable === "function" ? isStepClickable(idx) : idx <= current);
        const confirmed = typeof isStepConfirmed === "function" ? isStepConfirmed(idx) : idx < current;
        let stateLabel = "";
        if (idx < current) classes.push("done");
        if (idx === current) classes.push("active");
        if (idx === view && idx !== current) classes.push("viewing");
        if (clickable) classes.push("clickable");
        if (idx === view && idx !== current) stateLabel = "回看中";
        else if (idx === current) stateLabel = confirmed ? "已确认" : "进行中";
        else if (confirmed) stateLabel = "已确认";
        const content = (
          <>
            <span className="num">{idx + 1}</span>
            <span className="step-copy">
              <span className="step-title">{step.title}</span>
              {stateLabel && <span className="step-state">{stateLabel}</span>}
            </span>
          </>
        );
        return (
          <React.Fragment key={step.id}>
            {clickable ? (
              <button type="button" className={`step ${classes.join(" ")}`} onClick={() => onStepClick(idx)}>
                {content}
              </button>
            ) : (
              <div className={`step ${classes.join(" ")}`}>
                {content}
              </div>
            )}
            {idx < steps.length - 1 && <span className="step-arrow">→</span>}
          </React.Fragment>
        );
      })}
    </div>
  );
}

function buildEmployeeActions(employee, role, go, toast, setJumpPicker) {
  const isManager = role === "manager";
  const viewer = window.getViewer(role);
  const isOwner = employee.owner === viewer.name;
  const actions = [];

  if (employee.type === "department") {
    if (employee.status === "hired") actions.push({ label: "继续雇佣", primary: true, go: () => go(`hire/${employee.id}`) });
    if (employee.status === "interning_ai") actions.push({ label: "查看 AI 评估", primary: true, go: () => go(`eval-ai/${employee.id}`) });
    if (employee.status === "interning_human") actions.push({ label: "查看人工评估", primary: true, go: () => go(`eval-human/${employee.id}`) });
    if (employee.status === "live") {
      if (isManager) {
        actions.push({ label: "重新雇佣", primary: true, go: () => go(`hire/${employee.id}`) });
        actions.push({ label: "快捷复制", go: () => go(`quick-clone/${employee.id}`) });
        actions.push({ label: "复制一个给自己", go: () => go(`clone/${employee.id}`) });
      } else {
        actions.push({ label: "创建分身", primary: true, go: () => go(`clone/${employee.id}`) });
      }
    }
  } else {
    if (employee.status === "live" && isOwner) {
      actions.push({ label: "开始对话", primary: true, go: () => go(`chat/${employee.id}`) });
      if (window.getConnectedChannels(employee.id).length) actions.push({ label: "去 IM", go: () => setJumpPicker(true) });
      actions.push({ label: "配置 IM", go: () => go(`im/${employee.id}`) });
      if (employee.type === "personal_clone") actions.push({ label: "创建私有分支", go: () => go(`branch/${employee.id}`) });
      actions.push({
        label: "退役",
        go: () => {
          window.updateEmployee(employee.id, { status: "retired", updated: "刚刚", activeAt: "—" });
          toast("已退役，仍可从历史记录中查看");
          go("my");
        }
      });
    }
    if ((employee.status === "interning_ai" || employee.status === "interning_human") && isOwner) {
      actions.push({
        label: employee.status === "interning_ai" ? "查看 AI 评估" : "查看人工评估",
        primary: true,
        go: () => go(employee.status === "interning_ai" ? `eval-ai/${employee.id}` : `eval-human/${employee.id}`)
      });
    }
  }

  if (employee.status === "failed") {
    actions.push({ label: "查看评估报告", primary: true, go: () => go(`review/${employee.id}`) });
    actions.push({ label: "继续雇佣", go: () => go(`hire/${employee.id}`) });
  }

  if (employee.status === "retired") {
    actions.push({ label: "查看历史", primary: true, go: () => go(`employee/${employee.id}`) });
    if (employee.parent) actions.push({ label: "重新复制", go: () => go(`clone/${employee.parent}`) });
  }

  return actions;
}

                      </div>
                      <span className={`pill ${status === "connected" ? "green" : status === "error" ? "pink" : "gray"} dot`}>{statusText}</span>
                    </div>
                    <div className="spacer-16" />
                    <button className="btn btn-ghost btn-sm" onClick={() => status === "connected" ? setJumpPicker(true) : go(`im/${employee.id}`)}>
                      {actionLabel}
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        </>
      )}

      <window.IMPickerModal
        open={jumpPicker}
        employee={employee}
        onClose={() => setJumpPicker(false)}
        onConfig={() => go(`im/${employee.id}`)}
      />
    </div>
  );
}

function ensureHireV2Styles() {
  if (document.getElementById(HIRE_V2_STYLE_ID)) return;
  const style = document.createElement("style");
  style.id = HIRE_V2_STYLE_ID;
  style.textContent = HIRE_V2_STYLES;
  document.head.appendChild(style);
}

function clampPhase(value) {
  const num = Number(value) || 1;
  return Math.max(1, Math.min(num, 6));
}

function docsProgress(flow) {
  if (hasUploadedBusinessFile(flow)) return 1;
  return DOC_REQUIREMENTS.length ? flow.docs.done.length / DOC_REQUIREMENTS.length : 0;
}

function skillsProgress(flow) {
  return Math.min(flow.skills.adopted.length, 1);
}

function integrationsProgress(flow) {
  return Math.min(flow.integrations.done.length / INTEGRATION_DEFINITIONS.length, 1);
}

function packageProgress(flow) {
  return flow.package.generated ? 1 : 0;
}

function progressForStep(step, flow) {
  if (step.id === "docs") return docsProgress(flow);
  if (step.id === "skills") return skillsProgress(flow);
  if (step.id === "integrations") return integrationsProgress(flow);
  return packageProgress(flow);
}

function mapPhaseToProcessIndex(phase) {
  if (phase <= 3) return 0;
  if (phase === 4) return 1;
  if (phase === 5) return 2;
  return 3;
}

function uniqueId(prefix) {
  return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
}

function createMessage(role, payload) {
  return {
    id: uniqueId(role),
    role,
    title: payload.title || "",
    text: payload.text || "",
    card: payload.card || null,
    actions: payload.actions || [],
    typing: !!payload.typing
  };
}

function createIntroMessages(template, existing, isBranchFlow) {
  const assistantName = existing ? existing.name : template.name;
  const roleLabel = isBranchFlow ? "私人定制数字员工" : "部门数字员工";
  const scenario = existing
    ? `我们会基于「${assistantName}」继续推进雇佣环节。`
    : `我们会基于「${template.name}」模板完成一条新的部门版雇佣流程。`;

  return [
    createMessage("agent", {
      title: `我是${assistantName}`,
      text: `${scenario} 这次我会像一位即将上岗的新同事一样，主动告诉你我还缺什么。`,
      card: {
        type: "identity",
        nickname: assistantName,
        role: roleLabel,
        style: "友好、清晰、稳妥",
        highlights: ["业务理解", "技能配置", "外部系统连接"]
      }
    }),
    createMessage("agent", {
      title: "这些是我要完成的入职事项",
      text: "资料、技能、系统和实例包会在同一条会话里逐步闭环。右侧会同步记录每一项进度。",
      actions: [{ label: "开始第一步", action: "startDocs", primary: true }]
    })
  ];
}

function buildInitialFlow(template, existing, savedFlow) {
  const completed = existing ? Math.max(0, Math.min(existing.hireProgress || 0, 6)) : 0;
  const minPhase = completed >= 6 ? 6 : Math.max(1, completed + 1);
  const base = {
    currentPhase: minPhase,
    todoRevealed: minPhase > 1,
    background: "original",
    messages: createIntroMessages(template, existing, existing && existing.type === "private_branch"),
    docs: {
      interactions: 0,
      done: [],
      sources: {},
      notes: []
    },
    skills: {
      adopted: [],
      ignored: [],
      customCount: 0,
      coveredTypes: [],
      generated: []
    },
    integrations: {
      configs: {},
      done: [],
      failed: []
    },
    package: {
      generated: false,
      meta: null
    }
  };

  if (!savedFlow) return base;

  const next = {
    ...base,
    ...savedFlow,
    currentPhase: Math.max(minPhase, clampPhase(savedFlow.currentPhase)),
    todoRevealed: savedFlow.todoRevealed || minPhase > 1,
    background: savedFlow.background === "cool" ? "cool" : "original",
    docs: {
      ...base.docs,
      ...(savedFlow.docs || {}),
      done: Array.isArray(savedFlow.docs && savedFlow.docs.done) ? savedFlow.docs.done : []
    },
    skills: {
      ...base.skills,
      ...(savedFlow.skills || {}),
      adopted: Array.isArray(savedFlow.skills && savedFlow.skills.adopted) ? savedFlow.skills.adopted : [],
      ignored: Array.isArray(savedFlow.skills && savedFlow.skills.ignored) ? savedFlow.skills.ignored : [],
      coveredTypes: Array.isArray(savedFlow.skills && savedFlow.skills.coveredTypes) ? savedFlow.skills.coveredTypes : [],
      generated: Array.isArray(savedFlow.skills && savedFlow.skills.generated) ? savedFlow.skills.generated : []
    },
    integrations: {
      ...base.integrations,
      ...(savedFlow.integrations || {}),
      done: Array.isArray(savedFlow.integrations && savedFlow.integrations.done) ? savedFlow.integrations.done : []
    },
    package: {
      ...base.package,
      ...(savedFlow.package || {})
    }
  };

  if (!Array.isArray(next.messages) || !next.messages.length) next.messages = base.messages;
  return next;
}

function readFlowCache(cacheKey) {
  try {
    const raw = window.localStorage && window.localStorage.getItem(cacheKey);
    return raw ? JSON.parse(raw) : null;
  } catch (error) {
    return null;
  }
}

function writeFlowCache(cacheKey, flow) {
  try {
    if (!window.localStorage) return;
    window.localStorage.setItem(cacheKey, JSON.stringify(flow));
  } catch (error) {
    // Prototype cache failures should not block the UI.
  }
}

function clearFlowCache(cacheKey) {
  try {
    if (window.localStorage) window.localStorage.removeItem(cacheKey);
  } catch (error) {
    // Ignore cache cleanup failures.
  }
}

function detectDocCoverage(input) {
  const source = `${input || ""}`;
  return DOC_REQUIREMENTS.filter(item => item.patterns.some(pattern => pattern.test(source))).map(item => item.id);
}

function hasUploadedBusinessFile(flow) {
  const sources = (flow && flow.docs && flow.docs.sources) || {};
  return Object.values(sources).some(item => item && item.source === "upload");
}

function normalizeUploadedDocCoverage(files, recognized) {
  if (recognized.length) return recognized;
  if (files && files.length && DOC_REQUIREMENTS.length) return [DOC_REQUIREMENTS[0].id];
  return recognized;
}

function findDocLabel(docId) {
  const target = DOC_REQUIREMENTS.find(item => item.id === docId);
  return target ? target.label : docId;
}

function buildMaterialsCard(doneIds) {
  return {
    type: "materials",
    items: DOC_REQUIREMENTS.map(item => ({
      name: item.label,
      desc: item.desc,
      status: doneIds.includes(item.id) ? "已覆盖" : "待补充"
    }))
  };
}

function inferSkillSeed(text) {
  const source = `${text || ""}`;
  if (/简历|resume|cv|排序|rank/i.test(source)) {
    return {
      name: "候选人匹配排序",
      type: "查询类技能",
      description: "根据岗位要求自动对候选人资料排序，并输出排序依据。"
    };
  }
  if (/面试|录音|纪要|minutes|summary|转写/i.test(source)) {
    return {
      name: "面试纪要整理",
      type: "处理类技能",
      description: "自动整理面试过程中的音频、转写和速记信息，生成结构化纪要。"
    };
  }
  if (/offer|薪资|审批|边界|升级|风险/i.test(source)) {
    return {
      name: "Offer 风险升级",
      type: "升级类技能",
      description: "识别敏感 offer 场景，自动检查审批边界并给出升级建议。"
    };
  }
  return {
    name: "自定义能力草稿",
    type: ["查询类技能", "处理类技能", "升级类技能"][Date.now() % 3],
    description: "根据你的文字描述生成一份可继续编辑的能力定义。"
  };
}

function buildGeneratedSkillFromText(text) {
  const seed = inferSkillSeed(text);
  return {
    id: uniqueId("skill"),
    name: seed.name,
    type: seed.type,
    description: `${seed.description} 当前需求：${text}`,
    dependency: "待确认外部依赖",
    trigger: `当出现「${text.slice(0, 20)}${text.length > 20 ? "…" : ""}」相关场景时触发`
  };
}

function buildSkillFromFile(file) {
  const base = file.name.replace(/\.[^.]+$/, "");
  const seed = inferSkillSeed(base);
  return {
    id: uniqueId("skill_file"),
    name: base || seed.name,
    type: seed.type,
    description: `已从 ${file.name} 解析出一份技能草稿，可继续编辑后采纳。`,
    dependency: "待确认外部依赖",
    trigger: `上传 ${file.name} 后触发解析`
  };
}

function buildDemoConfig(systemId) {
  const key = systemId || "system";
  return {
    endpoint: `https://demo-${key}.ncrew.local/api`,
    apiKey: `sk-demo-${key}`,
    webhook: `https://demo-${key}.ncrew.local/webhook`,
    timeout: 30,
    __demo: true
  };
}

function validateConfig(config) {
  if (!config.endpoint || !/^https?:\/\//.test(config.endpoint)) {
    return { ok: false, reason: "endpoint 解析失败：地址格式不正确" };
  }
  if (!config.apiKey || !config.apiKey.startsWith("sk-")) {
    return { ok: false, reason: "apiKey 无效：密钥格式需以 sk- 开头" };
  }
  return { ok: true, reason: "连接已就绪" };
}

function normalizeSystemConfig(systemId, config) {
  const demoConfig = buildDemoConfig(systemId);
  const endpoint = config.endpoint || demoConfig.endpoint;
  const apiKey = config.apiKey || demoConfig.apiKey;
  const webhook = config.webhook || demoConfig.webhook;
  const timeout = Number(config.timeout || demoConfig.timeout);
  const usedDemo = !config.endpoint || !config.apiKey;

  return {
    endpoint,
    apiKey,
    webhook,
    timeout,
    __demo: usedDemo
  };
}

function parseIntegrationText(text) {
  const results = [];
  const urlMatch = [...text.matchAll(/https?:\/\/[^\s，,；;]+/g)].map(match => match[0]);
  const keyMatch = [...text.matchAll(/sk-[a-zA-Z0-9-_]+/g)].map(match => match[0]);

  INTEGRATION_DEFINITIONS.forEach((system, index) => {
    if (text.toLowerCase().includes(system.id) || text.includes(system.name.replace("系统", "")) || text.includes(system.name)) {
      results.push({
        systemId: system.id,
        config: {
          endpoint: urlMatch[index] || urlMatch[0] || "",
          apiKey: keyMatch[index] || keyMatch[0] || "",
          webhook: "",
          timeout: 30
        }
      });
    }
  });

  return results;
}

function formatTimestamp(date) {
  const parts = [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, "0"),
    String(date.getDate()).padStart(2, "0"),
    String(date.getHours()).padStart(2, "0"),
    String(date.getMinutes()).padStart(2, "0")
  ];
  return parts.join("");
}

function buildPackageMeta(flow, assistantName) {
  const timestamp = new Date();
  return {
    name: `${assistantName}_实例包_v1.0_${formatTimestamp(timestamp)}`,
    version: "v1.0",
    generatedAt: timestamp.toLocaleString("zh-CN"),
    docsCount: flow.docs.done.length,
    skillsCount: flow.skills.adopted.length,
    integrationsCount: flow.integrations.done.length,
    tree: [
      "manifest.json",
      "knowledge/",
      "  ├─ index.json",
      "  ├─ kb/",
      "  ├─ manual/",
      "  ├─ faq/",
      "  └─ script/",
      "skills/",
      "integrations/",
      "prompts/",
      "policies/"
    ].join("\n")
  };
}

function renderIntegrationSummary(config) {
  if (!config) return "";
  return config.__demo ? `演示配置 · ${config.endpoint}` : config.endpoint;
}

function buildPackagePayload(flow, assistantName) {
  return {
    manifest: {
      employeeName: assistantName,
      role: "数字员工",
      version: flow.package.meta && flow.package.meta.version,
      generatedAt: flow.package.meta && flow.package.meta.generatedAt,
      capabilities: flow.skills.adopted.map(item => item.name)
    },
    knowledge: flow.docs.sources,
    skills: flow.skills.adopted,
    integrations: Object.fromEntries(
      Object.entries(flow.integrations.configs).map(([key, value]) => [
        key,
        { ...value, apiKey: value.apiKey ? "******已加密******" : "" }
      ])
    )
  };
}

function triggerDownload(blob, filename) {
  const anchor = document.createElement("a");
  const url = URL.createObjectURL(blob);
  anchor.href = url;
  anchor.download = filename;
  anchor.click();
  window.setTimeout(() => URL.revokeObjectURL(url), 0);
}

function HirePage({ id, tpl, go, toast }) {
  const existing = id ? window.findEmployeeById(id) : null;
  const template = tpl
    ? window.findTemplateById(tpl)
    : (existing ? window.findTemplateById(existing.template) : window.TEMPLATES[0]);
  const isBranchFlow = !!existing && existing.type === "private_branch";
  const backTo = isBranchFlow ? "my" : "dept";
  const cacheKey = `${HIRE_V2_CACHE_PREFIX}:${existing ? existing.id : `tpl:${template && template.id}`}`;
  const savedFlow = readFlowCache(cacheKey);

  const [flow, setFlow] = _useStateH(() => buildInitialFlow(template, existing, savedFlow));
  const [draft, setDraft] = _useStateH("");
  const [activeSystemId, setActiveSystemId] = _useStateH(null);
  const [systemForm, setSystemForm] = _useStateH({ endpoint: "", apiKey: "", webhook: "", timeout: 30 });
  const [drawerFeedback, setDrawerFeedback] = _useStateH("");
  const [editingSkillId, setEditingSkillId] = _useStateH("");
  const [skillForm, setSkillForm] = _useStateH({ name: "", description: "", trigger: "" });
  const [dropActive, setDropActive] = _useStateH(false);

  const businessFileInputRef = _useRefH(null);
  const skillFileInputRef = _useRefH(null);
  const timerRef = _useRefH([]);
  const flowRef = _useRefH(flow);

  _useEffectH(() => {
    ensureHireV2Styles();
  }, []);

  _useEffectH(() => {
    flowRef.current = flow;
    writeFlowCache(cacheKey, flow);
  }, [cacheKey, flow]);

  _useEffectH(() => () => {
    timerRef.current.forEach(timerId => window.clearTimeout(timerId));
  }, []);

  function rememberTimer(timerId) {
    timerRef.current.push(timerId);
  }

  function assistantName() {
    return existing ? existing.name : template.name;
  }

  function syncExistingProgress(completedPhases) {
    if (!existing) return;
    const nextCompleted = Math.max(existing.hireProgress || 0, completedPhases);
    window.updateEmployee(existing.id, {
      hireProgress: nextCompleted,
      updated: "刚刚"
    });
  }

  function findSkillCandidate(skillId) {
    return RECOMMENDED_SKILLS.find(item => item.id === skillId)
      || flowRef.current.skills.generated.find(item => item.id === skillId)
      || flowRef.current.skills.adopted.find(item => item.id === skillId);
  }

  function areDocsComplete(targetFlow = flowRef.current) {
    return hasUploadedBusinessFile(targetFlow) || targetFlow.docs.done.length >= DOC_REQUIREMENTS.length;
  }

  function areSkillsReady(targetFlow = flowRef.current) {
    return targetFlow.skills.adopted.length >= 1;
  }

  function areIntegrationsReady(targetFlow = flowRef.current) {
    return targetFlow.integrations.done.length >= INTEGRATION_DEFINITIONS.length;
  }

  function completionRatio() {
    const values = [
      docsProgress(flow),
      skillsProgress(flow),
      integrationsProgress(flow),
      packageProgress(flow)
    ];
    return Math.round((values.reduce((sum, value) => sum + value, 0) / values.length) * 100);
  }

  function todoItems() {
    return [
      {
        id: "docs",
        phase: 2,
        title: "补充业务资料",
        description: "上传业务相关资料，让数字员工理解业务背景。",
        subtasks: ["业务资料"],
        progress: docsProgress(flow)
      },
      {
        id: "skills",
        phase: 4,
        title: "配置技能模块",
        description: "配置执行能力，让数字员工能真正完成任务。",
        subtasks: ["技能配置"],
        progress: skillsProgress(flow)
      },
      {
        id: "integrations",
        phase: 5,
        title: "对接外部系统",
        description: "配置系统连接参数，让技能真正跑起来。",
        subtasks: ["系统对接"],
        progress: integrationsProgress(flow)
      },
      {
        id: "package",
        phase: 6,
        title: "生成实例包",
        description: "打包所有配置，生成可部署成果。",
        subtasks: ["生成实例"],
        progress: packageProgress(flow)
      }
    ];
  }

  function stepStatus(item) {
    const progress = item.progress;
    if (progress >= 1) return { label: "已完成", className: "status-done", icon: "✓" };
    if ((item.id === "docs" && flow.docs.interactions > 0) || mapPhaseToProcessIndex(flow.currentPhase) >= mapPhaseToProcessIndex(item.phase)) {
      return { label: "进行中", className: "status-active", icon: "•" };
    }
    return { label: "待办", className: "status-pending", icon: "○" };
  }

  function subtaskStatus(itemId, label) {
    if (itemId === "docs") {
      const matched = DOC_REQUIREMENTS.find(item => item.label === label);
      const done = matched && flow.docs.done.includes(matched.id);
      return done ? { label: "已归档", className: "done", icon: "✓" } : { label: "待补充", className: "pending", icon: "○" };
    }
    if (itemId === "skills") {
      const done = flow.skills.coveredTypes.includes(label);
      return done ? { label: "已覆盖", className: "done", icon: "✓" } : { label: "待补齐", className: "pending", icon: "○" };
    }
    const system = INTEGRATION_DEFINITIONS.find(item => item.name === label);
    const done = system && flow.integrations.done.includes(system.id);
    if (done) return { label: "已连通", className: "done", icon: "✓" };
    if (flow.currentPhase >= 5) return { label: "待配置", className: "active", icon: "•" };
    return { label: "待配置", className: "pending", icon: "○" };
  }

  function saveFlowDraft() {
    writeFlowCache(cacheKey, flowRef.current);
    toast("已保存雇佣草稿");
  }

  function resetFlow() {
    setActiveSystemId(null);
    setEditingSkillId("");
    setDraft("");
    setDropActive(false);
    const reset = buildInitialFlow(template, existing, null);
    setFlow(reset);
    clearFlowCache(cacheKey);
    toast(existing ? "已重置当前界面草稿" : "流程已重置");
  }

  function startDocsFlow(fromResume) {
    syncExistingProgress(1);
    setFlow(prev => ({
      ...prev,
      currentPhase: Math.max(prev.currentPhase, 2),
      todoRevealed: true,
      messages: fromResume || prev.currentPhase === 1
        ? [
            ...prev.messages,
            createMessage("agent", {
              title: "先补齐业务资料",
              text: "你可以上传任意格式的业务文件，也可以直接用文字补充岗位背景、服务口径和 FAQ 约束。",
              card: buildMaterialsCard(prev.docs.done)
            })
          ]
        : prev.messages
    }));
  }

  function summarizeDocFeedback(filesOrText, recognized, nextDone) {
    const uploaded = Array.isArray(filesOrText) && filesOrText.length > 0;
    const docsComplete = uploaded || nextDone.length >= DOC_REQUIREMENTS.length;
    const missing = docsComplete ? [] : DOC_REQUIREMENTS.filter(item => !nextDone.includes(item.id)).map(item => item.label);
    const recognizedLabels = recognized.length ? recognized.map(findDocLabel) : [];
    const sourceLabel = Array.isArray(filesOrText) ? filesOrText.map(item => item.name).join("、") : "这段补充说明";
    const title = missing.length ? "资料已归档，仍有缺口" : "业务资料已补齐";
    const text = missing.length
      ? `我已经解析了 ${sourceLabel}，当前覆盖了 ${recognizedLabels.length ? recognizedLabels.join("、") : "基础业务说明"}。还缺少 ${missing.join("、")}，我会继续等你补齐。`
      : `我已经解析了 ${sourceLabel}，当前资料已满足进入技能模块的条件，可以继续下一步。`;

    return {
      title,
      text,
      card: {
        type: "fileSummary",
        items: [
          {
            label: "已识别资料",
            detail: recognizedLabels.length ? recognizedLabels.join("、") : "已记录为业务补充说明"
          },
          {
            label: "待补充项",
            detail: missing.length ? missing.join("、") : "无"
          }
        ]
      },
          actions: missing.length ? [] : [{ label: "进入技能模块 →", action: "startSkills", primary: true }]
    };
  }

  function processBusinessFiles(files) {
    if (!files.length) return;
    const recognized = Array.from(new Set(
      normalizeUploadedDocCoverage(files, files.flatMap(file => detectDocCoverage(file.name)))
    ));

    setFlow(prev => {
      const doneSet = new Set(prev.docs.done);
      recognized.forEach(item => doneSet.add(item));
      const nextDone = Array.from(doneSet);
      const nextPhase = files.length > 0 || nextDone.length >= DOC_REQUIREMENTS.length ? 4 : Math.max(prev.currentPhase, 3);
      const nextSources = { ...prev.docs.sources };
      files.forEach(file => {
        nextSources[file.name] = {
          source: "upload",
          recognized: recognized.map(findDocLabel)
        };
      });

      const messages = [
        ...prev.messages,
        createMessage("user", { text: `已上传文件：${files.map(file => file.name).join("、")}` }),
        createMessage("agent", summarizeDocFeedback(files, recognized, nextDone))
      ];

      return {
        ...prev,
        currentPhase: nextPhase,
        todoRevealed: true,
        messages,
        docs: {
          ...prev.docs,
          interactions: prev.docs.interactions + 1,
          done: nextDone,
          sources: nextSources
        }
      };
    });

    if (files.length > 0 || recognized.length >= DOC_REQUIREMENTS.length || areDocsComplete({ ...flowRef.current, docs: { ...flowRef.current.docs, done: Array.from(new Set([...flowRef.current.docs.done, ...recognized])), sources: { ...flowRef.current.docs.sources, ...Object.fromEntries(files.map(file => [file.name, { source: "upload" }])) } } })) {
      syncExistingProgress(3);
    }
  }

  function processBusinessText(text) {
    const recognized = Array.from(new Set(detectDocCoverage(text)));
    const projectedDone = Array.from(new Set([...flowRef.current.docs.done, ...recognized]));

    setFlow(prev => {
      const doneSet = new Set(prev.docs.done);
      recognized.forEach(item => doneSet.add(item));
      const nextDone = Array.from(doneSet);
      const nextPhase = nextDone.length >= DOC_REQUIREMENTS.length ? 4 : Math.max(prev.currentPhase, 3);

      const messages = [
        ...prev.messages,
        createMessage("user", { text }),
        createMessage("agent", summarizeDocFeedback(text, recognized, nextDone))
      ];

      return {
        ...prev,
        currentPhase: nextPhase,
        todoRevealed: true,
        messages,
        docs: {
          ...prev.docs,
          interactions: prev.docs.interactions + 1,
          done: nextDone,
          notes: [...prev.docs.notes, text]
        }
      };
    });

    if (projectedDone.length >= DOC_REQUIREMENTS.length) {
      syncExistingProgress(3);
    }
  }

  function suggestSkills(forceMessage) {
    setFlow(prev => {
      const available = [...RECOMMENDED_SKILLS, ...prev.skills.generated]
        .filter(item => !prev.skills.ignored.includes(item.id) && !prev.skills.adopted.some(a => a.id === item.id));

      const messages = forceMessage
        ? [
            ...prev.messages,
            createMessage("agent", {
              title: "开始配置技能模块",
              text: "资料已经够用了，下面为这位数字员工补齐可执行能力。你可以直接采纳推荐技能，也可以上传 skill 文件或用自然语言描述新能力。"
            }),
            ...available.map(item => createMessage("agent", {
              card: {
                type: "skill",
                typeLabel: item.type,
                name: item.name,
                description: item.description,
                dependency: item.dependency,
                trigger: item.trigger,
                id: item.id
              }
            }))
          ]
        : prev.messages;

      return {
        ...prev,
        currentPhase: Math.max(prev.currentPhase, 4),
        todoRevealed: true,
        messages
      };
    });
  }

  function adoptSkill(skillId, overrides) {
    const candidate = findSkillCandidate(skillId);
    if (!candidate) return;
    const nextCovered = Array.from(new Set([...flowRef.current.skills.coveredTypes, (overrides && overrides.type) || candidate.type]));

    setFlow(prev => {
      const merged = {
        ...candidate,
        ...(overrides || {})
      };
      const adoptedExists = prev.skills.adopted.some(item => item.id === skillId);
      if (adoptedExists) return prev;

      const nextMessages = [
        ...prev.messages,
        createMessage("agent", {
          title: `已采纳技能 · ${merged.name}`,
          text: "技能已配置完成，可以继续对接外部系统。",
          actions: [{ label: "进入外部系统 →", action: "startIntegrations", primary: true }]
        })
      ];

      const nextCoveredTypes = Array.from(new Set([...prev.skills.coveredTypes, merged.type]));

      return {
        ...prev,
        currentPhase: 5,
        messages: nextMessages,
        skills: {
          ...prev.skills,
          adopted: [...prev.skills.adopted, merged],
          coveredTypes: nextCoveredTypes
        }
      };
    });

    syncExistingProgress(4);
  }

  function ignoreSkill(skillId) {
    setFlow(prev => ({
      ...prev,
      skills: {
        ...prev.skills,
        ignored: prev.skills.ignored.includes(skillId) ? prev.skills.ignored : [...prev.skills.ignored, skillId]
      },
      messages: [
        ...prev.messages,
        createMessage("agent", {
          title: "已忽略这项技能",
          text: "你可以继续看推荐列表里的其他技能，或者直接描述想新增的能力。"
        })
      ]
    }));
  }

  function openSkillEditor(skillId) {
    const skill = findSkillCandidate(skillId);
    if (!skill) return;
    setEditingSkillId(skillId);
    setSkillForm({
      name: skill.name || "",
      description: skill.description || "",
      trigger: skill.trigger || ""
    });
  }

  function closeSkillEditor() {
    setEditingSkillId("");
    setSkillForm({ name: "", description: "", trigger: "" });
  }

  function submitSkillEdit(event) {
    event.preventDefault();
    if (!editingSkillId) return;
    adoptSkill(editingSkillId, {
      name: skillForm.name.trim(),
      description: skillForm.description.trim(),
      trigger: skillForm.trigger.trim()
    });
    closeSkillEditor();
  }

  function processSkillFiles(files) {
    if (!files.length) return;
    if (!areDocsComplete()) {
      toast("请先补齐业务资料");
      startDocsFlow(true);
      return;
    }

    const generatedSkills = files.map(buildSkillFromFile);
    setFlow(prev => ({
      ...prev,
      currentPhase: 5,
      messages: [
        ...prev.messages,
        createMessage("user", { text: `已上传文件：${files.map(file => file.name).join("、")}` }),
        createMessage("agent", {
          title: "已解析上传的 skill 文件",
          text: `本轮共识别到 ${generatedSkills.length} 条能力，已直接加入技能栈。现在继续对接外部系统。`,
          actions: [{ label: "进入外部系统 →", action: "startIntegrations", primary: true }]
        })
      ],
      skills: {
        ...prev.skills,
        customCount: prev.skills.customCount + generatedSkills.length,
        adopted: [...prev.skills.adopted, ...generatedSkills],
        coveredTypes: [...prev.skills.coveredTypes, ...generatedSkills.map(s => s.type)]
      }
    }));
    toast("Skill 文件已处理");
  }

  function createSkillFromText(text) {
    const generated = buildGeneratedSkillFromText(text);
    setFlow(prev => ({
      ...prev,
      currentPhase: 5,
      messages: [
        ...prev.messages,
        createMessage("user", { text }),
        createMessage("agent", {
          title: "已生成能力定义",
          text: "已将描述转化为技能并加入技能栈，现在继续对接外部系统。",
          actions: [{ label: "进入外部系统 →", action: "startIntegrations", primary: true }]
        })
      ],
      skills: {
        ...prev.skills,
        customCount: prev.skills.customCount + 1,
        adopted: [generated, ...prev.skills.adopted],
        coveredTypes: [generated.type, ...prev.skills.coveredTypes]
      }
    }));
  }

  function suggestIntegrations(forceMessage) {
    setFlow(prev => ({
      ...prev,
      currentPhase: Math.max(prev.currentPhase, 5),
      messages: forceMessage
        ? [
            ...prev.messages,
            createMessage("agent", {
              title: "开始对接外部系统",
              text: "要让技能真正跑起来，需要接入 CRM、OMS、工单系统和 IM 平台。你可以在对话里直接贴参数，也可以点系统卡片填写表单。",
              card: {
                type: "system",
                items: INTEGRATION_DEFINITIONS.map(item => ({
                  ...item,
                  fields: "endpoint / apiKey / webhook / timeout"
                }))
              }
            })
          ]
        : prev.messages
    }));
  }

  function openSystemDrawer(systemId) {
    const system = INTEGRATION_DEFINITIONS.find(item => item.id === systemId);
    if (!system) return;
    const savedConfig = flowRef.current.integrations.configs[systemId] || {};
    setActiveSystemId(systemId);
    setSystemForm({
      endpoint: savedConfig.endpoint || "",
      apiKey: savedConfig.apiKey || "",
      webhook: savedConfig.webhook || "",
      timeout: savedConfig.timeout || 30
    });
    setDrawerFeedback(system.purpose);
  }

  function closeSystemDrawer() {
    setActiveSystemId(null);
    setDrawerFeedback("");
  }

  function handleSystemFormChange(event) {
    const { name, value } = event.target;
    setSystemForm(prev => ({
      ...prev,
      [name]: name === "timeout" ? Number(value || 30) : value
    }));
  }

  function testCurrentSystem() {
    if (!activeSystemId) return;
    if (!systemForm.endpoint && !systemForm.apiKey) {
      const demoConfig = buildDemoConfig(activeSystemId);
      setDrawerFeedback(`当前是原型演示，你可以直接保存。将使用演示配置：${demoConfig.endpoint}`);
      toast("可直接保存演示配置");
      return;
    }

    const result = validateConfig(systemForm);
    setDrawerFeedback(result.ok ? "✓ 测试通过，连接已就绪。" : result.reason);
    toast(result.ok ? "测试通过" : "连接测试失败");
  }

  function saveSystemConfig(event) {
    event.preventDefault();
    if (!activeSystemId) return;

    const finalConfig = normalizeSystemConfig(activeSystemId, systemForm);
    const system = INTEGRATION_DEFINITIONS.find(item => item.id === activeSystemId);
    const willFinish = !flowRef.current.integrations.done.includes(activeSystemId)
      ? flowRef.current.integrations.done.length + 1 >= INTEGRATION_DEFINITIONS.length
      : flowRef.current.integrations.done.length >= INTEGRATION_DEFINITIONS.length;

    setFlow(prev => {
      const doneSet = new Set(prev.integrations.done);
      doneSet.add(activeSystemId);

      const messages = [
        ...prev.messages,
        createMessage("agent", {
          title: `已连通 ${system.name}`,
          text: willFinish
            ? "所有系统都已就绪，下一步可以生成实例包。"
            : "参数已保存，继续推进剩余系统配置。"
        })
      ];

      if (willFinish) {
        messages.push(createMessage("agent", {
          title: "所有系统都连通了",
          text: "连接层已经就位，接下来把资料、技能和系统配置一起打成实例包。",
          actions: [{ label: "生成实例包 →", action: "generatePackage", primary: true }]
        }));
      }

      return {
        ...prev,
        currentPhase: willFinish ? 6 : Math.max(prev.currentPhase, 5),
        messages,
        integrations: {
          ...prev.integrations,
          configs: {
            ...prev.integrations.configs,
            [activeSystemId]: finalConfig
          },
          done: Array.from(doneSet),
          failed: prev.integrations.failed.filter(item => item !== activeSystemId)
        }
      };
    });

    syncExistingProgress(willFinish ? 5 : 4);
    setDrawerFeedback(finalConfig.__demo ? `已保存演示配置：${finalConfig.endpoint}` : "✓ 配置已保存。");
    toast("系统配置已保存");
    closeSystemDrawer();
  }

  function processIntegrationText(text) {
    const results = parseIntegrationText(text);
    if (!results.length) {
      setFlow(prev => ({
        ...prev,
        messages: [
          ...prev.messages,
          createMessage("user", { text }),
          createMessage("agent", {
            title: "没有识别到系统参数",
            text: "可以直接写「CRM 接口是 https://...，密钥是 sk-...」，或者点系统卡片走表单填写。"
          })
        ]
      }));
      return;
    }

    const nextDone = new Set(flowRef.current.integrations.done);
    const configs = { ...flowRef.current.integrations.configs };
    const cards = [];
    results.forEach(result => {
      configs[result.systemId] = result.config;
      const test = validateConfig(result.config);
      if (test.ok) nextDone.add(result.systemId);
      cards.push({
        label: INTEGRATION_DEFINITIONS.find(item => item.id === result.systemId).name,
        detail: test.ok ? `已确认参数并通过测试：${result.config.endpoint}` : `测试失败：${test.reason}`
      });
    });

    const doneCount = nextDone.size;
    const willFinish = doneCount >= INTEGRATION_DEFINITIONS.length;

    setFlow(prev => ({
      ...prev,
      currentPhase: willFinish ? 6 : Math.max(prev.currentPhase, 5),
      messages: [
        ...prev.messages,
        createMessage("user", { text }),
        createMessage("agent", {
          title: "参数都匹配上了",
          text: "对话里的系统参数已经映射到对应配置里，并做了一次最小连通性检查。",
          card: {
            type: "fileSummary",
            items: cards
          },
          actions: willFinish
            ? [{ label: "生成实例包 →", action: "generatePackage", primary: true }]
            : [{ label: "继续配置系统", action: "startIntegrations" }]
        }),
        ...(willFinish ? [createMessage("agent", {
          title: "所有系统都连通了",
          text: "连接层已经就位，接下来把资料、技能和系统配置一起打成实例包。"
        })] : [])
      ],
      integrations: {
        ...prev.integrations,
        configs: {
          ...prev.integrations.configs,
          ...configs
        },
        done: Array.from(nextDone)
      }
    }));

    if (willFinish) syncExistingProgress(5);
  }

  function generatePackage() {
    if (!areDocsComplete()) {
      toast("请先补齐业务资料");
      return;
    }
    if (!areSkillsReady()) {
      toast("请先补齐查询、处理、升级三类技能");
      return;
    }
    if (!areIntegrationsReady()) {
      toast("请先完成全部系统连接");
      return;
    }
    if (flowRef.current.package.generated) {
      toast("实例包已经生成");
      return;
    }

    setFlow(prev => ({
      ...prev,
      currentPhase: 6,
      messages: [
        ...prev.messages,
        createMessage("agent", {
          title: "正在打包实例……",
          text: "正在整理入职档案、归档知识库索引、封装技能模块、固化系统连接配置。"
        })
      ]
    }));

    const timerId = window.setTimeout(() => {
      setFlow(prev => {
        const meta = buildPackageMeta(prev, assistantName());
        return {
          ...prev,
          package: {
            generated: true,
            meta
          },
          messages: [
            ...prev.messages,
            createMessage("agent", {
              title: "准备好了，可以进入 AI 评估",
              text: "资料、技能和系统配置都已经打包完成。你可以先导出实例包，也可以直接进入后续评估。",
              card: {
                type: "package",
                meta
              },
              actions: [
                { label: "保存实例包", action: "savePackage" },
                { label: "进入 AI 评估 →", action: "enterEvaluation", primary: true }
              ]
            })
          ]
        };
      });
      syncExistingProgress(6);
      toast("实例包已生成");
    }, 1400);

    rememberTimer(timerId);
  }

  function downloadPackage() {
    if (!flowRef.current.package.meta) return;

    const payload = buildPackagePayload(flowRef.current, assistantName());
    if (window.JSZip) {
      const zip = new window.JSZip();
      zip.file("manifest.json", JSON.stringify(payload.manifest, null, 2));
      zip.file("knowledge/index.json", JSON.stringify(payload.knowledge, null, 2));
      zip.file("skills/index.json", JSON.stringify(payload.skills, null, 2));
      zip.file("integrations/config.json", JSON.stringify(payload.integrations, null, 2));
      zip.generateAsync({ type: "blob" }).then(blob => {
        triggerDownload(blob, `${flowRef.current.package.meta.name}.zip`);
        toast("已导出 zip 实例包");
      });
      return;
    }

    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    triggerDownload(blob, `${flowRef.current.package.meta.name}.json`);
    toast("当前原型未挂载 zip 库，已导出 JSON 预览");
  }

  function deployPackage() {
    toast("原型演示：这里将执行一键部署");
  }

  function copyCommand() {
    const packageName = flowRef.current.package.meta ? flowRef.current.package.meta.name : "digital-employee";
    const command = `ncrew deploy --package "${packageName}" --env prod`;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(command).then(() => {
        toast("部署指令已复制");
      });
      return;
    }

    const helper = document.createElement("textarea");
    helper.value = command;
    document.body.appendChild(helper);
    helper.select();
    document.execCommand("copy");
    helper.remove();
    toast("部署指令已复制");
  }

  function createDepartmentEmployeeForTemplate() {
    const baseName = `${template.name} · 新雇佣版`;
    const name = window.uniqueName(baseName, window.DEPT_EMPLOYEES);
    return window.addDepartmentEmployee({
      id: window.generateId("de"),
      type: "department",
      name,
      initial: (template.initial || name).slice(0, 2),
      tint: template.tint || "blue",
      template: template.id,
      status: "interning_ai",
      desc: template.summary,
      owner: "李部门长",
      dept: "研发部",
      updated: "刚刚",
      tags: [...(template.tags || []).slice(0, 2), "新雇佣"],
      evalProgress: 0,
      hireProgress: 6
    });
  }

  function enterEvaluation() {
    if (!flowRef.current.package.generated) {
      toast("请先生成实例包");
      return;
    }

    let target = existing;
    if (!target) {
      target = createDepartmentEmployeeForTemplate();
    } else {
      window.updateEmployee(target.id, {
        status: "interning_ai",
        evalProgress: 0,
        hireProgress: 6,
        updated: "刚刚"
      });
    }

    clearFlowCache(cacheKey);
    toast("雇佣阶段完成，进入 AI 评估");
    go(`eval-ai/${target.id}`);
  }

  function guideCurrentPhase() {
    const current = flowRef.current.currentPhase;
    if (flowRef.current.package.generated) {
      setFlow(prev => ({
        ...prev,
        messages: [
          ...prev.messages,
          createMessage("agent", {
            title: "实例包已经准备好了",
            text: "你可以直接导出实例包，或者继续进入 AI 评估。",
            actions: [{ label: "进入 AI 评估 →", action: "enterEvaluation", primary: true }]
          })
        ]
      }));
      return;
    }

    if (current <= 3) startDocsFlow(true);
    else if (current === 4) suggestSkills(true);
    else if (current === 5) suggestIntegrations(true);
    else {
      setFlow(prev => ({
        ...prev,
        messages: [
          ...prev.messages,
          createMessage("agent", {
            title: "已进入打包阶段",
            text: "资料、技能和系统都就位之后，就可以开始生成实例包了。",
            actions: [{ label: "生成实例包 →", action: "generatePackage", primary: true }]
          })
        ]
      }));
    }
  }

  function jumpToPhase(phase) {
    if (phase <= 3) {
      startDocsFlow(true);
      return;
    }
    if (phase === 4) {
      suggestSkills(true);
      return;
    }
    if (phase === 5) {
      suggestIntegrations(true);
      return;
    }
    setFlow(prev => ({
      ...prev,
      currentPhase: 6,
      messages: [
        ...prev.messages,
        createMessage("agent", {
          title: "你查看了打包阶段",
          text: flowRef.current.package.generated
            ? "实例包已经生成，可以直接导出或进入 AI 评估。"
            : "完成系统对接后，这里会展示最终的实例包结构。"
        })
      ]
    }));
  }

  function handleAction(action, payload) {
    if (action === "startDocs") startDocsFlow(true);
    else if (action === "startSkills") suggestSkills(true);
    else if (action === "startIntegrations") suggestIntegrations(true);
    else if (action === "adoptSkill") adoptSkill(payload.skillId);
    else if (action === "ignoreSkill") ignoreSkill(payload.skillId);
    else if (action === "editSkill") openSkillEditor(payload.skillId);
    else if (action === "openSystem") openSystemDrawer(payload.systemId);
    else if (action === "generatePackage") generatePackage();
    else if (action === "savePackage") {
      saveFlowDraft();
      toast("实例包已保存");
    }
    else if (action === "downloadPackage") downloadPackage();
    else if (action === "deployPackage") deployPackage();
    else if (action === "copyCommand") copyCommand();
    else if (action === "enterEvaluation") enterEvaluation();
  }

  function handleTextSubmit() {
    const text = draft.trim();
    if (!text) return;
    setDraft("");

    if (flowRef.current.currentPhase <= 3 || !areDocsComplete()) {
      processBusinessText(text);
      return;
    }
    if (flowRef.current.currentPhase === 4) {
      createSkillFromText(text);
      return;
    }
    if (flowRef.current.currentPhase === 5) {
      processIntegrationText(text);
      return;
    }

    setFlow(prev => ({
      ...prev,
      messages: [
        ...prev.messages,
        createMessage("user", { text }),
        createMessage("agent", {
          title: "已记录你的补充",
          text: prev.package.generated ? "实例包已经生成，后续建议直接进入 AI 评估继续验证。" : "如果你已经确认资料、技能和系统都齐备，就可以开始生成实例包了。",
          actions: prev.package.generated ? [{ label: "进入 AI 评估 →", action: "enterEvaluation", primary: true }] : [{ label: "生成实例包 →", action: "generatePackage", primary: true }]
        })
      ]
    }));
  }

  function onBusinessInputChange(event) {
    const files = Array.from(event.target.files || []);
    processBusinessFiles(files);
    event.target.value = "";
  }

  function onSkillInputChange(event) {
    const files = Array.from(event.target.files || []);
    processSkillFiles(files);
    event.target.value = "";
  }

  function handleDrop(event) {
    event.preventDefault();
    setDropActive(false);
    const files = Array.from(event.dataTransfer.files || []);
    if (!files.length) return;
    if (flowRef.current.currentPhase <= 3 || !areDocsComplete()) processBusinessFiles(files);
    else processSkillFiles(files);
  }

  const currentProcessIndex = mapPhaseToProcessIndex(flow.currentPhase);
  const currentSystem = INTEGRATION_DEFINITIONS.find(item => item.id === activeSystemId);
  const resumeLabel = flow.package.generated ? "进入 AI 评估" : "从当前阶段继续";

  return (
    <div className="page">
      <window.Crumb label={`返回${isBranchFlow ? "我的数字员工" : "部门数字员工"}`} onClick={() => go(backTo)} />

      <div className={`hire-flow-v2 ${flow.background === "cool" ? "is-bg-cool" : ""}`}>
        <div className="app-shell">
          <header className="topbar">
            <div>
              <p className="eyebrow">Future Colleague Onboarding</p>
              <h1>数字员工雇佣流程</h1>
            </div>
            <div className="topbar-actions">
              <button className="ghost-btn" onClick={saveFlowDraft}>保存</button>
              <button className="ghost-btn" onClick={resetFlow}>重置流程</button>
              <button className="primary-btn" onClick={flow.package.generated ? enterEvaluation : guideCurrentPhase}>{resumeLabel}</button>
            </div>
          </header>

          <section className="journey-strip">
            <div className="journey-strip-head">
              <div>
                <p className="eyebrow">Hiring Journey</p>
                <h2>流程步骤</h2>
              </div>
              <p className="journey-summary">
                {existing
                  ? `当前正在处理「${existing.name}」的雇佣环节。`
                  : `当前模板为「${template.name}」，完成资料、技能、系统与实例包四段闭环后进入 AI 评估。`}
              </p>
            </div>
            <div className="step-bar">
              {PROCESS_STEPS.map((step, index) => {
                const progress = progressForStep(step, flow);
                const status = progress >= 1 || index < currentProcessIndex
                  ? "done"
                  : index === currentProcessIndex
                    ? "active"
                    : "pending";

                return (
                  <button key={step.id} type="button" className={`step-pill is-${status}`} onClick={() => jumpToPhase(step.phase)}>
                    <span className="step-index">{index + 1}</span>
                    <span className="step-copy">
                      <strong>{step.label}</strong>
                      <small>{step.short}</small>
                    </span>
                  </button>
                );
              })}
            </div>
          </section>

          <main className="layout">
            <section className="chat-panel panel">
              <div className="panel-head">
                <div className="employee-chip">
                  <div className="avatar">{(existing ? existing.initial : template.initial || "雇").slice(0, 2)}</div>
                  <div>
                    <strong>{assistantName()}</strong>
                    <span>{isBranchFlow ? "私人定制流程" : existing ? "继续雇佣中" : "模板新雇佣"}</span>
                  </div>
                </div>
              </div>

              <div className="chat-feed">
                {flow.messages.map(message => (
                  <HireMessageRow key={message.id} message={message} flow={flow} onAction={handleAction} />
                ))}
              </div>

              <div className="composer">
                <div className="composer-box">
                  <div
                    className={`input-wrap ${dropActive ? "active" : ""}`}
                    onDragEnter={event => {
                      event.preventDefault();
                      setDropActive(true);
                    }}
                    onDragOver={event => {
                      event.preventDefault();
                      setDropActive(true);
                    }}
                    onDragLeave={event => {
                      event.preventDefault();
                      setDropActive(false);
                    }}
                    onDrop={handleDrop}
                  >
                    <textarea
                      className="chat-input"
                      rows="3"
                      value={draft}
                      onChange={event => setDraft(event.target.value)}
                      placeholder="输入业务说明、技能需求或系统参数。回车发送，Shift + 回车换行。"
                      onKeyDown={event => {
                        if (event.key === "Enter" && !event.shiftKey) {
                          event.preventDefault();
                          handleTextSubmit();
                        }
                      }}
                    ></textarea>
                    <div className="input-toolbar">
                      <div className="composer-tools">
                        <button type="button" className="tool-btn" onClick={() => businessFileInputRef.current && businessFileInputRef.current.click()}>文件上传</button>
                        <button
                          type="button"
                          className="tool-btn"
                          onClick={() => {
                            if (!areDocsComplete()) {
                              toast("请先补齐业务资料");
                              startDocsFlow(true);
                              return;
                            }
                            if (skillFileInputRef.current) skillFileInputRef.current.click();
                          }}
                        >
                          skill
                        </button>
                      </div>
                      <button type="button" className="send-btn" onClick={handleTextSubmit}>发送</button>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <aside className="todo-panel panel">
              <div className="panel-head">
                <div>
                  <p className="eyebrow">Progress Ledger</p>
                  <h2>待办事项</h2>
                </div>
                <div className="score-card">
                  <span>{completionRatio()}%</span>
                  <small>完成度</small>
                </div>
              </div>

              <div className="todo-groups">
                {todoItems().map(item => {
                  const status = stepStatus(item);
                  return (
                    <div key={item.id} type="button" className={`todo-item ${flow.currentPhase >= item.phase ? "active" : ""}`} onClick={() => jumpToPhase(item.phase)}>
                      <div className="todo-head">
                        <div>
                          <h3>{item.title}</h3>
                          <p>{item.description}</p>
                        </div>
                        <div className={`todo-status ${status.className}`}>
                          <span className="status-icon">{status.icon}</span>
                          <span>{status.label}</span>
                        </div>
                      </div>
                      <div className="todo-progress"><span style={{ width: `${Math.round(item.progress * 100)}%` }}></span></div>

                      {item.subtasks.length > 0 && (
                        <div className="todo-subtasks">
                          {item.subtasks.map(label => {
                            const sub = subtaskStatus(item.id, label);
                            const system = item.id === "integrations" ? INTEGRATION_DEFINITIONS.find(entry => entry.name === label) : null;
                            const config = system && flow.integrations.configs[system.id];
                            return system ? (
                              <button key={label} type="button" className={`subtask-chip subtask-chip-action ${sub.className}`} onClick={event => {
                                event.stopPropagation();
                                openSystemDrawer(system.id);
                              }}>
                                <div className="subtask-label-group">
                                  <span>{label}</span>
                                  {config && flow.integrations.done.includes(system.id) && <small className="subtask-hint">{renderIntegrationSummary(config)}</small>}
                                </div>
                                <strong>{sub.icon} {sub.label}</strong>
                              </button>
                            ) : (
                              <div key={label} className={`subtask-chip ${sub.className}`}>
                                <span>{label}</span>
                                <strong>{sub.icon} {sub.label}</strong>
                              </div>
                            );
                          })}
                        </div>
                      )}

                      {item.id === "package" && flow.package.meta && (
                        <div className="todo-package-preview">
                          <div className="todo-package-badge">
                            <span className="todo-package-icon">📦</span>
                            <span className="todo-package-name">{flow.package.meta.name}</span>
                            <span className="todo-package-status">已生成</span>
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}

                {!flow.messages.length && (
                  <p className="empty-tip">雇佣引导会从左侧会话开始。点击"开始第一步"后，右侧待办会跟随推进。</p>
                )}
              </div>
            </aside>
          </main>
        </div>

        <HireSystemDrawer
          open={!!activeSystemId}
          system={currentSystem}
          form={systemForm}
          feedback={drawerFeedback}
          onChange={handleSystemFormChange}
          onClose={closeSystemDrawer}
          onTest={testCurrentSystem}
          onSubmit={saveSystemConfig}
        />

        <HireSkillModal
          open={!!editingSkillId}
          form={skillForm}
          onChange={event => {
            const { name, value } = event.target;
            setSkillForm(prev => ({ ...prev, [name]: value }));
          }}
          onClose={closeSkillEditor}
          onSubmit={submitSkillEdit}
        />

        {flow.package.generated && (
          <button className="float-evaluation-btn" onClick={enterEvaluation}>
            进入 AI 评估 →
          </button>
        )}

        <input ref={businessFileInputRef} type="file" multiple hidden onChange={onBusinessInputChange} />
        <input ref={skillFileInputRef} type="file" multiple hidden onChange={onSkillInputChange} />
      </div>
    </div>
  );
}

// ===== Score Trend Chart =====
function EvalScoreTrendChart({ iterations }) {
  const W = 320;
  const H = 100;
  const PAD = { top: 12, right: 16, bottom: 20, left: 28 };
  const innerW = W - PAD.left - PAD.right;
  const innerH = H - PAD.top - PAD.bottom;

  const scores = iterations.map(it => it.score);
  const maxX = Math.max(iterations.length - 1, 1);
  const passingScore = 75;

  const px = i => PAD.left + (i / maxX) * innerW;
  const py = s => PAD.top + innerH - (s / 100) * innerH;

  const pathD = scores.map((s, i) => `${i === 0 ? 'M' : 'L'} ${px(i)} ${py(s)}`).join(' ');
  const areaD = `${pathD} L ${px(scores.length - 1)} ${PAD.top + innerH} L ${PAD.left} ${PAD.top + innerH} Z`;
  const thresholdY = py(passingScore);

  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ maxHeight: 100 }}>
      {[0, 25, 50, 75, 100].map(v => (
        <line key={v} x1={PAD.left} y1={py(v)} x2={W - PAD.right} y2={py(v)} stroke="#f1f5f9" strokeWidth="1" />
      ))}
      <line x1={PAD.left} y1={thresholdY} x2={W - PAD.right} y2={thresholdY} stroke="#22c55e" strokeWidth="1.5" strokeDasharray="4 3" />
      <text x={W - PAD.right + 2} y={thresholdY + 3} fontSize="9" fill="#22c55e">合格线 75</text>
      <path d={areaD} fill="#6366f1" fillOpacity="0.08" />
      <path d={pathD} fill="none" stroke="#6366f1" strokeWidth="2" strokeLinejoin="round" />
      {scores.map((s, i) => {
        const passed = iterations[i].passed;
        return (
          <g key={i}>
            <circle cx={px(i)} cy={py(s)} r="4" fill={passed ? '#22c55e' : '#6366f1'} stroke="white" strokeWidth="1.5" />
            <text x={px(i)} y={py(s) - 8} textAnchor="middle" fontSize="10" fontWeight="600" fill={passed ? '#16a34a' : '#6366f1'}>
              {s}
            </text>
            <text x={px(i)} y={PAD.top + innerH + 14} textAnchor="middle" fontSize="9" fill="#94a3b8">
              第{i + 1}轮
            </text>
          </g>
        );
      })}
    </svg>
  );
}

// ===== Summary Report Panel =====
function EvalSummaryReportPanel({ iterations }) {
  const finalIteration = iterations[iterations.length - 1];
  const firstIteration = iterations[0];
  const improvement = finalIteration.score - firstIteration.score;

  const allModifications = iterations.flatMap(it =>
    it.modifications.map(mod => ({ round: it.round, ...mod }))
  );

  const dimensionNames = ['功能完整性', '交互质量', '流程合规', '问题解决', '工具调用正确性'];

  return (
    <div className="eval-summary-panel">
      <div className={`eval-result-box ${finalIteration.passed ? 'passed' : 'failed'}`}>
        <div className={`eval-result-icon ${finalIteration.passed ? 'passed' : 'failed'}`}>
          {finalIteration.passed ? '✓' : '×'}
        </div>
        <div className={`eval-result-title ${finalIteration.passed ? 'passed' : 'failed'}`}>
          {finalIteration.passed ? '评估通过' : '训练失败'}
        </div>
        <p className="eval-result-desc">
          第 {iterations.length} 轮达到{finalIteration.passed ? '合格线' : '最大轮次'}，综合得分 {finalIteration.score} 分
        </p>
      </div>

      <div className="eval-stats-grid">
        <div className="eval-stat-box">
          <div className="eval-stat-value indigo">{iterations.length}</div>
          <div className="eval-stat-label">训练轮次</div>
        </div>
        <div className="eval-stat-box">
          <div className={`eval-stat-value ${improvement > 0 ? 'green' : 'red'}`}>
            {improvement > 0 ? '+' : ''}{improvement}
          </div>
          <div className="eval-stat-label">分数提升</div>
        </div>
        <div className="eval-stat-box">
          <div className="eval-stat-value amber">{allModifications.length}</div>
          <div className="eval-stat-label">修改次数</div>
        </div>
      </div>

      <div className="eval-section">
        <div className="eval-section-title">得分趋势</div>
        <div className="eval-chart-wrap">
          <EvalScoreTrendChart iterations={iterations} />
        </div>
      </div>

      <div className="eval-section">
        <div className="eval-section-title">维度得分对比</div>
        <div className="eval-dim-table">
          <table>
            <thead>
              <tr>
                <th>维度</th>
                {iterations.map(it => <th key={it.round}>第{it.round}轮</th>)}
                <th className="green">目标</th>
              </tr>
            </thead>
            <tbody>
              {dimensionNames.map(dimName => {
                const scoresByRound = iterations.map(it =>
                  it.dimensions.find(d => d.name === dimName)?.score || 0
                );
                const finalScore = scoresByRound[scoresByRound.length - 1];
                const reached = finalScore >= 75;
                return (
                  <tr key={dimName}>
                    <td>{dimName}</td>
                    {scoresByRound.map((score, i) => (
                      <td key={i} className={i === scoresByRound.length - 1 ? (reached ? 'green' : 'red') : ''}>
                        {score}
                        {i > 0 && score > scoresByRound[i-1] && <span className="arrow-up">↑</span>}
                      </td>
                    ))}
                    <td className="gray">75</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {allModifications.length > 0 && (
        <div className="eval-section">
          <div className="eval-section-title">修改历史</div>
          <div className="eval-mod-list">
            {allModifications.map(mod => (
              <div key={mod.id} className="eval-mod-card">
                <div className="eval-mod-head">
                  <span className="eval-mod-round">{mod.round}</span>
                  <span className="eval-mod-title">{mod.title}</span>
                  <span className="eval-mod-type">
                    {mod.type === 'system_prompt' ? 'Prompt' : mod.type === 'tool_config' ? '工具' : 'Few-shot'}
                  </span>
                </div>
                <div className="eval-mod-diff">
                  <div className="eval-mod-before">
                    <div className="eval-mod-label red">修改前</div>
                    <div>{mod.before}</div>
                  </div>
                  <div className="eval-mod-after">
                    <div className="eval-mod-label green">修改后</div>
                    <div>{mod.after}</div>
                  </div>
                </div>
                <div className="eval-mod-gain">预期效果：{mod.expectedGain}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="eval-conclusion">
        <div className="eval-conclusion-title">总结</div>
        <p>
          该数字员工经过 <strong>{iterations.length} 轮训练</strong>，从初始 <strong>{firstIteration.score} 分</strong> 提升至
          <strong className={finalIteration.passed ? 'green' : 'red'}> {finalIteration.score} 分</strong>，
          {finalIteration.passed ? '已达到合格标准，具备上岗能力。' : '未能达到合格标准，建议人工介入调整或重新设计。'}
        </p>
        {!finalIteration.passed && (
          <p className="amber">训练已达到最大轮次限制，系统自动停止。</p>
        )}
      </div>
    </div>
  );
}

        <span className="eval-msg-summary-total">/100</span>
        {msg.issues && msg.issues.length > 0 && (
          <div className="eval-msg-summary-issues">
            {msg.issues.map((issue, i) => (
              <span key={i} className="eval-msg-summary-issue">{issue}</span>
            ))}
          </div>
        )}
      </div>
    );
  }

  if (msg.type === 'final_result') {
    return (
      <div className="eval-msg-final">
        <span className="eval-msg-final-icon">✓</span>
        <div>
          <div className="eval-msg-final-title">评估训练完成</div>
          <div className="eval-msg-final-desc">员工已通过评估，可办理转正上岗</div>
        </div>
      </div>
    );
  }

  if (msg.type === 'user') {
    return (
      <div className="eval-msg-user">
        <div className="eval-msg-user-bubble">{msg.content}</div>
      </div>
    );
  }

  // assistant
  return (
    <div className="eval-msg-assistant">
      <div className="eval-msg-assistant-bubble">
        {msg.content.split('**').map((part, i) =>
          i % 2 === 1 ? <strong key={i}>{part}</strong> : part
        )}
      </div>
    </div>
  );
}

// ===== Report Panel =====
function EvalReportPanel({ iteration }) {
  const dimColor = (score, threshold) => {
    const t = typeof threshold === 'number' ? threshold : 60;
    return score >= t ? 'green' : score >= 60 ? 'amber' : 'red';
  };

  return (
    <div className="eval-report-panel">
      {iteration.ontologySource && (
        <div className="eval-report-source">
          <div className="eval-report-source-label">评估标准来源</div>
          <div className="eval-report-source-content">
            本体图谱: {iteration.ontologySource.roleTypeId} ({iteration.ontologySource.roleName})
          </div>
        </div>
      )}

      <div className={`eval-report-score-box ${iteration.passed ? 'passed' : 'failed'}`}>
        <div className={`eval-report-score ${iteration.passed ? 'passed' : 'failed'}`}>
          {iteration.score}
        </div>
        <div className="eval-report-score-label">综合评分</div>
        <span className={`eval-report-badge ${iteration.passed ? 'passed' : 'failed'}`}>
          {iteration.passed ? '✓ AI 判定：合格' : '× AI 判定：不合格'}
        </span>
      </div>

      <div className="eval-report-section">
        <div className="eval-report-section-label">维度评分</div>
        <div className="eval-report-dims">
          {iteration.dimensions.map(d => (
            <div key={d.name} className="eval-report-dim">
              <div className="eval-report-dim-head">
                <span>{d.name}</span>
                <span className={`eval-report-dim-score ${dimColor(d.score, d.threshold)}`}>{d.score}</span>
              </div>
              <div className="eval-report-dim-bar">
                <div className={`eval-report-dim-fill ${dimColor(d.score, d.threshold)}`} style={{ width: `${d.score}%` }} />
              </div>
              <div className="eval-report-dim-foot">
                <span>权重 {d.weight}</span>
                <span>合格线: {typeof d.threshold === 'number' ? d.threshold + '分' : d.threshold}</span>
                <span className={dimColor(d.score, d.threshold)}>{d.status}</span>
              </div>
            </div>
          ))}
        </div>
      </div>

      {iteration.issues.length > 0 && (
        <div className="eval-report-section">
          <div className="eval-report-section-label red">发现的问题</div>
          <div className="eval-report-issues">
            {iteration.issues.map(issue => (
              <div key={issue.id} className="eval-report-issue">
                <div className="eval-report-issue-head">
                  <div>
                    <div className="eval-report-issue-title">{issue.title}</div>
                    <div className="eval-report-issue-impact">影响：{issue.impact}</div>
                  </div>
                  <span className={`eval-report-issue-severity ${issue.severity}`}>{issue.severity}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {iteration.modifications.length > 0 && (
        <div className="eval-report-section">
          <div className="eval-report-section-label indigo">本轮修改方案</div>
          <div className="eval-report-mods">
            {iteration.modifications.map(mod => (
              <div key={mod.id} className="eval-report-mod">
                <div className="eval-report-mod-title">{mod.title}</div>
                <span className="eval-report-mod-type">
                  {mod.type === 'system_prompt' ? 'System Prompt' : mod.type === 'tool_config' ? '工具配置' : 'Few-shot'}
                </span>
                <div className="eval-report-mod-diff">
                  <div>
                    <div className="eval-report-mod-label red">修改前</div>
                    <div className="eval-report-mod-before">{mod.before}</div>
                  </div>
                  <div>
                    <div className="eval-report-mod-label green">修改后</div>
                    <div className="eval-report-mod-after">{mod.after}</div>
                  </div>
                </div>
                <div className="eval-report-mod-gain">预期提升：{mod.expectedGain}</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ===== Progress Bar =====
function EvalProgressBar({ currentIteration, maxIterations, currentStep }) {
  const stepProgress = ((currentStep + 1) / EVAL_STEPS.length) * 100;

  return (
    <div className="eval-progress-bar">
      <div className="eval-progress-head">
        <div className="eval-progress-iter">
          <span className="eval-progress-iter-label">第 {currentIteration}/{maxIterations} 评训轮次</span>
          {currentIteration > 1 && (
            <span className="eval-progress-iter-done">已完成 {currentIteration - 1} 轮 ✓</span>
          )}
        </div>
        <span className="eval-progress-percent">总进度 {Math.round((currentIteration / maxIterations) * 100)}%</span>
      </div>
      <div className="eval-progress-track">
        <div className="eval-progress-fill" style={{ width: `${stepProgress}%` }} />
      </div>
      <div className="eval-progress-steps">
        {EVAL_STEPS.map((label, i) => (
          <div key={i} className="eval-progress-step">
            <div className={`eval-progress-step-pill ${i < currentStep ? 'done' : i === currentStep ? 'active' : 'pending'}`}>
              {i < currentStep && <span className="eval-progress-step-check">✓</span>}
              {i === currentStep && <span className="eval-progress-step-spinner">⟳</span>}
              {label}
              {(i === 0 || i === 1) && currentStep > i && <span className="eval-progress-step-auto">⚡</span>}
            </div>
            {i < EVAL_STEPS.length - 1 && <span className="eval-progress-step-arrow">→</span>}
          </div>
        ))}
      </div>
    </div>
  );
}

function HumanChatMessage({ msg, scenarios, onVerdictSubmit, onOnboardingSubmit }) {
  if (msg.type === 'scenario_divider') {
    return (
      <div className="human-msg-divider">
        <span>═══ {msg.content} ═══</span>
      </div>
    );
