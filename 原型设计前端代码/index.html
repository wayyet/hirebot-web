  return `<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人工评估综合报告 - ${employee.name}</title>
  <style>${styles}</style>
</head>
<body>
  <div class="container">
    <div class="header ${allPassed ? 'passed' : 'amber'}">
      <div class="icon">${allPassed ? '✓' : '⚠'}</div>

      <p class="subtitle">${employee.name} · ${employee.desc || '数字员工'} · 评估时间: ${now}</p>
    </div>

    <div class="stats">
      <div class="stat"><div class="stat-value indigo">${total}</div><div class="stat-label">评估场景</div></div>
      <div class="stat"><div class="stat-value green">${passed}</div><div class="stat-label">通过场景</div></div>
      <div class="stat"><div class="stat-value red">${failed}</div><div class="stat-label">未通过场景</div></div>
      <div class="stat"><div class="stat-value ${passRate >= 100 ? 'green' : passRate >= 80 ? 'amber' : 'red'}">${passRate}%</div><div class="stat-label">通过率</div></div>
    </div>

    <div class="rate-bar">
      <div class="rate-label">通过率 ${passRate}%</div>
      <div class="rate-track"><div class="rate-fill ${passRate >= 100 ? 'green' : passRate >= 80 ? 'amber' : 'red'}" style="width: ${passRate}%"></div></div>
      <div class="rate-mark">合格线 100%</div>
    </div>

    <div class="scenarios">
      <div class="scenarios-title">场景评估详情</div>
      ${scenarios.map(s => `
      <div class="scenario-card ${s.verdict}">
        <div class="scenario-head">
          <span class="scenario-icon">${s.verdict === 'passed' ? '✓' : '×'}</span>
          <span class="scenario-name">${s.scenario_name}</span>

        <div class="scenario-stats">
          <div class="scenario-stat"><strong class="indigo">${s.message_count}</strong><label>对话轮数</label></div>
          <div class="scenario-stat"><strong class="${s.verdict === 'passed' ? 'green' : 'red'}">${s.verdict === 'passed' ? '100%' : '0%'}</strong><label>场景通过率</label></div>
          <div class="scenario-stat"><strong>15min</strong><label>评估耗时</label></div>
        </div>
        <div class="dims">
          <div class="dims-title">评估维度</div>
          ${['交互质量', '问题解决', '流程合规', '响应时效'].map(dim => `
          <div class="dim">
            <span class="dim-name">${dim}</span>
            <div class="dim-bar"><div class="dim-fill ${s.verdict === 'passed' ? 'green' : 'red'}" style="width: ${s.verdict === 'passed' ? '85%' : '40%'}"></div></div>
            <span class="dim-value ${s.verdict === 'passed' ? 'green' : 'red'}">${s.verdict === 'passed' ? '良好' : '待改进'}</span>
          </div>
          `).join('')}
        </div>
        <div class="comment ${s.verdict}">
          <div class="comment-title">判定备注</div>
          <p>${s.verdict_comment || '无备注'}</p>
        </div>
      </div>
      `).join('')}
    </div>

    <div class="conclusion ${allPassed ? 'passed' : 'amber'}">
      <span class="conclusion-icon">${allPassed ? '✓' : '⚠'}</span>
      <div class="conclusion-title">评估结论</div>
      <p class="conclusion-text">
        该数字员工经过人工评估，共测试 <strong>${total} 个场景</strong>，其中 <strong style="color:#16a34a">${passed} 个合格</strong>
        ${failed > 0 ? `，<strong style="color:#dc2626">${failed} 个不合格</strong>` : ''}。
        ${allPassed
          ? '所有场景均已通过评估，数字员工具备上岗能力，建议安排上岗。'
          : '存在不合格场景，建议修改配置后重新评估，或由审核人员决定是否强制上岗。'}
      </p>
    </div>

    <div class="footer">
      <p>本报告由 Ncrew Hire 系统自动生成 · ${now}</p>
    </div>
  </div>
</body>
</html>`;
}

function HumanComprehensiveReport({ scenarios, onConfirmOnboarding, onModifyConfig, onForceOnboarding }) {
  const passed = scenarios.filter(s => s.verdict === 'passed').length;
  const failed = scenarios.filter(s => s.verdict === 'failed').length;
  const total = scenarios.length;
  const allPassed = passed === total && scenarios.every(s => s.status === 'completed');
  const passRate = Math.round((passed / total) * 100);

  return (
    <div className="human-report-modal-content">
      <div className={`human-report-modal-header ${allPassed ? 'passed' : 'amber'}`}>
        <div className={`human-report-modal-icon ${allPassed ? 'passed' : 'amber'}`}>
          {allPassed ? '✓' : '⚠'}
        </div>
        <div className="human-report-modal-title">
          {allPassed ? '人工评估通过' : '部分场景未通过'}
        </div>
        <p>共评估 {total} 个场景，通过 {passed} 个，通过率 {passRate}%</p>
      </div>

      <div className="human-report-stats">
        <div className="human-report-stat"><span className="indigo">{total}</span><label>评估场景</label></div>
        <div className="human-report-stat"><span className="green">{passed}</span><label>通过场景</label></div>
        <div className="human-report-stat"><span className="red">{failed}</span><label>未通过场景</label></div>
        <div className="human-report-stat"><span className={passRate >= 100 ? 'green' : passRate >= 80 ? 'amber' : 'red'}>{passRate}%</span><label>通过率</label></div>
      </div>

      <div className="human-report-rate-bar">
        <div className="human-report-rate-label">通过率 {passRate}%</div>
        <div className="human-report-rate-track">
          <div className={`human-report-rate-fill ${passRate >= 100 ? 'green' : passRate >= 80 ? 'amber' : 'red'}`} style={{ width: `${passRate}%` }} />
        </div>
        <div className="human-report-rate-mark"><span className="green">合格线 100%</span></div>
      </div>

      <div className="human-report-scenarios">
        <label>场景评估详情</label>
        <div className="human-report-scenarios-list">
          {scenarios.map(s => (
            <div key={s.scenario_id} className={`human-report-scenario-card ${s.verdict}`}>
              <div className="human-report-scenario-head">
                {s.verdict === 'passed' ? '✓' : '×'}
                <span className="human-report-scenario-name">{s.scenario_name}</span>
                <span className={`human-report-scenario-badge ${s.verdict}`}>
                  {s.verdict === 'passed' ? '合格' : '不合格'}
                </span>
                <span className="human-report-scenario-time">{s.started_at} - {s.completed_at}</span>
              </div>
              <div className="human-report-scenario-stats">
                <div><strong className="indigo">{s.message_count}</strong><label>对话轮数</label></div>
                <div><strong className={s.verdict === 'passed' ? 'green' : 'red'}>{s.verdict === 'passed' ? '100%' : '0%'}</strong><label>场景通过率</label></div>
                <div><strong>15min</strong><label>评估耗时</label></div>
              </div>
              <div className="human-report-scenario-dims">
                <label>评估维度</label>
                {['交互质量', '问题解决', '流程合规', '响应时效'].map(dim => (
                  <div key={dim} className="human-report-scenario-dim">
                    <span>{dim}</span>
                    <div className="human-report-scenario-dim-bar">
                      <div className={`human-report-scenario-dim-fill ${s.verdict === 'passed' ? 'green' : 'red'}`} style={{ width: s.verdict === 'passed' ? '85%' : '40%' }} />
                    </div>
                    <span className={s.verdict === 'passed' ? 'green' : 'red'}>{s.verdict === 'passed' ? '良好' : '待改进'}</span>

        <label>评估结论</label>

        {failed > 0 && <>，<strong className="red">{failed} 个不合格</strong></>}。

          <>
            <button className="human-report-action-secondary" onClick={onModifyConfig}>
              🔧 修改配置重新评估
            </button>
            <button className="human-report-action-amber" onClick={onForceOnboarding}>
              🛡 强制上岗 — 存在不合格场景，但仍要求上岗
            </button>
          </>
        )}
      </div>
    </div>
  );
}

// ===== Human Evaluation Page =====
function HumanEvalPage({ id, go, toast }) {
  const e = window.findEmployeeById(id) || window.DEPT_EMPLOYEES[1];
  const [scenarios, setScenarios] = _useStateE(HUMAN_SCENARIOS);
  const [messages, setMessages] = _useStateE(HUMAN_MESSAGES);
  const [currentScenarioId, setCurrentScenarioId] = _useStateE('HS-001');
  const [chatInput, setChatInput] = _useStateE('');
  const [artifactTab, setArtifactTab] = _useStateE('conversation');
  const [rightCollapsed, setRightCollapsed] = _useStateE(false);
  const [showReportModal, setShowReportModal] = _useStateE(false);
  const [onboardingSubmitted, setOnboardingSubmitted] = _useStateE(false);
  const [humanEvalPassed, setHumanEvalPassed] = _useStateE(false);
  const [showPassConfirmModal, setShowPassConfirmModal] = _useStateE(false);

  const allCompleted = scenarios.every(s => s.status === 'completed');
  const hasOnboardingRequest = messages.some(m => m.type === 'onboarding_request');
  const showReportButton = allCompleted && (hasOnboardingRequest || onboardingSubmitted);

  const currentScenario = scenarios.find(s => s.scenario_id === currentScenarioId) || scenarios[0];

  const TABS = [
    { key: 'conversation', label: '对话记录' },
    { key: 'trace', label: 'Trace' },
    { key: 'report', label: '评估报告' },
  ];

  return (
    <div className="page human-page">
      <div className="human-topbar">
        <div className="human-topbar-row1">
          <button className="human-back" onClick={() => go(`employee/${e.id}`)}>
            <window.Icon.back className="icn" />
            返回
          </button>
          <div style={{ flex: 1 }} />
          <div className="human-topbar-badges">
            <span className="human-badge green">AI 评估已通过</span>
            {humanEvalPassed
              ? <span className="human-badge green">人工评估通过</span>
              : <span className="human-badge indigo">人工评估进行中</span>
            }
            {showReportButton && (
              <button className="btn btn-primary btn-sm" onClick={() => setShowReportModal(true)}>
                查看综合报告
              </button>
            )}
          </div>
        </div>
        <div className="human-topbar-row2">
          <h1 className="human-topbar-title">人工评估</h1>
          <div className="human-topbar-stepper-wrap">
            <HumanScenarioProgressBar scenarios={scenarios} />
          </div>
        </div>
      </div>

      <div className="human-main">
        <div className="human-chat-panel">
          <div className="human-messages">
            {messages.map(msg => (
              <HumanChatMessage
                key={msg.message_id}
                msg={msg}
                scenarios={scenarios}
                currentScenarioId={currentScenarioId}
                onVerdictSubmit={(verdict, comment, messageId) => {
                  setMessages(prev => prev.map(m =>
                    m.message_id === messageId
                      ? { ...m, submitted: true, submittedVerdict: verdict, submittedComment: comment }
                      : m
                  ));
                  setScenarios(prev => prev.map(s =>
                    s.scenario_id === currentScenarioId
                      ? { ...s, status: 'completed', verdict: 'passed', verdict_comment: comment }
                      : s
                  ));
                  toast(`场景判定已提交: ${verdict === 'passed' ? '满意' : '不满意'}`);
                  // 推进到下一个场景
                  const nextIdx = scenarios.findIndex(s => s.scenario_id === currentScenarioId) + 1;
                  if (nextIdx < scenarios.length) {
                    const next = scenarios[nextIdx];
                    setCurrentScenarioId(next.scenario_id);
                    setScenarios(prev => prev.map(s => s.scenario_id === next.scenario_id ? { ...s, status: 'in_progress' } : s));
                  }
                }}
                onOnboardingSubmit={(decision, comment, messageId) => {
                  setOnboardingSubmitted(true);
                  setMessages(prev => prev.map(m =>
                    m.message_id === messageId
                      ? { ...m, submitted: true, submittedOnboarding: decision, submittedComment: comment }
                      : m
                  ));
                  setShowReportModal(true);
                  toast(`上岗判定已提交: ${decision === 'onboard' ? '可以上岗' : '不可以上岗'}`);
                }}
              />
            ))}
          </div>
          <div className="human-input">
            <input
              value={chatInput}
              onChange={evt => setChatInput(evt.target.value)}
              placeholder={hasOnboardingRequest ? "请先完成上岗判定..." : "输入消息与数字员工对话..."}
              disabled={hasOnboardingRequest}
            />
            <button className="human-input-send" disabled={hasOnboardingRequest}>
              <window.Icon.arrow className="icn" />
            </button>
          </div>
        </div>

        <div className={`human-artifact-panel ${rightCollapsed ? 'collapsed' : ''}`}>
          {rightCollapsed ? (
            <button className="human-artifact-expand" onClick={() => setRightCollapsed(false)}>
              <window.Icon.arrow className="icn" style={{ transform: 'rotate(90deg)' }} />
            </button>
          ) : (
            <>
              <div className="human-artifact-head">
                <div className="human-artifact-scenario">
                  <label>场景:</label>
                  <select value={currentScenarioId} onChange={e => setCurrentScenarioId(e.target.value)}>
                    {scenarios.map(s => (
                      <option key={s.scenario_id} value={s.scenario_id}>
                        {s.scenario_name} ({s.status === 'completed' ? (s.verdict === 'passed' ? '满意' : '不满意') : '⏳'})
                      </option>
                    ))}
                  </select>
                </div>
                <button className="human-artifact-collapse" onClick={() => setRightCollapsed(true)}>
                  <window.Icon.arrow className="icn" style={{ transform: 'rotate(-90deg)' }} />
                </button>
              </div>

              <div className="human-artifact-tabs">
                {TABS.map(tab => (
                  <button key={tab.key} className={`human-artifact-tab ${artifactTab === tab.key ? 'active' : ''}`} onClick={() => setArtifactTab(tab.key)}>
                    {tab.label}
                  </button>
                ))}
              </div>

              <div className="human-artifact-content">
                {artifactTab === 'conversation' && <HumanConversationPanel messages={messages} currentScenarioId={currentScenarioId} />}
                {artifactTab === 'trace' && <HumanTracePanel messages={messages} currentScenarioId={currentScenarioId} />}
                {artifactTab === 'report' && <HumanReportPanel currentScenario={currentScenario} />}
              </div>
              <div className="human-eval-pass-footer">
                <button
                  className={`btn btn-sm ${humanEvalPassed ? 'btn-pass-done' : 'btn-primary'}`}
                  disabled={humanEvalPassed}
                  onClick={() => setShowPassConfirmModal(true)}
                >
                  {humanEvalPassed ? '✓ 已通过人工评估' : '通过人工评估'}
                </button>
                <button
                  className="btn btn-primary btn-sm"
                  disabled={!humanEvalPassed}
                  onClick={() => {
                    const isCustomize = e.customizing;
                    window.updateEmployee(e.id, {
                      status: 'live', updated: '刚刚', activeAt: '刚刚',
                      ...(isCustomize ? { customized: true, customizing: false } : {})
                    });
                    toast(isCustomize ? '私人定制完成，已重新上岗' : '已发布上岗');
                    go(isCustomize ? 'my' : `employee/${e.id}`);
                  }}
                >
                  发布上岗
                </button>
              </div>
            </>
          )}
        </div>
      </div>

      {showPassConfirmModal && (
        <div className="human-modal-mask" onClick={() => setShowPassConfirmModal(false)}>
          <div className="human-modal human-modal-confirm" onClick={ev => ev.stopPropagation()}>
            <div className="human-modal-head">
              <h2 className="human-modal-title">确认通过人工评估？</h2>
              <button className="human-modal-close" onClick={() => setShowPassConfirmModal(false)}>×</button>
            </div>
            <div className="human-modal-confirm-body">
              <p className="human-modal-confirm-desc">通过后，该数字员工的评估状态将更新为「人工评估通过」，并可进行发布上岗操作。</p>
              <div className="row" style={{ justifyContent: 'flex-end', gap: 8 }}>
                <button className="btn btn-ghost btn-sm" onClick={() => setShowPassConfirmModal(false)}>取消</button>
                <button className="btn btn-primary btn-sm" onClick={() => {
                  setHumanEvalPassed(true);
                  setShowPassConfirmModal(false);
                  toast('人工评估已通过');
                }}>确认</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {showReportModal && (
        <div className="human-modal-mask" onClick={() => setShowReportModal(false)}>
          <div className="human-modal" onClick={e => e.stopPropagation()}>
            <div className="human-modal-head">
              <span className="human-modal-icon">✓</span>
              <h2 className="human-modal-title">人工评估综合报告</h2>
              <button className="human-modal-download" onClick={() => {
                const reportHtml = generateHumanReportHtml(scenarios, e);
                const blob = new Blob([reportHtml], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `人工评估报告_${e.name}_${new Date().toISOString().slice(0,10)}.html`;
                a.click();
                URL.revokeObjectURL(url);
                toast('报告已下载');
              }}>
                ⬇ 下载报告
              </button>
              <button className="human-modal-close" onClick={() => setShowReportModal(false)}>
                ×
              </button>
            </div>
            <div className="human-modal-body">
              <HumanComprehensiveReport

function buildConnectSteps(channelId, methodId) {
  return IM_SCHEMAS[channelId].methods[methodId].steps.map(name => ({ name, done: false }));
}

function readChatStore() {
  if (window.__NCREW_CHAT_HISTORY__) return window.__NCREW_CHAT_HISTORY__;
  try {
    const raw = window.localStorage && window.localStorage.getItem(CHAT_STORE_KEY);
    window.__NCREW_CHAT_HISTORY__ = raw ? JSON.parse(raw) : {};
  } catch (err) {
    window.__NCREW_CHAT_HISTORY__ = {};
  }
  return window.__NCREW_CHAT_HISTORY__;
}

function writeChatStore(nextStore) {
  window.__NCREW_CHAT_HISTORY__ = nextStore;
  try {
    if (window.localStorage) window.localStorage.setItem(CHAT_STORE_KEY, JSON.stringify(nextStore));
  } catch (err) {}
}

function chatKey(employeeId, viewerName) {
  return `${employeeId}::${viewerName}`;
}

function createSeedHistory(employee, viewerName) {
  return [
    {
      who: "bot",
      text: `你好，我是 ${employee.name}。这里是 ${viewerName} 的站内对话视角，我们可以先从当前最重要的任务开始。`,
      at: "刚刚"
    }
  ];
}

function getChatHistory(employee, viewerName) {
  const store = readChatStore();
  const key = chatKey(employee.id, viewerName);
  return store[key] || createSeedHistory(employee, viewerName);
}

function saveChatHistory(employeeId, viewerName, messages) {
  const store = readChatStore();
  writeChatStore({ ...store, [chatKey(employeeId, viewerName)]: messages.slice(-50) });
}

          {phase === 1 && (
            <>

              <div className="status-panel">
                <div className="row between" style={{ alignItems: "flex-start" }}>

          {phase === 2 && (
            <>

              <div className="callout success">
                <span style={{ fontSize: 18 }}>🛡️</span>
                <div>当前实例已成功绑定到 {schema.title}，后续可以直接从卡片、详情页或站内对话页顶部"去 IM"。</div>

                <div className="row wrap" style={{ gap: 8 }}>
                  <button className="btn btn-ghost btn-sm" onClick={() => setJumpPicker(true)}>去 IM</button>
                  <button className="btn btn-primary btn-sm" onClick={() => go(`chat/${employee.id}`)}>开始对话 <window.Icon.arrow className="icn" /></button>
                </div>
              </div>

          )}
        </div>
      </div>

      <window.IMPickerModal open={jumpPicker} employee={employee} onClose={() => setJumpPicker(false)} onConfig={() => { setJumpPicker(false); }} />
    </div>
  );
}

function PublishPage({ id, role, go, toast }) {
  const employee = window.findEmployeeById(id);
  const [phase, setPhase] = _useStateF(employee && employee.status === "live" ? 2 : 0);
  const [doneCount, setDoneCount] = _useStateF(employee && employee.status === "live" ? 3 : 0);
  if (!employee) return null;

  const isDepartment = employee.type === "department";
  const viewer = window.getViewer(role);
  const steps = isDepartment
    ? ["发布到部门员工列表", "启动运行时", "状态切为 live"]
    : ["确认上岗身份", "启动运行时", "状态切为 live"];

  function start() {
    setPhase(1);
    let pointer = 0;
    const timer = setInterval(() => {
      pointer += 1;
      setDoneCount(pointer);
      if (pointer >= steps.length) {
        clearInterval(timer);
        const livePatch = { status: "live", updated: "刚刚", activeAt: "刚刚", owner: employee.owner || viewer.name };
        if (employee.customizing) { livePatch.customized = true; livePatch.customizing = false; }
        window.updateEmployee(employee.id, livePatch);
        setTimeout(() => {
          setPhase(2);
          toast(isDepartment ? "部门员工已发布" : employee.customizing ? "私人定制完成，分身已上岗" : "分身已上岗");
        }, 250);
      }
    }, 550);
  }

  return (
    <div className="page page-narrow">
      <window.Crumb label="返回详情" onClick={() => go(`employee/${employee.id}`)} />

      <div className="page-header hero-header">
        <div>
          <span className="eyebrow">{isDepartment ? "发布确认页" : "个人上岗确认页"}</span>
          <h1 className="page-title">{isDepartment ? "发布到部门员工列表" : "确认分身上岗"}</h1>
          <p className="page-sub">
            {isDepartment
              ? `部门员工发布后会出现在"部门数字员工"列表中，成员可复制后在站内会话或 IM 中使用。`
              : "个人分身上岗后平台会话立即可用，IM 配置改为可选动作。"}
          </p>
        </div>
      </div>

      <div className="card card-pad">
        <div className="row" style={{ gap: 16, alignItems: "center" }}>
          <window.Avatar initial={employee.initial} tint={employee.tint} size="xl" />
          <div style={{ flex: 1 }}>
            <h3 style={{ margin: 0, fontSize: 22, fontWeight: 600 }}>{employee.name}</h3>
            <div className="muted" style={{ marginTop: 6, fontSize: 13 }}>{employee.desc}</div>
          </div>
          <window.TypePill type={employee.type} />
        </div>

        <div className="divider" />

        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          {steps.map((item, idx) => (
            <div key={item} className="flow-step">
              <span>{item}</span>
              {doneCount > idx
                ? <span className="pill green dot">已完成</span>
                : phase === 1 && doneCount === idx
                  ? <span className="pill blue">进行中</span>
                  : <span className="pill gray">等待</span>}
            </div>
          ))}
        </div>

        {phase === 0 && (
          <>
            <div className="spacer-16" />
            <div className="callout info">
              {isDepartment
                ? "发布动作不会展开任何 IM 配置。成员之后复制分身时再各自决定是否接入飞书 / 钉钉 / 企微。"
                : "上岗后你会先获得站内对话入口，IM 配置保留为完成后的可选引导。"}
            </div>
            <div className="spacer-16" />
            <div className="row" style={{ justifyContent: "flex-end", gap: 8 }}>
              <button className="btn btn-ghost btn-sm" onClick={() => go(`employee/${employee.id}`)}>取消</button>
              <button className="btn btn-primary btn-sm" onClick={start}>{isDepartment ? "发布到部门列表" : "确认上岗"} <window.Icon.arrow className="icn" /></button>

        {phase === 2 && (
          <>
            <div className="spacer-16" />
            <div className="callout success">
              <span style={{ fontSize: 18 }}>🎉</span>
              <div>
                {isDepartment

              {isDepartment

                : <button className="btn btn-ghost btn-sm" onClick={() => go("my")}>返回我的数字员工</button>}
              {isDepartment

function ClonePage({ id, role, go, toast }) {
  const source = window.findEmployeeById(id) || window.DEPT_EMPLOYEES[0];
  const viewer = window.getViewer(role);
  const [step, setStep] = _useStateF(0);            // 0: 配置信息  1: 确认上岗
  const [pubPhase, setPubPhase] = _useStateF('idle'); // 'idle' | 'running' | 'done'
  const [doneCount, setDoneCount] = _useStateF(0);
  const [created, setCreated] = _useStateF(null);
  const [name, setName] = _useStateF(`${source.name} · ${viewer.short}`);
  const [initial, setInitial] = _useStateF(viewer.short);
  const [desc, setDesc] = _useStateF("我的个人版本，记得我的工作偏好和常用输出格式。");

  const STEPS = ['配置个人信息', '确认上岗'];
  const PUB_STEPS = ['确认上岗身份', '启动运行时', '状态切为 live'];

  function goToConfirm() {
    if (!name.trim()) { toast("请填写分身名称"); return; }
    setStep(1);
    setPubPhase('idle');
    setDoneCount(0);
  }

  function startPublish() {
    const mine = window.getMyEmployeesForRole(role);
    const unique = window.uniqueName(name.trim(), mine);
    const emp = window.addMyEmployee({
      id: window.generateId("pc"),
      type: "personal_clone",
      name: unique,
      initial: (initial || viewer.short).slice(0, 2),
      tint: source.tint,
      parent: source.id,
      parentName: source.name,
      template: source.template,
      status: "hired",
      desc,
      owner: viewer.name,
      updated: "刚刚",
      tags: ["我的分身"],
      runs: 0
    });
    setCreated(emp);
    setPubPhase('running');
    let pointer = 0;
    const timer = setInterval(() => {
      pointer += 1;
      setDoneCount(pointer);
      if (pointer >= PUB_STEPS.length) {
        clearInterval(timer);
        window.updateEmployee(emp.id, { status: "live", updated: "刚刚", activeAt: "刚刚" });
        setTimeout(() => { setPubPhase('done'); toast("分身已成功上岗"); }, 300);
      }
    }, 600);
  }

  return (
    <div className="page page-narrow">
      <window.Crumb label={`返回 ${source.name} 详情`} onClick={() => go(`employee/${source.id}`)} />

      <div className="page-header hero-header" style={{ marginBottom: 0 }}>
        <div>
          <span className="eyebrow">复制分身向导</span>
          <h1 className="page-title">基于 <em>{source.name}</em> 创建你的分身</h1>
          <p className="page-sub">直接继承评估结果，无需重走评估流程，完成配置后即可上岗。</p>
        </div>
      </div>

      {/* 步骤条 */}
      <div className="clone-stepper">
        {STEPS.map((label, idx) => (
          <React.Fragment key={label}>
            <div className={`clone-step ${idx < step ? 'done' : idx === step ? 'active' : ''}`}>
              <span className="clone-step-num">{idx < step ? '✓' : idx + 1}</span>
              <span className="clone-step-label">{label}</span>
            </div>
            {idx < STEPS.length - 1 && <div className="clone-step-line" />}
          </React.Fragment>
        ))}
      </div>

      <div className="card card-pad">

        {/* ── Step 0：配置个人信息 ── */}
        {step === 0 && (
          <>
            <div className="clone-source-strip">
              <window.Avatar initial={source.initial} tint={source.tint} size="md" />
              <div className="clone-source-info">
                <span className="clone-source-eyebrow">基于部门员工</span>
                <span className="clone-source-name">{source.name}</span>
                <span className="clone-source-desc">{source.desc}</span>
              </div>
              <span className="pill green dot" style={{ alignSelf: 'flex-start', flexShrink: 0 }}>已上岗 · 继承评估</span>
            </div>

            <h3 className="section-h">配置你的分身信息</h3>
            <div className="field-grid">
              <div className="form-row">
                <label>分身名称</label>
                <input type="text" value={name} onChange={evt => setName(evt.target.value)} placeholder={`${source.name} · ${viewer.short}`} />
              </div>
              <div className="form-row">
                <label>头像简称 <span className="form-hint">· 可选，最多 2 个字</span></label>
                <input type="text" value={initial} onChange={evt => setInitial(evt.target.value)} placeholder={viewer.short} maxLength={2} />
              </div>
              <div className="form-row field-span-2">
                <label>个人说明 <span className="form-hint">· 描述你对这个分身的个性化期望</span></label>
                <textarea rows={3} value={desc} onChange={evt => setDesc(evt.target.value)} />
              </div>
            </div>

            <div className="callout info" style={{ marginTop: 16 }}>
              上岗后可在分身详情页按需配置 IM，本向导不展开 IM 设置。
            </div>

            <div className="row" style={{ justifyContent: 'flex-end', gap: 8, marginTop: 20 }}>
              <button className="btn btn-ghost btn-sm" onClick={() => go(`employee/${source.id}`)}>取消</button>
              <button className="btn btn-primary btn-sm" onClick={goToConfirm}>
                下一步：确认上岗 <window.Icon.arrow className="icn" />
              </button>
            </div>
          </>
        )}

        {/* ── Step 1：确认上岗 ── */}
        {step === 1 && (
          <>
            <div className="clone-confirm-head">
              <window.Avatar initial={(initial || viewer.short).slice(0, 2)} tint={source.tint} size="xl" />
              <div className="clone-confirm-meta">
                <h3 className="clone-confirm-name">{name}</h3>
                <p className="clone-confirm-desc">{desc}</p>
              </div>
            </div>
            <div className="divider" />

            <div className="clone-pub-steps">
              {PUB_STEPS.map((label, idx) => {
                const isDone = pubPhase === 'done' || doneCount > idx;
                const isRunning = pubPhase === 'running' && doneCount === idx;
                return (
                  <div key={label} className={`clone-pub-step ${isDone ? 'step-done' : isRunning ? 'step-running' : ''}`}>
                    <span className="clone-pub-step-icon">
                      {isDone
                        ? <span style={{ color: '#16a34a', fontWeight: 700 }}>✓</span>
                        : isRunning
                          ? <span className="clone-spin" style={{ color: '#6366f1' }}>↻</span>
                          : <span style={{ color: '#d1d5db' }}>○</span>}
                    </span>
                    <span className="clone-pub-step-label">{label}</span>
                    <span>
                      {isDone
                        ? <span className="pill green dot" style={{ fontSize: 11 }}>已完成</span>
                        : isRunning
                          ? <span className="pill blue" style={{ fontSize: 11 }}>进行中</span>
                          : <span className="pill gray" style={{ fontSize: 11 }}>等待</span>}
                    </span>
                  </div>
                );
              })}
            </div>

            {pubPhase === 'done' && (
              <div className="callout success" style={{ marginTop: 16 }}>
                分身已上岗！站内对话立即可用，如需接入 IM 可在分身详情页配置。
              </div>
            )}

            <div className="row" style={{ justifyContent: 'flex-end', gap: 8, marginTop: 20 }}>
              {pubPhase === 'idle' && (
                <>
                  <button className="btn btn-ghost btn-sm" onClick={() => setStep(0)}>上一步</button>
                  <button className="btn btn-primary btn-sm" onClick={startPublish}>
                    确认上岗 <window.Icon.arrow className="icn" />
                  </button>
                </>
              )}
              {pubPhase === 'running' && (
                <button className="btn btn-primary btn-sm" disabled>上岗中…</button>
              )}
              {pubPhase === 'done' && (
                <button className="btn btn-primary btn-sm" onClick={() => go(`employee/${created.id}`)}>
                  查看我的分身 <window.Icon.arrow className="icn" />
                </button>
              )}
            </div>
          </>
        )}
      </div>
    </div>
  );
}
