function HirePage({ id, tpl, go, toast }) {
  const existing = id ? window.findEmployeeById(id) : null;
  const template = tpl
    ? window.findTemplateById(tpl)
    : (existing ? window.findTemplateById(existing.template) : window.TEMPLATES[0]);
  const isBranchFlow = !!existing && existing.type === "private_branch";
  const isCustomizeFlow = !!existing && (existing.type === "personal_clone" || existing.role === "部门分身") && !!existing.customizing;
  const backTo = (isBranchFlow || isCustomizeFlow) ? "my" : "dept";
  const cacheKey = `${HIRE_V2_CACHE_PREFIX}:${existing ? existing.id : `tpl:${template && template.id}`}`;
  const savedFlow = readFlowCache(cacheKey);

  const [flow, setFlow] = _useStateH(() => buildInitialFlow(template, existing, savedFlow));
  const [draft, setDraft] = _useStateH("");
  const [activeSystemId, setActiveSystemId] = _useStateH(null);
  const [systemForm, setSystemForm] = _useStateH({ endpoint: "", apiKey: "", webhook: "", timeout: 30 });
  const [drawerFeedback, setDrawerFeedback] = _useStateH("");
  const [editingSkillId, setEditingSkillId] = _useStateH("");
  const [skillForm, setSkillForm] = _useStateH({ name: "", description: "", trigger: "" });
  const [dropActive, setDropActive] = _useStateH(false);
  const [wfExpanded, setWfExpanded] = _useStateH({ docs: true, skills: true, integrations: true, package: true });

  const businessFileInputRef = _useRefH(null);
  const skillFileInputRef = _useRefH(null);
  const timerRef = _useRefH([]);
  const flowRef = _useRefH(flow);

  _useEffectH(() => {
    ensureHireV2Styles();
  }, []);

  _useEffectH(() => {
    flowRef.current = flow;
    writeFlowCache(cacheKey, flow);
  }, [cacheKey, flow]);

  _useEffectH(() => () => {
    timerRef.current.forEach(timerId => window.clearTimeout(timerId));
  }, []);

  function rememberTimer(timerId) {
    timerRef.current.push(timerId);
  }

  function assistantName() {
    return existing ? existing.name : template.name;
  }

  function syncExistingProgress(completedPhases) {
    if (!existing) return;
    const nextCompleted = Math.max(existing.hireProgress || 0, completedPhases);
    window.updateEmployee(existing.id, {
      hireProgress: nextCompleted,
      updated: "刚刚"
    });
  }

  function findSkillCandidate(skillId) {
    return RECOMMENDED_SKILLS.find(item => item.id === skillId)
      || flowRef.current.skills.generated.find(item => item.id === skillId)
      || flowRef.current.skills.adopted.find(item => item.id === skillId);
  }

  function areDocsComplete(targetFlow = flowRef.current) {
    const items = (targetFlow.docs && targetFlow.docs.todoItems) || [];
    if (items.length > 0) return items.some(i => i.status === 'confirmed');
    return hasUploadedBusinessFile(targetFlow) || targetFlow.docs.done.length >= DOC_REQUIREMENTS.length;
  }

  function areSkillsReady(targetFlow = flowRef.current) {
    const items = (targetFlow.skills && targetFlow.skills.todoItems) || [];
    if (items.length > 0) return items.some(i => i.status === 'confirmed');
    return targetFlow.skills.adopted.length >= 1;
  }

  function areIntegrationsReady(targetFlow = flowRef.current) {
    const items = (targetFlow.integrations && targetFlow.integrations.todoItems) || [];
    if (items.length > 0) return items.some(i => i.status === 'confirmed');
    return targetFlow.integrations.done.length >= INTEGRATION_DEFINITIONS.length;
  }

  function completionRatio() {
    const values = [
      docsProgress(flow),
      skillsProgress(flow),
      integrationsProgress(flow),
      packageProgress(flow)
    ];
    return Math.round((values.reduce((sum, value) => sum + value, 0) / values.length) * 100);
  }

  function todoItems() {
    return [
      {
        id: "docs",
        phase: 2,
        title: "补充业务资料",
        description: "上传业务相关资料，让数字员工理解业务背景。",
        subtasks: ["业务资料"],
        progress: docsProgress(flow)
      },
      {
        id: "skills",
        phase: 4,
        title: "配置技能模块",
        description: "配置执行能力，让数字员工能真正完成任务。",
        subtasks: ["技能配置"],
        progress: skillsProgress(flow)
      },
      {
        id: "integrations",
        phase: 5,
        title: "对接外部系统",
        description: "配置系统连接参数，让技能真正跑起来。",
        subtasks: ["系统对接"],
        progress: integrationsProgress(flow)
      },
      {
        id: "package",
        phase: 6,
        title: "生成实例包",
        description: "打包所有配置，生成可部署成果。",
        subtasks: ["生成实例"],
        progress: packageProgress(flow)
      }
    ];
  }

  function stepStatus(item) {
    const progress = item.progress;
    if (progress >= 1) return { label: "已完成", className: "status-done", icon: "✓" };
    if ((item.id === "docs" && flow.docs.interactions > 0) || mapPhaseToProcessIndex(flow.currentPhase) >= mapPhaseToProcessIndex(item.phase)) {
      return { label: "进行中", className: "status-active", icon: "•" };
    }
    return { label: "待办", className: "status-pending", icon: "○" };
  }

  function subtaskStatus(itemId, label) {
    if (itemId === "docs") {
      const matched = DOC_REQUIREMENTS.find(item => item.label === label);
      const done = matched && flow.docs.done.includes(matched.id);
      return done ? { label: "已归档", className: "done", icon: "✓" } : { label: "待补充", className: "pending", icon: "○" };
    }
    if (itemId === "skills") {
      const done = flow.skills.coveredTypes.includes(label);
      return done ? { label: "已覆盖", className: "done", icon: "✓" } : { label: "待补齐", className: "pending", icon: "○" };
    }
    const system = INTEGRATION_DEFINITIONS.find(item => item.name === label);
    const done = system && flow.integrations.done.includes(system.id);
    if (done) return { label: "已连通", className: "done", icon: "✓" };
    if (flow.currentPhase >= 5) return { label: "待配置", className: "active", icon: "•" };
    return { label: "待配置", className: "pending", icon: "○" };
  }

  function saveFlowDraft() {
    writeFlowCache(cacheKey, flowRef.current);
    toast("已保存雇佣草稿");
  }

  function resetFlow() {
    setActiveSystemId(null);
    setEditingSkillId("");
    setDraft("");
    setDropActive(false);
    const reset = buildInitialFlow(template, existing, null);
    setFlow(reset);
    clearFlowCache(cacheKey);
    toast(existing ? "已重置当前界面草稿" : "流程已重置");
  }

  function startDocsFlow(fromResume) {
    syncExistingProgress(1);
    setFlow(prev => ({
      ...prev,
      currentPhase: Math.max(prev.currentPhase, 2),
      todoRevealed: true,
      messages: fromResume || prev.currentPhase === 1
        ? [
            ...prev.messages,
            createMessage("agent", {
              title: "先补齐业务资料",
              text: "你可以上传任意格式的业务文件，也可以直接用文字补充岗位背景、服务口径和 FAQ 约束。",
              card: buildMaterialsCard(prev.docs.done)
            })
          ]
        : prev.messages
    }));
  }

  function summarizeDocFeedback(filesOrText, recognized, nextDone) {
    const uploaded = Array.isArray(filesOrText) && filesOrText.length > 0;
    const docsComplete = uploaded || nextDone.length >= DOC_REQUIREMENTS.length;
    const missing = docsComplete ? [] : DOC_REQUIREMENTS.filter(item => !nextDone.includes(item.id)).map(item => item.label);
    const recognizedLabels = recognized.length ? recognized.map(findDocLabel) : [];
    const sourceLabel = Array.isArray(filesOrText) ? filesOrText.map(item => item.name).join("、") : "这段补充说明";
    const title = missing.length ? "资料已归档，仍有缺口" : "业务资料已补齐";
    const text = missing.length
      ? `我已经解析了 ${sourceLabel}，当前覆盖了 ${recognizedLabels.length ? recognizedLabels.join("、") : "基础业务说明"}。还缺少 ${missing.join("、")}，我会继续等你补齐。`
      : `我已经解析了 ${sourceLabel}，当前资料已满足进入技能模块的条件，可以继续下一步。`;

    return {
      title,
      text,
      card: {
        type: "fileSummary",
        items: [
          {
            label: "已识别资料",
            detail: recognizedLabels.length ? recognizedLabels.join("、") : "已记录为业务补充说明"
          },
          {
            label: "待补充项",
            detail: missing.length ? missing.join("、") : "无"
          }
        ]
      },
          actions: missing.length ? [] : [{ label: "进入技能模块 →", action: "startSkills", primary: true }]
    };
  }

  function processBusinessFiles(files) {
    if (!files.length) return;
    const recognized = Array.from(new Set(
      normalizeUploadedDocCoverage(files, files.flatMap(file => detectDocCoverage(file.name)))
    ));

    const newTodos = files.map(file => ({
      id: `doc_${file.name}`,
      label: file.name.replace(/\.[^.]+$/, ''),
      type: file.name.includes('.') ? file.name.split('.').pop().toUpperCase() : '文档',
      tags: recognized.length ? recognized.map(findDocLabel) : ['业务资料'],
      status: 'confirmed',
      hint: '已识别并归档，可被技能检索引用。'
    }));

    setFlow(prev => {
      const doneSet = new Set(prev.docs.done);
      recognized.forEach(item => doneSet.add(item));
      const nextDone = Array.from(doneSet);
      const nextPhase = files.length > 0 || nextDone.length >= DOC_REQUIREMENTS.length ? 4 : Math.max(prev.currentPhase, 3);
      const nextSources = { ...prev.docs.sources };
      files.forEach(file => {
        nextSources[file.name] = {
          source: "upload",
          recognized: recognized.map(findDocLabel)
        };
      });

      const messages = [
        ...prev.messages,
        createMessage("user", { text: `已上传文件：${files.map(file => file.name).join("、")}` }),
        createMessage("agent", summarizeDocFeedback(files, recognized, nextDone))
      ];

      return {
        ...prev,
        currentPhase: nextPhase,
        todoRevealed: true,
        messages,
        docs: {
          ...prev.docs,
          interactions: prev.docs.interactions + 1,
          done: nextDone,
          sources: nextSources,
          todoItems: [
            ...prev.docs.todoItems,
            ...newTodos.filter(t => !prev.docs.todoItems.some(e => e.id === t.id))
          ]
        }
      };
    });

    if (files.length > 0 || recognized.length >= DOC_REQUIREMENTS.length || areDocsComplete({ ...flowRef.current, docs: { ...flowRef.current.docs, done: Array.from(new Set([...flowRef.current.docs.done, ...recognized])), sources: { ...flowRef.current.docs.sources, ...Object.fromEntries(files.map(file => [file.name, { source: "upload" }])) } } })) {
      syncExistingProgress(3);
    }
  }

  function processBusinessText(text) {
    const recognized = Array.from(new Set(detectDocCoverage(text)));
    const projectedDone = Array.from(new Set([...flowRef.current.docs.done, ...recognized]));

    const newTodos = recognized.length
      ? recognized.map(docId => ({
          id: `doc_${docId}`,
          label: findDocLabel(docId),
          type: '文字说明',
          tags: [findDocLabel(docId)],
          status: 'confirmed',
          hint: '通过对话描述归档，已加入知识体系。'
        }))
      : [{ id: `doc_note_${Date.now()}`, label: text.slice(0, 20) + '…', type: '文字说明', tags: ['补充说明'], status: 'confirmed', hint: '已记录为业务补充说明。' }];

    setFlow(prev => {
      const doneSet = new Set(prev.docs.done);
      recognized.forEach(item => doneSet.add(item));
      const nextDone = Array.from(doneSet);
      const nextPhase = nextDone.length >= DOC_REQUIREMENTS.length ? 4 : Math.max(prev.currentPhase, 3);

      const messages = [
        ...prev.messages,
        createMessage("user", { text }),
        createMessage("agent", summarizeDocFeedback(text, recognized, nextDone))
      ];

      return {
        ...prev,
        currentPhase: nextPhase,
        todoRevealed: true,
        messages,
        docs: {
          ...prev.docs,
          interactions: prev.docs.interactions + 1,
          done: nextDone,
          notes: [...prev.docs.notes, text],
          todoItems: [
            ...prev.docs.todoItems,
            ...newTodos.filter(t => !prev.docs.todoItems.some(e => e.id === t.id))
          ]
        }
      };
    });

    if (projectedDone.length >= DOC_REQUIREMENTS.length) {
      syncExistingProgress(3);
    }
  }

  function suggestSkills(forceMessage) {
    setFlow(prev => {
      const available = [...RECOMMENDED_SKILLS, ...prev.skills.generated]
        .filter(item => !prev.skills.ignored.includes(item.id) && !prev.skills.adopted.some(a => a.id === item.id));

      const messages = forceMessage
        ? [
            ...prev.messages,
            createMessage("agent", {
              title: "开始配置技能模块",
              text: "资料已经够用了，下面为这位数字员工补齐可执行能力。你可以直接采纳推荐技能，也可以上传 skill 文件或用自然语言描述新能力。"
            }),
            ...available.map(item => createMessage("agent", {
              card: {
                type: "skill",
                typeLabel: item.type,
                name: item.name,
                description: item.description,
                dependency: item.dependency,
                trigger: item.trigger,
                id: item.id
              }
            }))
          ]
        : prev.messages;

      const newSkillTodos = available.map(item => ({
        id: item.id,
        label: item.name,
        type: item.type || '智能技能',
        status: 'pending',
        hint: item.description || '',
        dep: item.dependency || ''
      }));

      return {
        ...prev,
        currentPhase: Math.max(prev.currentPhase, 4),
        todoRevealed: true,
        messages,
        skills: {
          ...prev.skills,
          todoItems: [
            ...prev.skills.todoItems,
            ...newSkillTodos.filter(t => !prev.skills.todoItems.some(e => e.id === t.id))
          ]
        }
      };
    });
  }

  function adoptSkill(skillId, overrides) {
    const candidate = findSkillCandidate(skillId);
    if (!candidate) return;
    const nextCovered = Array.from(new Set([...flowRef.current.skills.coveredTypes, (overrides && overrides.type) || candidate.type]));

    setFlow(prev => {
      const merged = {
        ...candidate,
        ...(overrides || {})
      };
      const adoptedExists = prev.skills.adopted.some(item => item.id === skillId);
      if (adoptedExists) return prev;

      const nextMessages = [
        ...prev.messages,
        createMessage("agent", {
          title: `已采纳技能 · ${merged.name}`,
          text: "技能已配置完成，可以继续对接外部系统。",
          actions: [{ label: "进入外部系统 →", action: "startIntegrations", primary: true }]
        })
      ];

      const nextCoveredTypes = Array.from(new Set([...prev.skills.coveredTypes, merged.type]));

      return {
        ...prev,
        currentPhase: 5,
        messages: nextMessages,
        skills: {
          ...prev.skills,
          adopted: [...prev.skills.adopted, merged],
          coveredTypes: nextCoveredTypes,
          todoItems: prev.skills.todoItems.some(t => t.id === skillId)
            ? prev.skills.todoItems.map(t => t.id === skillId ? { ...t, status: 'confirmed' } : t)
            : [...prev.skills.todoItems, { id: skillId, label: merged.name, type: merged.type || '智能技能', status: 'confirmed', hint: merged.description || '', dep: merged.dependency || '' }]
        }
      };
    });

    syncExistingProgress(4);
  }

  function ignoreSkill(skillId) {
    setFlow(prev => ({
      ...prev,
      skills: {
        ...prev.skills,
        ignored: prev.skills.ignored.includes(skillId) ? prev.skills.ignored : [...prev.skills.ignored, skillId],
        todoItems: prev.skills.todoItems.map(t => t.id === skillId ? { ...t, status: 'ignored' } : t)
      },
      messages: [
        ...prev.messages,
        createMessage("agent", {
          title: "已忽略这项技能",
          text: "你可以继续看推荐列表里的其他技能，或者直接描述想新增的能力。"
        })
      ]
    }));
  }

  function openSkillEditor(skillId) {
    const skill = findSkillCandidate(skillId);
    if (!skill) return;
    setEditingSkillId(skillId);
    setSkillForm({
      name: skill.name || "",
      description: skill.description || "",
      trigger: skill.trigger || ""
    });
  }

  function closeSkillEditor() {
    setEditingSkillId("");
    setSkillForm({ name: "", description: "", trigger: "" });
  }

  function submitSkillEdit(event) {
    event.preventDefault();
    if (!editingSkillId) return;
    adoptSkill(editingSkillId, {
      name: skillForm.name.trim(),
      description: skillForm.description.trim(),
      trigger: skillForm.trigger.trim()
    });
    closeSkillEditor();
  }

  function processSkillFiles(files) {
    if (!files.length) return;
    if (!areDocsComplete()) {
      toast("请先补齐业务资料");
      startDocsFlow(true);
      return;
    }

    const generatedSkills = files.map(buildSkillFromFile);
    const newSkillTodos = generatedSkills.map(s => ({
      id: s.id, label: s.name, type: s.type || '自定义技能', status: 'confirmed', hint: s.description || '', dep: ''
    }));
    setFlow(prev => ({
      ...prev,
      currentPhase: 5,
      messages: [
        ...prev.messages,
        createMessage("user", { text: `已上传文件：${files.map(file => file.name).join("、")}` }),
        createMessage("agent", {
          title: "已解析上传的 skill 文件",
          text: `本轮共识别到 ${generatedSkills.length} 条能力，已直接加入技能栈。现在继续对接外部系统。`,
          actions: [{ label: "进入外部系统 →", action: "startIntegrations", primary: true }]
        })
      ],
      skills: {
        ...prev.skills,
        customCount: prev.skills.customCount + generatedSkills.length,
        adopted: [...prev.skills.adopted, ...generatedSkills],
        coveredTypes: [...prev.skills.coveredTypes, ...generatedSkills.map(s => s.type)],
        todoItems: [
          ...prev.skills.todoItems,
          ...newSkillTodos.filter(t => !prev.skills.todoItems.some(e => e.id === t.id))
        ]
      }
    }));
    toast("Skill 文件已处理");
  }

  function createSkillFromText(text) {
    const generated = buildGeneratedSkillFromText(text);
    setFlow(prev => ({
      ...prev,
      currentPhase: 5,
      messages: [
        ...prev.messages,
        createMessage("user", { text }),
        createMessage("agent", {
          title: "已生成能力定义",
          text: "已将描述转化为技能并加入技能栈，现在继续对接外部系统。",
          actions: [{ label: "进入外部系统 →", action: "startIntegrations", primary: true }]
        })
      ],
      skills: {
        ...prev.skills,
        customCount: prev.skills.customCount + 1,
        adopted: [generated, ...prev.skills.adopted],
        coveredTypes: [generated.type, ...prev.skills.coveredTypes],
        todoItems: prev.skills.todoItems.some(t => t.id === generated.id)
          ? prev.skills.todoItems
          : [...prev.skills.todoItems, { id: generated.id, label: generated.name, type: generated.type || '自定义技能', status: 'confirmed', hint: generated.description || '', dep: '' }]
      }
    }));
  }

  function suggestIntegrations(forceMessage) {
    const newSysTodos = INTEGRATION_DEFINITIONS.map(def => ({
      id: def.id, label: def.name, type: 'REST API', status: 'pending', hint: def.purpose
    }));

    setFlow(prev => ({
      ...prev,
      currentPhase: Math.max(prev.currentPhase, 5),
      messages: forceMessage
        ? [
            ...prev.messages,
            createMessage("agent", {
              title: "开始对接外部系统",
              text: "要让技能真正跑起来，需要接入 CRM、OMS、工单系统和 IM 平台。你可以在对话里直接贴参数，也可以点系统卡片填写表单。",
              card: {
                type: "system",
                items: INTEGRATION_DEFINITIONS.map(item => ({
                  ...item,
                  fields: "endpoint / apiKey / webhook / timeout"
                }))
              }
            })
          ]
        : prev.messages,
      integrations: {
        ...prev.integrations,
        todoItems: [
          ...prev.integrations.todoItems,
          ...newSysTodos.filter(t => !prev.integrations.todoItems.some(e => e.id === t.id))
        ]
      }
    }));
  }

  function openSystemDrawer(systemId) {
    const system = INTEGRATION_DEFINITIONS.find(item => item.id === systemId);
    if (!system) return;
    const savedConfig = flowRef.current.integrations.configs[systemId] || {};
    setActiveSystemId(systemId);
    setSystemForm({
      endpoint: savedConfig.endpoint || "",
      apiKey: savedConfig.apiKey || "",
      webhook: savedConfig.webhook || "",
      timeout: savedConfig.timeout || 30
    });
    setDrawerFeedback(system.purpose);
  }

  function closeSystemDrawer() {
    setActiveSystemId(null);
    setDrawerFeedback("");
  }

  function handleSystemFormChange(event) {
    const { name, value } = event.target;
    setSystemForm(prev => ({
      ...prev,
      [name]: name === "timeout" ? Number(value || 30) : value
    }));
  }

  function testCurrentSystem() {
    if (!activeSystemId) return;
    if (!systemForm.endpoint && !systemForm.apiKey) {
      const demoConfig = buildDemoConfig(activeSystemId);
      setDrawerFeedback(`当前是原型演示，你可以直接保存。将使用演示配置：${demoConfig.endpoint}`);
      toast("可直接保存演示配置");
      return;
    }

    const result = validateConfig(systemForm);
    setDrawerFeedback(result.ok ? "✓ 测试通过，连接已就绪。" : result.reason);
    toast(result.ok ? "测试通过" : "连接测试失败");
  }

  function saveSystemConfig(event) {
    event.preventDefault();
    if (!activeSystemId) return;

    const finalConfig = normalizeSystemConfig(activeSystemId, systemForm);
    const system = INTEGRATION_DEFINITIONS.find(item => item.id === activeSystemId);
    const willFinish = !flowRef.current.integrations.done.includes(activeSystemId)
      ? flowRef.current.integrations.done.length + 1 >= INTEGRATION_DEFINITIONS.length
      : flowRef.current.integrations.done.length >= INTEGRATION_DEFINITIONS.length;

    setFlow(prev => {
      const doneSet = new Set(prev.integrations.done);
      doneSet.add(activeSystemId);

      const messages = [
        ...prev.messages,
        createMessage("agent", {
          title: `已连通 ${system.name}`,
          text: willFinish
            ? "所有系统都已就绪，下一步可以生成实例包。"
            : "参数已保存，继续推进剩余系统配置。"
        })
      ];

      if (willFinish) {
        messages.push(createMessage("agent", {
          title: "所有系统都连通了",
          text: "连接层已经就位，接下来把资料、技能和系统配置一起打成实例包。",
          actions: [{ label: "生成实例包 →", action: "generatePackage", primary: true }]
        }));
      }

      return {
        ...prev,
        currentPhase: willFinish ? 6 : Math.max(prev.currentPhase, 5),
        messages,
        integrations: {
          ...prev.integrations,
          configs: {
            ...prev.integrations.configs,
            [activeSystemId]: finalConfig
          },
          done: Array.from(doneSet),
          failed: prev.integrations.failed.filter(item => item !== activeSystemId),
          todoItems: prev.integrations.todoItems.some(t => t.id === activeSystemId)
            ? prev.integrations.todoItems.map(t => t.id === activeSystemId ? { ...t, status: 'confirmed' } : t)
            : [...prev.integrations.todoItems, { id: activeSystemId, label: system.name, type: 'REST API', status: 'confirmed', hint: system.purpose }]
        }
      };
    });

    syncExistingProgress(willFinish ? 5 : 4);
    setDrawerFeedback(finalConfig.__demo ? `已保存演示配置：${finalConfig.endpoint}` : "✓ 配置已保存。");
    toast("系统配置已保存");
    closeSystemDrawer();
  }

  function processIntegrationText(text) {
    const results = parseIntegrationText(text);
    if (!results.length) {
      setFlow(prev => ({
        ...prev,
        messages: [
          ...prev.messages,
          createMessage("user", { text }),
          createMessage("agent", {
            title: "没有识别到系统参数",
            text: "可以直接写「CRM 接口是 https://...，密钥是 sk-...」，或者点系统卡片走表单填写。"
          })
        ]
      }));
      return;
    }

    const nextDone = new Set(flowRef.current.integrations.done);
    const configs = { ...flowRef.current.integrations.configs };
    const cards = [];
    results.forEach(result => {
      configs[result.systemId] = result.config;
      const test = validateConfig(result.config);
      if (test.ok) nextDone.add(result.systemId);
      cards.push({
        label: INTEGRATION_DEFINITIONS.find(item => item.id === result.systemId).name,
        detail: test.ok ? `已确认参数并通过测试：${result.config.endpoint}` : `测试失败：${test.reason}`
      });
    });

    const doneCount = nextDone.size;
    const willFinish = doneCount >= INTEGRATION_DEFINITIONS.length;

    setFlow(prev => ({
      ...prev,
      currentPhase: willFinish ? 6 : Math.max(prev.currentPhase, 5),
      messages: [
        ...prev.messages,
        createMessage("user", { text }),
        createMessage("agent", {
          title: "参数都匹配上了",
          text: "对话里的系统参数已经映射到对应配置里，并做了一次最小连通性检查。",
          card: {
            type: "fileSummary",
            items: cards
          },
          actions: willFinish
            ? [{ label: "生成实例包 →", action: "generatePackage", primary: true }]
            : [{ label: "继续配置系统", action: "startIntegrations" }]
        }),
        ...(willFinish ? [createMessage("agent", {
          title: "所有系统都连通了",
          text: "连接层已经就位，接下来把资料、技能和系统配置一起打成实例包。"
        })] : [])
      ],
      integrations: {
        ...prev.integrations,
        configs: {
          ...prev.integrations.configs,
          ...configs
        },
        done: Array.from(nextDone),
        todoItems: (() => {
          let items = [...prev.integrations.todoItems];
          results.forEach(r => {
            const def = INTEGRATION_DEFINITIONS.find(d => d.id === r.systemId);
            const idx = items.findIndex(t => t.id === r.systemId);
            if (idx >= 0) items[idx] = { ...items[idx], status: 'confirmed' };
            else items.push({ id: r.systemId, label: def ? def.name : r.systemId, type: 'REST API', status: 'confirmed', hint: def ? def.purpose : '' });
          });
          return items;
        })()
      }
    }));

    if (willFinish) syncExistingProgress(5);
  }

  function generatePackage() {
    if (!areDocsComplete()) {
      const docItems = (flowRef.current.docs && flowRef.current.docs.todoItems) || [];
      if (docItems.some(i => i.status === 'pending')) toast("还有资料待办未确认，请先处理");
      else toast("请先补齐业务资料");
      return;
    }
    if (!areSkillsReady()) {
      const skillItems = (flowRef.current.skills && flowRef.current.skills.todoItems) || [];
      if (skillItems.some(i => i.status === 'pending')) toast("还有技能待办未确认，请先处理");
      else toast("请先补齐查询、处理、升级三类技能");
      return;
    }
    if (!areIntegrationsReady()) {
      const sysItems = (flowRef.current.integrations && flowRef.current.integrations.todoItems) || [];
      if (sysItems.some(i => i.status === 'pending')) toast("还有系统待办未确认，请先处理");
      else toast("请先完成全部系统连接");
      return;
    }
    if (flowRef.current.package.generated) {
      toast("实例包已经生成");
      return;
    }

    setFlow(prev => ({
      ...prev,
      currentPhase: 6,
      messages: [
        ...prev.messages,
        createMessage("agent", {
          title: "正在打包实例……",
          text: "正在整理入职档案、归档知识库索引、封装技能模块、固化系统连接配置。"
        })
      ]
    }));

    const timerId = window.setTimeout(() => {
      setFlow(prev => {
        const meta = buildPackageMeta(prev, assistantName());
        return {
          ...prev,
          package: {
            generated: true,
            meta
          },
          messages: [
            ...prev.messages,
            createMessage("agent", {
              title: "准备好了，可以进入 AI 评估",
              text: "资料、技能和系统配置都已经打包完成。你可以先导出实例包，也可以直接进入后续评估。",
              card: {
                type: "package",
                meta
              },
              actions: [
                { label: "保存实例包", action: "savePackage" },
                { label: "进入 AI 评估 →", action: "enterEvaluation", primary: true }
              ]
            })
          ]
        };
      });
      syncExistingProgress(6);
      toast("实例包已生成");
    }, 1400);

    rememberTimer(timerId);
  }

  function downloadPackage() {
    if (!flowRef.current.package.meta) return;

    const payload = buildPackagePayload(flowRef.current, assistantName());
    if (window.JSZip) {
      const zip = new window.JSZip();
      zip.file("manifest.json", JSON.stringify(payload.manifest, null, 2));
      zip.file("knowledge/index.json", JSON.stringify(payload.knowledge, null, 2));
      zip.file("skills/index.json", JSON.stringify(payload.skills, null, 2));
      zip.file("integrations/config.json", JSON.stringify(payload.integrations, null, 2));
      zip.generateAsync({ type: "blob" }).then(blob => {
        triggerDownload(blob, `${flowRef.current.package.meta.name}.zip`);
        toast("已导出 zip 实例包");
      });
      return;
    }

    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    triggerDownload(blob, `${flowRef.current.package.meta.name}.json`);
    toast("当前原型未挂载 zip 库，已导出 JSON 预览");
  }

  function deployPackage() {
    toast("原型演示：这里将执行一键部署");
  }

  function copyCommand() {
    const packageName = flowRef.current.package.meta ? flowRef.current.package.meta.name : "digital-employee";
    const command = `ncrew deploy --package "${packageName}" --env prod`;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(command).then(() => {
        toast("部署指令已复制");
      });
      return;
    }

    const helper = document.createElement("textarea");
    helper.value = command;
    document.body.appendChild(helper);
    helper.select();
    document.execCommand("copy");
    helper.remove();
    toast("部署指令已复制");
  }

  function createDepartmentEmployeeForTemplate() {
    const baseName = `${template.name} · 新雇佣版`;
    const name = window.uniqueName(baseName, window.DEPT_EMPLOYEES);
    return window.addDepartmentEmployee({
      id: window.generateId("de"),
      type: "department",
      name,
      initial: (template.initial || name).slice(0, 2),
      tint: template.tint || "blue",
      template: template.id,
      status: "interning_ai",
      desc: template.summary,
      owner: "李部门长",
      dept: "研发部",
      updated: "刚刚",
      tags: [...(template.tags || []).slice(0, 2), "新雇佣"],
      evalProgress: 0,
      hireProgress: 6
    });
  }

  function enterEvaluation() {
    if (!flowRef.current.package.generated) {
      toast("请先生成实例包");
      return;
    }

    let target = existing;
    if (!target) {
      target = createDepartmentEmployeeForTemplate();
    } else {
      window.updateEmployee(target.id, {
        status: "interning_ai",
        evalProgress: 0,
        hireProgress: 6,
        updated: "刚刚"
      });
    }

    clearFlowCache(cacheKey);
    toast("雇佣阶段完成，进入 AI 评估");
    go(`eval-ai/${target.id}`);
  }

  function skipToAIEval() {
    let target = existing;
    if (!target) {
      target = createDepartmentEmployeeForTemplate();
    } else {
      window.updateEmployee(target.id, {
        status: "interning_ai",
        evalProgress: 0,
        hireProgress: 6,
        updated: "刚刚"
      });
    }
    clearFlowCache(cacheKey);
    toast("已跳过待办事项，直接进入 AI 评估");
    go(`eval-ai/${target.id}`);
  }

  function guideCurrentPhase() {
    const current = flowRef.current.currentPhase;
    if (flowRef.current.package.generated) {
      setFlow(prev => ({
        ...prev,
        messages: [
          ...prev.messages,
          createMessage("agent", {
            title: "实例包已经准备好了",
            text: "你可以直接导出实例包，或者继续进入 AI 评估。",
            actions: [{ label: "进入 AI 评估 →", action: "enterEvaluation", primary: true }]
          })
        ]
      }));
      return;
    }

    if (current <= 3) startDocsFlow(true);
    else if (current === 4) suggestSkills(true);
    else if (current === 5) suggestIntegrations(true);
    else {
      setFlow(prev => ({
        ...prev,
        messages: [
          ...prev.messages,
          createMessage("agent", {
            title: "已进入打包阶段",
            text: "资料、技能和系统都就位之后，就可以开始生成实例包了。",
            actions: [{ label: "生成实例包 →", action: "generatePackage", primary: true }]
          })
        ]
      }));
    }
  }

  function jumpToPhase(phase) {
    if (phase <= 3) {
      startDocsFlow(true);
      return;
    }
    if (phase === 4) {
      suggestSkills(true);
      return;
    }
    if (phase === 5) {
      suggestIntegrations(true);
      return;
    }
    setFlow(prev => ({
      ...prev,
      currentPhase: 6,
      messages: [
        ...prev.messages,
        createMessage("agent", {
          title: "你查看了打包阶段",
          text: flowRef.current.package.generated
            ? "实例包已经生成，可以直接导出或进入 AI 评估。"
            : "完成系统对接后，这里会展示最终的实例包结构。"
        })
      ]
    }));
  }

  function handleAction(action, payload) {
    if (action === "startDocs") startDocsFlow(true);
    else if (action === "startSkills") suggestSkills(true);
    else if (action === "startIntegrations") suggestIntegrations(true);
    else if (action === "adoptSkill") adoptSkill(payload.skillId);
    else if (action === "ignoreSkill") ignoreSkill(payload.skillId);
    else if (action === "editSkill") openSkillEditor(payload.skillId);
    else if (action === "openSystem") openSystemDrawer(payload.systemId);
    else if (action === "generatePackage") generatePackage();
    else if (action === "savePackage") {
      saveFlowDraft();
      toast("实例包已保存");
    }
    else if (action === "downloadPackage") downloadPackage();
    else if (action === "deployPackage") deployPackage();
    else if (action === "copyCommand") copyCommand();
    else if (action === "enterEvaluation") enterEvaluation();
  }

  function handleTextSubmit() {
    const text = draft.trim();
    if (!text) return;
    setDraft("");

    if (flowRef.current.currentPhase <= 3 || !areDocsComplete()) {
      processBusinessText(text);
      return;
    }
    if (flowRef.current.currentPhase === 4) {
      createSkillFromText(text);
      return;
    }
    if (flowRef.current.currentPhase === 5) {
      processIntegrationText(text);
      return;
    }

    setFlow(prev => ({
      ...prev,
      messages: [
        ...prev.messages,
        createMessage("user", { text }),
        createMessage("agent", {
          title: "已记录你的补充",
          text: prev.package.generated ? "实例包已经生成，后续建议直接进入 AI 评估继续验证。" : "如果你已经确认资料、技能和系统都齐备，就可以开始生成实例包了。",
          actions: prev.package.generated ? [{ label: "进入 AI 评估 →", action: "enterEvaluation", primary: true }] : [{ label: "生成实例包 →", action: "generatePackage", primary: true }]
        })
      ]
    }));
  }

  function onBusinessInputChange(event) {
    const files = Array.from(event.target.files || []);
    processBusinessFiles(files);
    event.target.value = "";
  }

  function onSkillInputChange(event) {
    const files = Array.from(event.target.files || []);
    processSkillFiles(files);
    event.target.value = "";
  }

  function handleDrop(event) {
    event.preventDefault();
    setDropActive(false);
    const files = Array.from(event.dataTransfer.files || []);
    if (!files.length) return;
    if (flowRef.current.currentPhase <= 3 || !areDocsComplete()) processBusinessFiles(files);
    else processSkillFiles(files);
  }

  const currentProcessIndex = mapPhaseToProcessIndex(flow.currentPhase);
  const currentSystem = INTEGRATION_DEFINITIONS.find(item => item.id === activeSystemId);
  const resumeLabel = flow.package.generated ? "进入 AI 评估" : "从当前阶段继续";

  return (
    <div className="page">
      <window.Crumb label={`返回${(isBranchFlow || isCustomizeFlow) ? "我的数字员工" : "部门数字员工"}`} onClick={() => go(backTo)} />

      <div className={`hire-flow-v2 ${flow.background === "cool" ? "is-bg-cool" : ""}`}>
        <div className="app-shell">
          <header className="topbar">
            <div>
              <h1>数字员工雇佣流程</h1>
            </div>
            <div className="topbar-actions">
              <button className="ghost-btn" onClick={saveFlowDraft}>保存</button>
              <button className="ghost-btn" onClick={resetFlow}>重置流程</button>
              <button className="ghost-btn skip-ai-btn" onClick={skipToAIEval}>直接进入 AI 流程</button>
              <button className="primary-btn" onClick={flow.package.generated ? enterEvaluation : guideCurrentPhase}>{resumeLabel}</button>
            </div>
          </header>

          <section className="journey-strip">
            <div className="journey-strip-head">
              <p className="journey-summary">
                {existing
                  ? `当前正在处理「${existing.name}」的雇佣环节。`
                  : `当前模板为「${template.name}」，完成资料、技能、系统与实例包四段闭环后进入 AI 评估。`}
              </p>
            </div>
            <div className="step-bar">
              {PROCESS_STEPS.map((step, index) => {
                const progress = progressForStep(step, flow);
                const status = progress >= 1 || index < currentProcessIndex
                  ? "done"
                  : index === currentProcessIndex
                    ? "active"
                    : "pending";

                return (
                  <button key={step.id} type="button" className={`step-pill is-${status}`} onClick={() => jumpToPhase(step.phase)}>
                    <span className="step-index">{status === 'done' ? '✓' : index + 1}</span>
                    <span className="step-copy">
                      <strong>{step.label}</strong>
                      <small>{step.short}</small>
                    </span>
                  </button>
                );
              })}
            </div>
          </section>

          <main className="layout">
            <section className="chat-panel panel">
              <div className="panel-head">
                <div className="employee-chip">
                  <div className="avatar">{(existing ? existing.initial : template.initial || "雇").slice(0, 2)}</div>
                  <div>
                    <strong>{assistantName()}</strong>
                    <span>{isBranchFlow ? "私人定制流程" : existing ? "继续雇佣中" : "模板新雇佣"}</span>
                  </div>
                </div>
              </div>

              <div className="chat-feed">
                {flow.messages.map(message => (
                  <HireMessageRow key={message.id} message={message} flow={flow} onAction={handleAction} />
                ))}
              </div>

              <div className="composer">
                <div className="composer-box">
                  <div
                    className={`input-wrap ${dropActive ? "active" : ""}`}
                    onDragEnter={event => {
                      event.preventDefault();
                      setDropActive(true);
                    }}
                    onDragOver={event => {
                      event.preventDefault();
                      setDropActive(true);
                    }}
                    onDragLeave={event => {
                      event.preventDefault();
                      setDropActive(false);
                    }}
                    onDrop={handleDrop}
                  >
                    <textarea
                      className="chat-input"
                      rows="3"
                      value={draft}
                      onChange={event => setDraft(event.target.value)}
                      placeholder="输入业务说明、技能需求或系统参数。回车发送，Shift + 回车换行。"
                      onKeyDown={event => {
                        if (event.key === "Enter" && !event.shiftKey) {
                          event.preventDefault();
                          handleTextSubmit();
                        }
                      }}
                    ></textarea>
                    <div className="input-toolbar">
                      <div className="composer-tools">
                        <button type="button" className="tool-btn" onClick={() => businessFileInputRef.current && businessFileInputRef.current.click()}>文件上传</button>
                        <button
                          type="button"
                          className="tool-btn"
                          onClick={() => {
                            if (!areDocsComplete()) {
                              toast("请先补齐业务资料");
                              startDocsFlow(true);
                              return;
                            }
                            if (skillFileInputRef.current) skillFileInputRef.current.click();
                          }}
                        >
                          skill
                        </button>
                      </div>
                      <button type="button" className="send-btn" onClick={handleTextSubmit}>发送</button>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <aside className="todo-panel panel wf-panel">
              {(() => {
                const docEntries = (flow.docs.todoItems || []).filter(i => i.status !== 'ignored');
                const skillEntries = (flow.skills.todoItems || []).filter(i => i.status !== 'ignored');
                const sysEntries = (flow.integrations.todoItems || []).filter(i => i.status !== 'ignored');

                const docConfirmed = docEntries.filter(i => i.status === 'confirmed').length;
                const skillConfirmed = skillEntries.filter(i => i.status === 'confirmed').length;
                const sysConfirmed = sysEntries.filter(i => i.status === 'confirmed').length;
                const docPending = docEntries.some(i => i.status === 'pending');
                const skillPending = skillEntries.some(i => i.status === 'pending');
                const sysPending = sysEntries.some(i => i.status === 'pending');

                const docsDone = docConfirmed > 0 && !docPending;
                const docsActive = docConfirmed > 0 && docPending;
                const docsHasAny = docEntries.length > 0;
                const skillsDone = skillConfirmed > 0 && !skillPending;
                const skillsActive = skillConfirmed > 0 && skillPending;
                const skillsHasAny = skillEntries.length > 0;
                const sysDone = sysConfirmed > 0 && !sysPending;
                const sysActive = sysConfirmed > 0 && sysPending;
                const sysHasAny = sysEntries.length > 0;

                const ratio = (() => {
                  const stages = [
                    (flow.docs.todoItems || []).some(i => i.status === 'confirmed') ? 1 : 0,
                    (flow.skills.todoItems || []).some(i => i.status === 'confirmed') ? 1 : 0,
                    (flow.integrations.todoItems || []).some(i => i.status === 'confirmed') ? 1 : 0,
                    flow.package.generated ? 1 : 0
                  ];
                  return Math.round((stages.reduce((s, v) => s + v, 0) / stages.length) * 100);
                })();

                const allStagesDone = (flow.docs.todoItems || []).some(i => i.status === 'confirmed')
                  && (flow.skills.todoItems || []).some(i => i.status === 'confirmed')
                  && (flow.integrations.todoItems || []).some(i => i.status === 'confirmed');
                const anyPending = docPending || skillPending || sysPending;

                function toggleSection(key) {
                  setWfExpanded(prev => ({ ...prev, [key]: !prev[key] }));
                }

                function WfSection({ num, sectionKey, label, statusLabel, statusCls, items, emptyHint, renderItems, alwaysExpand }) {
                  const open = wfExpanded[sectionKey];
                  return (
                    <div className={`wf-section ${items.length > 0 ? 'wf-section-has-data' : 'wf-section-empty'}`}>
                      <button className="wf-section-head" onClick={() => toggleSection(sectionKey)}>
                        <div className="wf-section-left">
                          <span className="wf-num">{num}</span>
                          <span className="wf-section-title">{label}</span>
                        </div>
                        <div className="wf-section-right">
                          <span className={`wf-status-pill ${statusCls}`}>{statusLabel}</span>
                          <span className={`wf-chevron ${open ? 'open' : ''}`}>›</span>
                        </div>
                      </button>
                      {open && (
                        <div className="wf-section-body">
                          {items.length > 0 ? renderItems() : (
                            <p className="wf-empty-hint">{emptyHint}</p>
                          )}
                        </div>
                      )}
                    </div>
                  );
                }

                return (
                  <>
                    <div className="wf-head">
                      <div className="wf-head-top">
                        <span className="wf-stage-label">工作流 · 4 阶段</span>
                        <span className="wf-pct tnum">{ratio}%</span>
                      </div>
                      <div className="wf-progress-bar">
                        <div className="wf-progress-fill" style={{ width: `${ratio}%` }} />
                      </div>
                      <p className="wf-note">前 3 个阶段累计 100% 确认后，可生成实例包</p>
                    </div>

                    <div className="wf-sections">
                      <WfSection
                        num="①"
                        sectionKey="docs"
                        label="上传资料"
                        statusLabel={docsDone ? `已完成 ${docConfirmed}/${docEntries.length}` : (docsActive ? `进行中 ${docConfirmed}/${docEntries.length}` : '待生成')}
                        statusCls={docsDone ? 'wf-pill-done' : (docsActive ? 'wf-pill-active' : 'wf-pill-pending')}
                        items={docEntries}
                        emptyHint="在左侧描述业务场景或资料需求，我会自动登记..."
                        renderItems={() => docEntries.map((item, i) => (
                          <div key={item.id || i} className="wf-item">
                            <span className={`wf-item-check${item.status === 'pending' ? ' wf-item-check-pending' : ''}`}>{item.status === 'pending' ? '○' : '✓'}</span>
                            <div className="wf-item-body">
                              <div className="wf-item-title">
                                <span className="wf-item-name">{item.label}</span>
                                {item.type && <span className="wf-item-tag">{item.type}</span>}
                                {item.tags && item.tags.length > 0 && <span className="wf-item-tag wf-item-tag-type">· {item.tags.join(' · ')}</span>}
                              </div>
                              <p className="wf-item-hint">{item.hint}</p>
                            </div>
                            {item.status === 'confirmed'
                              ? <span className="wf-confirmed">已确认</span>
                              : <span className="wf-pending-badge">待确认</span>}
                          </div>
                        ))}
                      />

                      <WfSection
                        num="②"
                        sectionKey="skills"
                        label="补齐技能"
                        statusLabel={skillsDone ? `已完成 ${skillConfirmed}/${skillEntries.length}` : (skillsActive ? `进行中 ${skillConfirmed}/${skillEntries.length}` : (docsHasAny ? '待生成' : '等待前序'))}
                        statusCls={skillsDone ? 'wf-pill-done' : (skillsActive ? 'wf-pill-active' : 'wf-pill-wait')}
                        items={skillEntries}
                        emptyHint={docsHasAny ? '基于①阶段已确认资料自动推断；用户在会话中补充技能需求时也可新增' : '等待前序阶段确认后自动生成...'}
                        renderItems={() => skillEntries.map((item, i) => (
                          <div key={item.id || i} className="wf-item">
                            <span className={`wf-item-check${item.status === 'pending' ? ' wf-item-check-pending' : ''}`}>{item.status === 'pending' ? '○' : '✓'}</span>
                            <div className="wf-item-body">
                              <div className="wf-item-title">
                                <span className="wf-item-name">{item.label}</span>
                                <span className="wf-item-tag">{item.type}</span>
                                {item.dep && <span className="wf-item-tag wf-item-tag-dep">· {item.dep}</span>}
                              </div>
                              <p className="wf-item-hint">{item.hint}</p>
                            </div>
                            {item.status === 'confirmed'
                              ? <span className="wf-confirmed">已确认</span>
                              : <span className="wf-pending-badge">待确认</span>}
                          </div>
                        ))}
                      />

                      <WfSection
                        num="③"
                        sectionKey="integrations"
                        label="配置外部系统"
                        statusLabel={sysDone ? `已完成 ${sysConfirmed}/${sysEntries.length}` : (sysActive ? `进行中 ${sysConfirmed}/${sysEntries.length}` : (skillsHasAny ? '待生成' : '等待前序'))}
                        statusCls={sysDone ? 'wf-pill-done' : (sysActive ? 'wf-pill-active' : 'wf-pill-wait')}
                        items={sysEntries}
                        emptyHint={skillsHasAny ? '会话中提及外部系统、接口后集成需求时触发，每个系统对应一条待办。' : '等待前序阶段确认后自动生成...'}
                        renderItems={() => sysEntries.map((item, i) => (
                          <div key={item.id || i} className="wf-item">
                            <span className={`wf-item-check${item.status === 'pending' ? ' wf-item-check-pending' : ''}`}>{item.status === 'pending' ? '○' : '✓'}</span>
                            <div className="wf-item-body">
                              <div className="wf-item-title">
                                <span className="wf-item-name">{item.label}</span>
                                <span className="wf-item-tag">{item.type || 'REST API'}</span>
                              </div>
                              <p className="wf-item-hint">{item.hint}</p>
                            </div>
                            {item.status === 'confirmed'
                              ? <span className="wf-confirmed">已确认</span>
                              : <span className="wf-pending-badge">待确认</span>}
                          </div>
                        ))}
                      />

                      {/* 生成实例包 */}
                      <div className={`wf-section ${flow.package.generated ? 'wf-section-has-data' : 'wf-section-empty'}`}>
                        <button className="wf-section-head" onClick={() => toggleSection('package')}>
                          <div className="wf-section-left">
                            <span className="wf-num">④</span>
                            <span className="wf-section-title">生成实例包</span>
                          </div>
                          <div className="wf-section-right">
                            <span className={`wf-status-pill ${flow.package.generated ? 'wf-pill-done' : 'wf-pill-wait'}`}>
                              {flow.package.generated ? '已生成' : '等待前序'}
                            </span>
                            <span className={`wf-chevron ${wfExpanded.package ? 'open' : ''}`}>›</span>
                          </div>
                        </button>
                        {wfExpanded.package && (
                          <div className="wf-section-body">
                            <div className="wf-pkg-stats">
                              <div className="wf-pkg-stat">
                                <span className="wf-pkg-num tnum">{docConfirmed}/{docEntries.length || 0}</span>
                                <span className="wf-pkg-label">① 资料</span>
                              </div>
                              <div className="wf-pkg-stat">
                                <span className="wf-pkg-num tnum">{skillConfirmed}/{skillEntries.length || 0}</span>
                                <span className="wf-pkg-label">② 技能</span>
                              </div>
                              <div className="wf-pkg-stat">
                                <span className="wf-pkg-num tnum">{sysConfirmed}/{sysEntries.length || 0}</span>
                                <span className="wf-pkg-label">③ 外部系统</span>
                              </div>
                            </div>
                            {!flow.package.generated && (
                              <>
                                <button
                                  className="wf-pkg-btn"
                                  disabled={!allStagesDone || anyPending}
                                  onClick={() => {
                                    if (!allStagesDone || anyPending) return;
                                    enterEvaluation();
                                  }}
                                >
                                  {allStagesDone && !anyPending ? '进入 AI 评估 →' : '🔒 完成前序待办可用'}
                                </button>
                                <p className="wf-pkg-note">✦ 硬性校验：3 个阶段有待办须 100% 确认</p>
                              </>
                            )}
                            {flow.package.generated && (
                              <button className="wf-pkg-btn wf-pkg-btn-ready" onClick={enterEvaluation}>
                                进入 AI 评估 →
                              </button>
                            )}
                          </div>
                        )}
                      </div>
                    </div>
                  </>
                );
              })()}
            </aside>
          </main>
        </div>

        <HireSystemDrawer
          open={!!activeSystemId}
          system={currentSystem}
          form={systemForm}
          feedback={drawerFeedback}
          onChange={handleSystemFormChange}
          onClose={closeSystemDrawer}
          onTest={testCurrentSystem}
          onSubmit={saveSystemConfig}
        />

        <HireSkillModal
          open={!!editingSkillId}
          form={skillForm}
          onChange={event => {
            const { name, value } = event.target;
            setSkillForm(prev => ({ ...prev, [name]: value }));
          }}
          onClose={closeSkillEditor}
          onSubmit={submitSkillEdit}
        />

        {flow.package.generated && (
          <button className="float-evaluation-btn" onClick={enterEvaluation}>
            进入 AI 评估 →
          </button>
        )}

        <input ref={businessFileInputRef} type="file" multiple hidden onChange={onBusinessInputChange} />
        <input ref={skillFileInputRef} type="file" multiple hidden onChange={onSkillInputChange} />
      </div>
    </div>
  );
}

function EvalScoreTrendChart({ iterations }) {
  const W = 320;
  const H = 100;
  const PAD = { top: 12, right: 16, bottom: 20, left: 28 };
  const innerW = W - PAD.left - PAD.right;
  const innerH = H - PAD.top - PAD.bottom;

  const scores = iterations.map(it => it.score);
  const maxX = Math.max(iterations.length - 1, 1);
  const passingScore = 75;

  const px = i => PAD.left + (i / maxX) * innerW;
  const py = s => PAD.top + innerH - (s / 100) * innerH;

  const pathD = scores.map((s, i) => `${i === 0 ? 'M' : 'L'} ${px(i)} ${py(s)}`).join(' ');
  const areaD = `${pathD} L ${px(scores.length - 1)} ${PAD.top + innerH} L ${PAD.left} ${PAD.top + innerH} Z`;
  const thresholdY = py(passingScore);

  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ maxHeight: 100 }}>
      {[0, 25, 50, 75, 100].map(v => (
        <line key={v} x1={PAD.left} y1={py(v)} x2={W - PAD.right} y2={py(v)} stroke="#f1f5f9" strokeWidth="1" />
      ))}
      <line x1={PAD.left} y1={thresholdY} x2={W - PAD.right} y2={thresholdY} stroke="#22c55e" strokeWidth="1.5" strokeDasharray="4 3" />
      <text x={W - PAD.right + 2} y={thresholdY + 3} fontSize="9" fill="#22c55e">合格线 75</text>
      <path d={areaD} fill="#6366f1" fillOpacity="0.08" />
      <path d={pathD} fill="none" stroke="#6366f1" strokeWidth="2" strokeLinejoin="round" />
      {scores.map((s, i) => {
        const passed = iterations[i].passed;
        return (
          <g key={i}>
            <circle cx={px(i)} cy={py(s)} r="4" fill={passed ? '#22c55e' : '#6366f1'} stroke="white" strokeWidth="1.5" />
            <text x={px(i)} y={py(s) - 8} textAnchor="middle" fontSize="10" fontWeight="600" fill={passed ? '#16a34a' : '#6366f1'}>
              {s}
            </text>
            <text x={px(i)} y={PAD.top + innerH + 14} textAnchor="middle" fontSize="9" fill="#94a3b8">
              第{i + 1}轮
            </text>
          </g>
        );
      })}
    </svg>
  );
}

    it.modifications.map(mod => ({ round: it.round, ...mod }))

  const dimensionNames = ['功能完整性', '交互质量', '流程合规', '问题解决', '工具调用正确性'];

  return (
    <div className="eval-summary-panel">

      </div>

      <div className="eval-stats-grid">
        <div className="eval-stat-box">
          <div className="eval-stat-value indigo">{iterations.length}</div>
          <div className="eval-stat-label">训练轮次</div>
        </div>
        <div className="eval-stat-box">
          <div className={`eval-stat-value ${improvement > 0 ? 'green' : 'red'}`}>
            {improvement > 0 ? '+' : ''}{improvement}
          </div>
          <div className="eval-stat-label">分数提升</div>
        </div>
        <div className="eval-stat-box">
          <div className="eval-stat-value amber">{allModifications.length}</div>
          <div className="eval-stat-label">修改次数</div>
        </div>
      </div>

      <div className="eval-section">

        <div className="eval-chart-wrap">
          <EvalScoreTrendChart iterations={iterations} />
        </div>
      </div>

      <div className="eval-section">
        <div className="eval-section-title">维度得分对比</div>
        <div className="eval-dim-table">
          <table>
            <thead>
              <tr>
                <th>维度</th>
                {iterations.map(it => <th key={it.round}>第{it.round}轮</th>)}
                <th className="green">目标</th>
              </tr>
            </thead>
            <tbody>
              {dimensionNames.map(dimName => {
                const scoresByRound = iterations.map(it =>
                  it.dimensions.find(d => d.name === dimName)?.score || 0
                );
                const finalScore = scoresByRound[scoresByRound.length - 1];
                const reached = finalScore >= 75;
                return (
                  <tr key={dimName}>
                    <td>{dimName}</td>
                    {scoresByRound.map((score, i) => (
                      <td key={i} className={i === scoresByRound.length - 1 ? (reached ? 'green' : 'red') : ''}>
                        {score}
                        {i > 0 && score > scoresByRound[i-1] && <span className="arrow-up">↑</span>}
                      </td>
                    ))}
                    <td className="gray">75</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {allModifications.length > 0 && (
        <div className="eval-section">
          <div className="eval-section-title">修改历史</div>
          <div className="eval-mod-list">
            {allModifications.map(mod => (

                  <span className="eval-mod-title">{mod.title}</span>

                    <div>{mod.after}</div>
                  </div>
                </div>
                <div className="eval-mod-gain">预期效果：{mod.expectedGain}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="eval-conclusion">
        <div className="eval-conclusion-title">总结</div>
        <p>
          该数字员工经过 <strong>{iterations.length} 轮训练</strong>，从初始 <strong>{firstIteration.score} 分</strong> 提升至
          <strong className={finalIteration.passed ? 'green' : 'red'}> {finalIteration.score} 分</strong>，

// ===== AI Evaluation Page =====
function AIEvalPage({ id, go, toast }) {
  const e = window.findEmployeeById(id) || window.DEPT_EMPLOYEES[2];
  const [artifactTab, setArtifactTab] = _useStateE('report');
  const [chatInput, setChatInput] = _useStateE('');
  const [rightCollapsed, setRightCollapsed] = _useStateE(false);
  const [selectedRound, setSelectedRound] = _useStateE(3);
  const [showSummaryModal, setShowSummaryModal] = _useStateE(false);

  const trainingCompleted = true;
  const currentIteration = EVAL_ITERATIONS.find(it => it.round === selectedRound) || EVAL_ITERATIONS[2];

  const TABS = [
    { key: 'testcase', label: '测试用例' },
    { key: 'trace', label: 'Trace' },
    { key: 'report', label: '评估报告' },
  ];

  return (
    <div className="page eval-page">
      <div className="eval-topbar">
        <button className="eval-back" onClick={() => go(`employee/${e.id}`)}>
          <window.Icon.back className="icn" />
          返回
        </button>
        <div className="eval-topbar-divider" />
        <div>
          <h1 className="eval-topbar-title">AI 评估训练</h1>
          <p className="eval-topbar-sub">{e.name} · {e.desc || '数字员工'}</p>
        </div>
        <div className="eval-topbar-actions">
          {trainingCompleted && (
            <button className="btn btn-primary btn-sm" onClick={() => setShowSummaryModal(true)}>
              查看综合报告
            </button>
          )}
        </div>
      </div>

      <div className="eval-progress-wrap">
        <EvalProgressBar currentIteration={3} maxIterations={30} currentStep={3} />
      </div>

      <div className="eval-main">
        <div className="eval-chat-panel">
          <div className="eval-scenarios-wrap">
            <EvalScenariosPanel />
          </div>
          <div className="eval-messages">
            {EVAL_CHAT_MESSAGES.map(msg => (
              <EvalChatMessage key={msg.id} msg={msg} />
            ))}
          </div>
          <div className="eval-input">
            <button className="eval-input-attach">
              <window.Icon.upload className="icn" />
            </button>
            <input
              value={chatInput}
              onChange={evt => setChatInput(evt.target.value)}
              placeholder="回复评估专家..."
            />
            <button className="eval-input-send">
              <window.Icon.arrow className="icn" />
            </button>
          </div>
        </div>

        <div className={`eval-artifact-panel ${rightCollapsed ? 'collapsed' : ''}`}>
          {rightCollapsed ? (
            <button className="eval-artifact-expand" onClick={() => setRightCollapsed(false)}>
              <window.Icon.arrow className="icn" style={{ transform: 'rotate(90deg)' }} />
            </button>
          ) : (
            <>
              <div className="eval-artifact-head">
                <div className="eval-artifact-round">
                  <span className="eval-artifact-round-label">轮次</span>
                  <select value={selectedRound} onChange={e => setSelectedRound(Number(e.target.value))}>
                    {EVAL_ITERATIONS.map(it => (
                      <option key={it.round} value={it.round}>
                        第 {it.round} 轮 ({it.score}分{it.passed ? ' ✓' : ''})
                      </option>
                    ))}
                  </select>
                </div>
                <button className="eval-artifact-collapse" onClick={() => setRightCollapsed(true)}>
                  <window.Icon.arrow className="icn" style={{ transform: 'rotate(-90deg)' }} />
                </button>
              </div>

              <div className="eval-artifact-tabs">
                {TABS.map(tab => (
                  <button
                    key={tab.key}
                    className={`eval-artifact-tab ${artifactTab === tab.key ? 'active' : ''}`}
                    onClick={() => setArtifactTab(tab.key)}
                  >
                    {tab.label}
                  </button>
                ))}
              </div>

              <div className="eval-artifact-content">
                {artifactTab === 'testcase' && <EvalTestCasePanel />}
                {artifactTab === 'trace' && <EvalTracePanel />}
                {artifactTab === 'report' && <EvalReportPanel iteration={currentIteration} />}
              </div>
            </>
          )}
        </div>
      </div>

      {showSummaryModal && (
        <div className="eval-modal-mask" onClick={() => setShowSummaryModal(false)}>
          <div className="eval-modal" onClick={e => e.stopPropagation()}>
            <div className="eval-modal-head">
              <span className="eval-modal-icon">✓</span>
              <h2 className="eval-modal-title">评估训练综合报告</h2>
              <div className="eval-modal-actions">
                <button className="btn btn-primary btn-sm" onClick={() => setShowSummaryModal(false)}>
                  下载报告
                </button>
                <button className="eval-modal-close" onClick={() => setShowSummaryModal(false)}>
                  ×
                </button>
              </div>
            </div>
            <div className="eval-modal-body">
              <EvalSummaryReportPanel iterations={EVAL_ITERATIONS} />
            </div>
          </div>
        </div>
      )}

      <div className="eval-footer">
        <button className="btn btn-ghost" onClick={() => go(`review/${e.id}`)}>有问题 · 去 Review</button>
        <button
          className="btn btn-primary"
          onClick={() => {
            toast("AI 评估通过 · 进入人工评估");
            go(`eval-human/${e.id}`);
          }}
        >
          进入人工评估 <window.Icon.arrow className="icn" />
        </button>
      </div>
    </div>
  );
}

// ===== Human Evaluation Sub Components =====
function HumanScenarioProgressBar({ scenarios }) {
  const completed = scenarios.filter(s => s.status === 'completed').length;
  const total = scenarios.length;
  const progress = Math.round((completed / total) * 100);

  return (
    <div className="human-progress-bar">
      <div className="human-stepper">
        {scenarios.map((s, i) => {
          const done = s.status === 'completed';
          const passed = done && s.verdict !== 'failed';
          const failed = done && s.verdict === 'failed';
          const cls = passed ? 'passed' : failed ? 'failed' : 'pending';
          return (
            <React.Fragment key={s.scenario_id}>
              <div className={`human-stepper-step ${cls}`}>
                <div className="human-stepper-dot">
                  {passed ? '✓' : failed ? '×' : i + 1}
                </div>
                <span className="human-stepper-label">{s.scenario_name}</span>
              </div>
              {i < scenarios.length - 1 && <div className={`human-stepper-line ${done ? cls : ''}`} />}
            </React.Fragment>
          );
        })}
      </div>
      <span className="human-progress-pct">{completed}/{total} 完成 ({progress}%)</span>
    </div>
  );
}

function HumanScenarioNavigator({ scenarios, currentScenarioId, onNavigate }) {
  const [open, setOpen] = _useStateE(false);
  return (
    <div className="human-scenario-nav">
      <div className="human-scenario-nav-title" style={{ cursor: 'pointer', userSelect: 'none', display: 'flex', alignItems: 'center' }} onClick={() => setOpen(v => !v)}>
        <span style={{ flex: 1 }}>评估场景</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
             style={{ width: 13, height: 13, color: 'var(--ink-4)', transform: open ? 'rotate(0deg)' : 'rotate(-90deg)', transition: 'transform 0.18s' }}>
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </div>
      {open && (
        <div className="human-scenario-nav-list">
          {scenarios.map(s => (
            <button
              key={s.scenario_id}
              className={`human-scenario-nav-item ${currentScenarioId === s.scenario_id ? 'active' : ''}`}
              onClick={() => onNavigate(s.scenario_id)}
            >
              {s.status === 'completed' ? (s.verdict === 'passed' ? '✓' : '×') : '⏳'}
              <span className="human-scenario-nav-name">{s.scenario_name}</span>
              <span className="human-scenario-nav-count">{s.message_count}条</span>
            </button>
          ))}

      )}

}

function HumanChatMessage({ msg, scenarios, onVerdictSubmit, onOnboardingSubmit }) {
  if (msg.type === 'scenario_divider') {
    return (
      <div className="human-msg-divider">
        <span>═══ {msg.content} ═══</span>
      </div>
    );
  }

  if (msg.type === 'verdict_request') {
    if (msg.submitted) {
      return (
        <div className="human-msg-verdict-submitted">
          <div className="human-msg-verdict-head submitted">
            <span className="human-msg-verdict-icon submitted">✓</span>
            <span className="human-msg-verdict-title submitted">场景评估判定（已完成）</span>
          </div>
          <p className="human-msg-verdict-desc">{msg.content}</p>
          <div className={`human-msg-verdict-result ${msg.submittedVerdict}`}>
            {msg.submittedVerdict === 'passed' ? '👍' : '👎'}
            <span>{msg.submittedVerdict === 'passed' ? '满意' : '不满意'}</span>
            {msg.submittedComment && <span className="human-msg-verdict-comment">— {msg.submittedComment}</span>}
          </div>
        </div>
      );
    }

    return (
      <div className="human-msg-verdict-request">
        <div className="human-msg-verdict-head request">
          <span className="human-msg-verdict-icon request">⚠</span>
          <span className="human-msg-verdict-title request">场景评估判定</span>
          <span className="human-msg-verdict-badge">必选</span>
        </div>
        <p className="human-msg-verdict-desc">{msg.content}</p>
        <HumanVerdictPanel messageId={msg.message_id} onSubmit={onVerdictSubmit} />
      </div>
    );
  }

  if (msg.type === 'onboarding_request') {
    const passed = scenarios.filter(s => s.verdict === 'passed').length;
    const total = scenarios.length;
    const allPassed = passed === total;

    if (msg.submitted) {
      return (
        <div className="human-msg-onboarding-submitted">
          <div className="human-msg-onboarding-head submitted">
            <span className="human-msg-onboarding-icon submitted">✓</span>
            <span className="human-msg-onboarding-title submitted">上岗判定（已完成）</span>
          </div>
          <div className={`human-msg-onboarding-result ${msg.submittedOnboarding === 'onboard' || msg.submittedOnboarding === 'force' ? 'passed' : 'failed'}`}>
            {msg.submittedOnboarding === 'onboard' || msg.submittedOnboarding === 'force' ? '✅' : '❌'}
            <span>{msg.submittedOnboarding === 'onboard' ? '可以上岗' : msg.submittedOnboarding === 'force' ? '强制上岗' : '不可以上岗'}</span>
            {msg.submittedComment && <span className="human-msg-onboarding-comment">— {msg.submittedComment}</span>}
          </div>
        </div>
      );
    }

    return (
      <div className="human-msg-onboarding-request">
        <div className="human-msg-onboarding-head request">
          <span className="human-msg-onboarding-icon request">👤</span>
          <span className="human-msg-onboarding-title request">上岗判定</span>
          <span className="human-msg-onboarding-badge">必选</span>
        </div>

        <div className="human-msg-onboarding-summary">
          <div className="human-msg-onboarding-summary-title">评估结果汇总</div>
          <div className="human-msg-onboarding-summary-grid">
            {scenarios.map(s => (
              <div key={s.scenario_id} className="human-msg-onboarding-summary-item">
                {s.verdict === 'passed' ? '✓' : '×'}
                <span>{s.scenario_name}</span>
              </div>
            ))}
          </div>
          <div className="human-msg-onboarding-summary-foot">
            <span>通过率: <strong className={allPassed ? 'green' : 'red'}>{passed}/{total}</strong></span>
            <span className={allPassed ? 'green' : 'amber'}>{allPassed ? '✅ 全部合格' : '⚠️ 存在不合格场景'}</span>
          </div>
        </div>

        <p className="human-msg-onboarding-desc">所有场景评估已完成。请根据评估结果，决定该数字员工是否上岗。</p>

        <HumanOnboardingPanel messageId={msg.message_id} allPassed={allPassed} onSubmit={onOnboardingSubmit} />
      </div>
    );
  }

  if (msg.role === 'user') {
    return (
      <div className="human-msg-user">
        <div className="human-msg-user-bubble">{msg.content}</div>
      </div>
    );
  }

  if (msg.role === 'system') {
    return (
      <div className="human-msg-system">
        <span>{msg.content}</span>
      </div>
    );
  }

  return (
    <div className="human-msg-assistant">
      <div className="human-msg-assistant-bubble">
        {msg.content}
        {msg.trace && msg.trace.tool_calls && msg.trace.tool_calls.length > 0 && (
          <div className="human-msg-assistant-tools">
            <span>🔧 调用了 {msg.trace.tool_calls.length} 个工具</span>
          </div>
        )}
      </div>
    </div>
  );
}

function HumanVerdictPanel({ messageId, onSubmit }) {
  const [verdict, setVerdict] = _useStateE(null);

  function handleClick(v) {
    setVerdict(v);
    if (onSubmit) onSubmit(v, '', messageId);
  }

  return (
    <div className="human-verdict-panel">
      <div className="human-verdict-buttons">
        <button className={`human-verdict-btn ${verdict === 'passed' ? 'passed active' : ''}`} onClick={() => handleClick('passed')}>
          <span className="human-verdict-btn-icon">👍</span>
          <span className="human-verdict-btn-label">满意</span>
        </button>
        <button className={`human-verdict-btn ${verdict === 'failed' ? 'failed active' : ''}`} onClick={() => handleClick('failed')}>
          <span className="human-verdict-btn-icon">👎</span>
          <span className="human-verdict-btn-label">不满意</span>
        </button>
      </div>
    </div>
  );
}

function HumanOnboardingPanel({ messageId, allPassed, onSubmit }) {
  const [decision, setDecision] = _useStateE(null);
  const [comment, setComment] = _useStateE('');

  return (
    <div className="human-onboarding-panel">
      {allPassed ? (
        <div className="human-onboarding-buttons">
          <button className={`human-onboarding-btn ${decision === 'onboard' ? 'passed active' : ''}`} onClick={() => setDecision('onboard')}>
            <span className="human-onboarding-btn-icon">✅</span>
            <span className="human-onboarding-btn-label">可以上岗</span>
            <span className="human-onboarding-btn-desc">数字员工符合上岗要求</span>
          </button>
          <button className={`human-onboarding-btn ${decision === 'reject' ? 'failed active' : ''}`} onClick={() => setDecision('reject')}>
            <span className="human-onboarding-btn-icon">❌</span>
            <span className="human-onboarding-btn-label">不可以上岗</span>
            <span className="human-onboarding-btn-desc">评估结果存疑，暂不上岗</span>
          </button>
        </div>
      ) : (
        <div className="human-onboarding-buttons-v">
          <button className={`human-onboarding-btn-v ${decision === 'reject' ? 'failed active' : ''}`} onClick={() => setDecision('reject')}>
            <span className="human-onboarding-btn-icon">❌</span>
            <span>不可以上岗 — 存在不合格场景，暂不上岗</span>
          </button>
          <button className={`human-onboarding-btn-v ${decision === 'force' ? 'amber active' : ''}`} onClick={() => setDecision('force')}>
            <span className="human-onboarding-btn-icon amber">🛡️</span>
            <span>强制上岗 — 存在不合格场景，但仍要求上岗</span>
          </button>
        </div>
      )}
      <div className="human-onboarding-comment">
        <label>判定备注（可选）</label>
        <input value={comment} onChange={e => setComment(e.target.value)} placeholder="填写判定原因..." />
      </div>
      <button
        className={`human-onboarding-submit ${decision ? (decision === 'onboard' || decision === 'force' ? 'passed' : 'failed') : 'disabled'}`}
        onClick={() => decision && onSubmit && onSubmit(decision, comment, messageId)}
        disabled={!decision}
      >
        确认决定
      </button>
    </div>
  );
}

function HumanTracePanel({ messages, currentScenarioId }) {
  const scenarioMessages = messages.filter(m => m.scenario_id === currentScenarioId && m.trace);
  const traces = scenarioMessages.flatMap(m => m.trace ? [{ msg_id: m.message_id, ...m.trace }] : []);

  if (traces.length === 0) {
    return <div className="human-trace-empty">当前场景暂无执行过程数据</div>;
  }

  return (
    <div className="human-trace-panel">
      {traces.flatMap(t => [
        ...t.thoughts.map(th => (
          <div key={`th-${th.timestamp}`} className="human-trace-thought">
            <div className="human-trace-thought-head">
              <span className="human-trace-thought-icon">⚡</span>
              <span className="human-trace-thought-label">思考</span>
              <span className="human-trace-time">{th.timestamp}</span>
            </div>
            <p>{th.content}</p>
          </div>
        )),
        ...t.tool_calls.map(tc => (
          <div key={`tc-${tc.timestamp}`} className="human-trace-tool">
            <div className="human-trace-tool-head">
              <span className="human-trace-tool-icon">🔧</span>
              <span className="human-trace-tool-label">工具: {tc.tool_name}</span>
              {tc.success ? '✓' : '×'}
              <span className="human-trace-time">{tc.duration_ms}ms</span>
            </div>
            <div className="human-trace-tool-params">params: {JSON.stringify(tc.parameters)}</div>
            <div className="human-trace-tool-result">result: {JSON.stringify(tc.result)}</div>
          </div>
        ))
      ])}
    </div>
  );
}

function HumanConversationPanel({ messages, currentScenarioId }) {
  const scenarioMessages = messages.filter(m => m.scenario_id === currentScenarioId && m.role !== 'system');

  if (scenarioMessages.length === 0) {
    return <div className="human-conversation-empty">当前场景暂无对话记录</div>;
  }

  return (
    <div className="human-conversation-panel">
      {scenarioMessages.map(m => (
        <div key={m.message_id} className={`human-conversation-msg ${m.role}`}>
          <div className="human-conversation-time">{m.timestamp}</div>
          <div className="human-conversation-bubble">{m.content}</div>
        </div>
      ))}
    </div>
  );
}

function HumanReportPanel({ currentScenario }) {
  return (
    <div className="human-report-panel">
      <div className="human-report-header">
        <div className="human-report-name">场景: {currentScenario?.scenario_name}</div>
        <div className="human-report-status">状态: {currentScenario?.status === 'completed' ? '已完成' : '进行中'}</div>
      </div>
      <div className="human-report-count">
        <label>对话轮数</label>
        <div className="human-report-count-value">6 轮</div>
      </div>
      {currentScenario?.verdict && (
        <div className={`human-report-verdict ${currentScenario.verdict}`}>
          {currentScenario.verdict === 'passed' ? '✓' : '×'}
          <span>{currentScenario.verdict === 'passed' ? '合格' : '不合格'}</span>
          {currentScenario.verdict_comment && <p>{currentScenario.verdict_comment}</p>}
        </div>
      )}
    </div>
  );
}

  const failed = scenarios.filter(s => s.verdict === 'failed').length;

  const allPassed = passed === total && scenarios.every(s => s.status === 'completed');
  const passRate = Math.round((passed / total) * 100);
  const now = new Date().toLocaleString('zh-CN');

  const styles = `
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; padding: 40px; color: #334155; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); }
    .header { text-align: center; padding: 32px; border-radius: 16px 16px 0 0; }
    .header.passed { background: linear-gradient(135deg, #dcfce7, #bbf7d0); border-bottom: 3px solid #16a34a; }
    .header.amber { background: linear-gradient(135deg, #fef3c7, #fde68a); border-bottom: 3px solid #f59e0b; }
    .icon { font-size: 48px; margin-bottom: 16px; }
