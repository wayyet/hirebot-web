function cloneObject(source) {
  return source ? JSON.parse(JSON.stringify(source)) : source;
}

function findEmployeeById(id) {
  return DEPT_EMPLOYEES.find(e => e.id === id)
    || MY_EMPLOYEES.find(e => e.id === id)
    || (window.__DATA__ && window.__DATA__.employees && window.__DATA__.employees.find(e => e.id === id));
}

function findTemplateById(id) {
  return TEMPLATES.find(t => t.id === id);
}

function getViewer(role) {
  return VIEWER_META[role] || VIEWER_META.manager;
}

function getMyEmployeesForRole(role) {
  const viewer = getViewer(role);
  return MY_EMPLOYEES.filter(e => e.owner === viewer.name);
}

function updateEmployee(id, patch) {
  const target = findEmployeeById(id);
  if (!target) return null;
  Object.assign(target, patch);
  return target;
}

function generateId(prefix) {
  return `${prefix}_${Math.random().toString(36).slice(2, 8)}`;
}

function uniqueName(base, list) {
  const normalized = base.trim();
  if (!list.some(item => item.name === normalized)) return normalized;
  let idx = 2;
  while (list.some(item => item.name === `${normalized} ${idx}`)) idx += 1;
  return `${normalized} ${idx}`;
}

function readIMStore() {
  if (window.__NCREW_IM_BINDINGS__) return window.__NCREW_IM_BINDINGS__;
  try {
    const raw = window.localStorage && window.localStorage.getItem(IM_BINDING_STORAGE_KEY);
    window.__NCREW_IM_BINDINGS__ = raw ? JSON.parse(raw) : {};
  } catch (err) {
    window.__NCREW_IM_BINDINGS__ = {};
  }
  return window.__NCREW_IM_BINDINGS__;
}

function writeIMStore(nextStore) {
  window.__NCREW_IM_BINDINGS__ = nextStore;
  try {
    if (window.localStorage) window.localStorage.setItem(IM_BINDING_STORAGE_KEY, JSON.stringify(nextStore));
  } catch (err) {}
}

function buildSeedBindings(employee) {
  return cloneObject((employee && employee.seedBindings) || {});
}

function getEmployeeBindings(employeeId) {
  const store = readIMStore();
  if (store[employeeId]) return cloneObject(store[employeeId]);
  const seeded = buildSeedBindings(findEmployeeById(employeeId));
  store[employeeId] = seeded;
  writeIMStore(store);
  return cloneObject(seeded);
}

function getBinding(employeeId, channelId) {
  return getEmployeeBindings(employeeId)[channelId] || null;
}

function saveEmployeeBinding(employeeId, channelId, binding) {
  const store = readIMStore();
  const current = store[employeeId] ? cloneObject(store[employeeId]) : buildSeedBindings(findEmployeeById(employeeId));
  current[channelId] = binding;
  writeIMStore({ ...store, [employeeId]: current });
  return current[channelId];
}

function removeEmployeeBinding(employeeId, channelId) {
  const store = readIMStore();
  const current = store[employeeId] ? cloneObject(store[employeeId]) : buildSeedBindings(findEmployeeById(employeeId));
  delete current[channelId];
  writeIMStore({ ...store, [employeeId]: current });
  return current;
}

function getBindingStatus(employeeId, channelId) {
  const binding = getBinding(employeeId, channelId);
  return binding ? (binding.status || "connected") : "unconfigured";
}

function getConnectedChannels(employeeId) {
  const bindings = getEmployeeBindings(employeeId);
  return Object.keys(bindings).filter(channelId => bindings[channelId] && bindings[channelId].status !== "error");
}

function formatNow() {
  try {
    return new Date().toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  } catch (err) {
    return "刚刚";
  }
}

function resolveTopNav(route) {
  if (!route) return "templates";
  if (route.startsWith("templates") || route.startsWith("template/")) return "templates";
  if (route.startsWith("hire/new")) return "templates";
  if (route.startsWith("dept")) return "dept";
  if (route.startsWith("my")) return "my";

  const id = route.split("/")[1] ? route.split("/")[1].split("?")[0] : "";
  const employee = id ? window.findEmployeeById(id) : null;

  if (route.startsWith("clone/") || route.startsWith("quick-clone/")) return "dept";
  if (route.startsWith("chat/") || route.startsWith("im/")) return "my";
  if (route.startsWith("employee/") || route.startsWith("publish/") || route.startsWith("eval-ai/") || route.startsWith("eval-human/") || route.startsWith("review/")) {
    return employee && employee.type === "department" ? "dept" : "my";
  }
  if (route.startsWith("branch/") || route.startsWith("customize/")) return "my";
  if (route.startsWith("hire/")) return employee && employee.type === "department" ? "dept" : "my";
  return "dept";
}

function Lineage({ employee }) {
  const segments = [];
  const template = window.findTemplateById(employee.template);
  if (template) segments.push({ kind: "模板", name: template.name });

  if (employee.type === "department" && employee.clonedFrom) {
    const source = window.findEmployeeById(employee.clonedFrom);
    if (source) segments.push({ kind: "快捷复制源", name: source.name });
  }

  if (employee.type === "department") {
    segments.push({ kind: "部门员工", name: employee.name });
  }

  if (employee.type === "personal_clone") {
    const department = window.findEmployeeById(employee.parent);
    if (department) segments.push({ kind: "部门员工", name: department.name });
    segments.push({ kind: "我的分身", name: employee.name });
  }

  if (employee.type === "private_branch") {
    const parentClone = window.findEmployeeById(employee.parent);
    if (parentClone) {
      const department = window.findEmployeeById(parentClone.parent);
      if (department) segments.push({ kind: "部门员工", name: department.name });
      segments.push({ kind: "我的分身", name: parentClone.name });
    }
    segments.push({ kind: "私人定制", name: employee.name });
  }

  return (
    <div className="lineage">
      {segments.map((item, idx) => (
        <React.Fragment key={`${item.kind}-${idx}`}>
          <span className="seg"><span className="muted" style={{ fontSize: 11 }}>{item.kind}</span> · {item.name}</span>
          {idx < segments.length - 1 && <span className="arr">→</span>}
        </React.Fragment>
      ))}
    </div>
  );
}

function StepsBar({ steps, current, view = current, onStepClick, isStepClickable, isStepConfirmed }) {
  return (
    <div className="steps">
      {steps.map((step, idx) => {
        const classes = [];
        const clickable = typeof onStepClick === "function" && (typeof isStepClickable === "function" ? isStepClickable(idx) : idx <= current);
        const confirmed = typeof isStepConfirmed === "function" ? isStepConfirmed(idx) : idx < current;
        let stateLabel = "";
        if (idx < current) classes.push("done");
        if (idx === current) classes.push("active");
        if (idx === view && idx !== current) classes.push("viewing");
        if (clickable) classes.push("clickable");
        if (idx === view && idx !== current) stateLabel = "回看中";
        else if (idx === current) stateLabel = confirmed ? "已确认" : "进行中";
        else if (confirmed) stateLabel = "已确认";
        const content = (
          <>
            <span className="num">{idx + 1}</span>
            <span className="step-copy">
              <span className="step-title">{step.title}</span>
              {stateLabel && <span className="step-state">{stateLabel}</span>}
            </span>
          </>
        );
        return (
          <React.Fragment key={step.id}>
            {clickable ? (
              <button type="button" className={`step ${classes.join(" ")}`} onClick={() => onStepClick(idx)}>
                {content}
              </button>
            ) : (
              <div className={`step ${classes.join(" ")}`}>
                {content}
              </div>
            )}
            {idx < steps.length - 1 && <span className="step-arrow">→</span>}
          </React.Fragment>
        );
      })}
    </div>
  );
}

          <button className="btn btn-ghost" onClick={() => go("templates")}>
            <window.Icon.plus className="icn" /> 从模板池雇佣
          </button>

      </div>

          <a key={item.id} className={`tab ${tab === item.id ? "active" : ""}`} onClick={() => setTab(item.id)}>
            {item.label} <span className="tab-count tnum">{counts[item.id]}</span>
          </a>
        ))}
      </div>

      {isManager && tab === "intern" && (
        <div className="subtabs">
          <button className={`subtab ${subtab === "ai" ? "active" : ""}`} onClick={() => setSubtab("ai")}>AI 评估</button>

        <div className="empty">

      ) : (
        <div className="grid grid-3">
          {list.map(employee => {
            // 待实习状态的员工点击卡片直接进入对应的评估页面
            const handleClick = () => {
              if (employee.status === "interning_ai") {
                go(`eval-ai/${employee.id}`);
              } else if (employee.status === "interning_human") {
                go(`eval-human/${employee.id}`);
              } else {
                go(`employee/${employee.id}`);
              }
            };
            return (
            <window.EmployeeCard
              key={employee.id}
              emp={employee}
              onClick={handleClick}
              footerActions={(
                <div className="action-row">
                  {employee.status === "interning_ai" && (
                    <button className="btn btn-primary btn-sm" onClick={evt => { evt.stopPropagation(); go(`eval-ai/${employee.id}`); }}>
                      进入 AI 评估
                    </button>
                  )}
                  {employee.status === "interning_human" && (
                    <button className="btn btn-primary btn-sm" onClick={evt => { evt.stopPropagation(); go(`eval-human/${employee.id}`); }}>
                      进入人工评估
                    </button>
                  )}
                  {employee.status !== "interning_ai" && employee.status !== "interning_human" && (
                    <button className="btn-link" onClick={evt => { evt.stopPropagation(); go(`employee/${employee.id}`); }}>查看详情 →</button>
                  )}
                </div>
              )}
            />
          )})}
        </div>
      )}
    </div>
  );
}

/* global React */
/* "去 IM" demo modal — picks which connected platform to launch. */
const { useEffect: useGoIMEffect } = React;

const GO_IM_PLATFORMS = [
  { key: "feishu",   name: "飞书", mark: "飞", tone: "indigo", scheme: "feishu://"   },
  { key: "dingtalk", name: "钉钉", mark: "钉", tone: "amber",  scheme: "dingtalk://" },
  { key: "wecom",    name: "企微", mark: "企", tone: "green",  scheme: "wxwork://"   },
];

// Try to launch the platform's native client.
// Falls back gracefully if the URL scheme isn't registered.
window.__launchIM__ = function launchIM(platformKey) {
  const p = GO_IM_PLATFORMS.find((x) => x.key === platformKey);
  if (!p) return;
  // Iframe trick avoids navigating the page away if the scheme isn't registered.
  const f = document.createElement("iframe");
  f.style.display = "none";
  f.src = p.scheme;
  document.body.appendChild(f);
  // Cleanup after a moment.
  setTimeout(() => { try { document.body.removeChild(f); } catch (_) {} }, 1200);
  // Also try direct location for browsers that ignore iframe deep-links
  try { window.location.href = p.scheme; } catch (_) {}
};

function GoIMModal({ open, emp, onClose }) {
  useGoIMEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === "Escape") onClose && onClose(); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [open, onClose]);

  if (!open || !emp) return null;
  const connected = GO_IM_PLATFORMS.filter((p) => emp.im[p.key] === "connected");

  return (
    <div className="go-im-overlay"
         onMouseDown={(e) => { if (e.target === e.currentTarget) onClose && onClose(); }}>
      <div className="go-im-modal" role="dialog" aria-modal="true">
        <header className="go-im-head">
          <div className="go-im-titles">
            <div className="go-im-title">去 IM · {emp.name}</div>
            <div className="go-im-sub">演示模式下会模拟拉起对应平台私聊。</div>
          </div>
          <button className="go-im-close" onClick={onClose} aria-label="关闭">

/* global React */
/* Modal: configure a single IM platform for a digital employee. */
const { useState: useModalState, useEffect: useModalEffect, useRef: useModalRef } = React;

const MODAL_PLATFORMS = {
  feishu:   { name: "飞书", mark: "飞", tone: "indigo" },
  dingtalk: { name: "钉钉", mark: "钉", tone: "amber" },
  wecom:    { name: "企微", mark: "企", tone: "green" },
};

const MODE_FORMS = {
  ws: {
    title: "WebSocket 长连接（推荐）",
    tip:   "直接输入应用凭据即可建立长连接，免外网回调地址。",
    fields: (platform) => {
      const labels = {
        feishu:   ["App ID", "App Secret"],
        dingtalk: ["AgentID", "AppSecret"],
        wecom:    ["AgentID", "Secret"],
      }[platform] || ["App ID", "App Secret"];
      return [
        { key: "id",     label: labels[0], hint: `请输入${MODAL_PLATFORMS[platform].name} ${labels[0]}` },
        { key: "secret", label: labels[1], hint: `请输入${MODAL_PLATFORMS[platform].name} ${labels[1]}` },
      ];
    },
  },
  url: {
    title: "使用 URL 回调",
    tip:   "需要在开放平台配置回调地址、Token 与 EncodingAESKey。",
    fields: () => [
      { key: "url",   label: "回调地址",        hint: "https://example.com/im/callback" },
      { key: "token", label: "Token",          hint: "请输入开放平台 Token" },
      { key: "aes",   label: "EncodingAESKey", hint: "请输入 43 位 AESKey" },
    ],
  },
};

function ModalIcon({ name }) {
  const stroke = { fill: "none", stroke: "currentColor", strokeWidth: 1.8, strokeLinecap: "round", strokeLinejoin: "round" };
  switch (name) {
    case "x":     return <svg viewBox="0 0 24 24" {...stroke}><path d="M6 6l12 12M18 6L6 18"/></svg>;
    case "check": return <svg viewBox="0 0 24 24" {...stroke}><path d="M5 13l4 4 10-10"/></svg>;
    case "warn":  return <svg viewBox="0 0 24 24" {...stroke}><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>;
    case "loader":
      return (
        <svg viewBox="0 0 24 24" className="modal-spin" fill="none" stroke="currentColor"
             strokeWidth="2.2" strokeLinecap="round">
          <path d="M12 3a9 9 0 1 1-6.4 2.6" opacity="0.85"/>
        </svg>
      );
    default: return null;
  }
}

function IMConfigModal({ open, emp, platform, onClose, onConnected }) {
  const [mode, setMode] = useModalState("ws");
  const [values, setValues] = useModalState({});
  const [phase, setPhase] = useModalState("idle"); // idle | connecting | success | error
  const [errorMsg, setErrorMsg] = useModalState("");
  const overlayRef = useModalRef(null);

  // Reset state every time the modal opens or platform changes
  useModalEffect(() => {
    if (open) {
      setMode("ws");
      setValues({});
      setPhase("idle");
      setErrorMsg("");
    }
  }, [open, platform]);

  // ESC to close
  useModalEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === "Escape" && phase !== "connecting") onClose && onClose(); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [open, phase, onClose]);

  if (!open || !platform) return null;
  const p = MODAL_PLATFORMS[platform];
  const form = MODE_FORMS[mode];
  const fields = form.fields(platform);

  const allFilled = fields.every((f) => (values[f.key] || "").trim().length > 0);

  const submit = () => {
    if (!allFilled || phase === "connecting") return;
    setPhase("connecting");
    setErrorMsg("");
    // Simulated connection — deterministic: contains "fail" => fail, else succeed after 1.6s
    const willFail = Object.values(values).some((v) => /fail|err/i.test(String(v)));
    setTimeout(() => {
      if (willFail) {
        setPhase("error");
        setErrorMsg("凭据校验失败：请检查 ID/Secret 后重试");
      } else {
        setPhase("success");
        onConnected && onConnected(emp.id, platform);
      }
    }, 1600);
  };

  const retry = () => setPhase("idle");

  return (
    <div className="im-modal-overlay" ref={overlayRef}
         onMouseDown={(e) => { if (e.target === overlayRef.current && phase !== "connecting") onClose && onClose(); }}>
      <div className="im-modal" role="dialog" aria-modal="true">
        <header className="im-modal-head">
          <div className="im-modal-title-row">
            <span className={"avatar-chip av-" + p.tone} style={{ width: 32, height: 32, fontSize: 13 }}>{p.mark}</span>
            <div className="im-modal-titles">
              <div className="im-modal-title">接入平台</div>
              <div className="im-modal-sub">{p.name} · {emp.name}</div>
            </div>
          </div>
          <button className="im-modal-close" onClick={onClose} disabled={phase === "connecting"} aria-label="关闭">
            <ModalIcon name="x"/>
          </button>
        </header>

        {/* ============ body switches by phase ============ */}
        {(phase === "idle" || phase === "connecting") && (
          <div className="im-modal-body">
            <div className="im-modal-field-label">接入模式</div>
            <div className="im-mode-row">
              <button className={"im-mode " + (mode === "ws"  ? "on" : "")}
                      disabled={phase === "connecting"}
                      onClick={() => setMode("ws")}>WebSocket 长连接（推荐）</button>
              <button className={"im-mode " + (mode === "url" ? "on" : "")}
                      disabled={phase === "connecting"}
                      onClick={() => setMode("url")}>使用 URL 回调</button>
            </div>

            <div className="im-mode-tip">{form.tip}</div>

            <div className={"im-cred-grid " + (fields.length === 3 ? "col-1" : "")}>
              {fields.map((f) => (
                <div className="im-field" key={f.key}>
                  <label>{f.label} · 必填</label>
                  <input
                    type={/secret|aes|token/i.test(f.key) ? "password" : "text"}
                    placeholder={f.hint}
                    value={values[f.key] || ""}
                    disabled={phase === "connecting"}
                    onChange={(e) => setValues((v) => ({ ...v, [f.key]: e.target.value }))}
                  />
                </div>
              ))}
            </div>

            {phase === "connecting" && (
              <div className="im-status-banner connecting">
                <ModalIcon name="loader"/>
                <div>
                  <div className="im-status-banner-title">正在与 {p.name} 建立连接…</div>
                  <div className="im-status-banner-text">校验凭据并下发会话密钥，请稍候 (~2s)</div>
                </div>
              </div>
            )}

            <footer className="im-modal-foot">
              <button className="action-ghost" onClick={onClose} disabled={phase === "connecting"}>取消</button>
              <button className="action-primary" onClick={submit}
                      disabled={!allFilled || phase === "connecting"}>
                {phase === "connecting" ? "连接中…" : "注册并连接"}
              </button>
            </footer>
          </div>
        )}

        {phase === "success" && (
          <div className="im-modal-body result">
            <div className="im-result-card success">
              <div className="im-result-icon"><ModalIcon name="check"/></div>
              <div className="im-result-text">
                <div className="im-result-title">已成功连接 {p.name}</div>
                <div className="im-result-sub">
                  {emp.name} 现在可以通过{p.name} 接收和回复消息。连接方式：{mode === "ws" ? "WebSocket 长连接" : "URL 回调"}
                </div>
              </div>
            </div>
            <div className="im-result-meta">
              <div><span>连接 ID</span><b>conn_{Math.random().toString(36).slice(2, 9)}</b></div>
              <div><span>建立时间</span><b>刚刚</b></div>
              <div><span>会话密钥</span><b>•••• •••• 已下发</b></div>
            </div>
            <footer className="im-modal-foot">
              <button className="action-primary" onClick={onClose}>完成</button>
            </footer>
          </div>
        )}

        {phase === "error" && (
          <div className="im-modal-body result">
            <div className="im-result-card error">
              <div className="im-result-icon"><ModalIcon name="warn"/></div>
              <div className="im-result-text">
                <div className="im-result-title">连接失败</div>
                <div className="im-result-sub">{errorMsg || "请检查凭据后重试"}</div>
              </div>
            </div>
            <ul className="im-error-checklist">
              <li>App ID / Secret 是否与开放平台一致</li>
              <li>是否已在开放平台开启对应能力</li>
              <li>服务器 IP 是否在白名单内</li>
            </ul>
            <footer className="im-modal-foot">
              <button className="action-ghost" onClick={onClose}>取消</button>
              <button className="action-primary" onClick={retry}>重新填写并重试</button>
            </footer>
          </div>
        )}
      </div>
    </div>
  );
}

function buildEmployeeActions(employee, role, go, toast, setJumpPicker) {
  const isManager = role === "manager";
  const viewer = window.getViewer(role);
  const isOwner = employee.owner === viewer.name;
  const actions = [];

  if (employee.type === "department") {
    if (employee.status === "hired") actions.push({ label: "继续雇佣", primary: true, go: () => go(`hire/${employee.id}`) });
    if (employee.status === "interning_ai") actions.push({ label: "查看 AI 评估", primary: true, go: () => go(`eval-ai/${employee.id}`) });
    if (employee.status === "interning_human") actions.push({ label: "查看人工评估", primary: true, go: () => go(`eval-human/${employee.id}`) });
    if (employee.status === "live") {
      if (isManager) {
        actions.push({ label: "重新雇佣", primary: true, go: () => go(`hire/${employee.id}`) });
        actions.push({ label: "复制分身", go: () => go(`clone/${employee.id}`) });
      } else {
        actions.push({ label: "创建分身", primary: true, go: () => go(`clone/${employee.id}`) });
      }
    }
  } else {
    if (employee.customizing && (employee.status === "hired" || employee.status === "interning_ai" || employee.status === "interning_human") && isOwner) {
      actions.push({ label: "继续定制", primary: true, go: () => go(`hire/${employee.id}`) });
    } else {
      if (employee.status === "live" && isOwner) {
        actions.push({ label: "开始对话", primary: true, go: () => go(`chat/${employee.id}`) });
        if (window.getConnectedChannels(employee.id).length) actions.push({ label: "去 IM", go: () => setJumpPicker(true) });
        actions.push({ label: "配置 IM", go: () => setImModal(true) });
        if ((employee.type === "personal_clone" || employee.role === "部门分身") && !employee.customized && !employee.customizing) actions.push({ label: "私人定制", go: () => go(`customize/${employee.id}`) });
        actions.push({
          label: "退役",
          go: () => setRetireConfirm(true)
        });
      }
      if ((employee.status === "interning_ai" || employee.status === "interning_human") && isOwner) {
        actions.push({
          label: employee.status === "interning_ai" ? "查看 AI 评估" : "查看人工评估",
          primary: true,
          go: () => go(employee.status === "interning_ai" ? `eval-ai/${employee.id}` : `eval-human/${employee.id}`)
        });
      }
    }
  }

  if (employee.status === "failed") {
    actions.push({ label: "查看评估报告", primary: true, go: () => go(`review/${employee.id}`) });
    actions.push({ label: "继续雇佣", go: () => go(`hire/${employee.id}`) });
  }

  if (employee.status === "retired") {
    actions.push({
      label: "重新启用", primary: true,
      go: () => {
        window.updateEmployee(employee.id, { status: "live", updated: "刚刚", activeAt: "刚刚" });
        toast("已重新启用，员工现已上岗");
        go("my");
      }
    });
    if (employee.parent) actions.push({ label: "重新复制", go: () => go(`clone/${employee.parent}`) });
  }

  return actions;
}

.hire-flow-v2 .wf-head-top {

.hire-flow-v2 .wf-stage-label {

  font-weight: 700;
  color: var(--text);
}

.hire-flow-v2 .wf-progress-bar {

.hire-flow-v2 .wf-note {

.hire-flow-v2 .wf-sections {

/* Section */
.hire-flow-v2 .wf-section {

.hire-flow-v2 .wf-section-head {
  display: flex;
  align-items: center;

}

}

.hire-flow-v2 .wf-section-left {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
}

.hire-flow-v2 .wf-num {

  height: 22px;
  border-radius: 50%;

  font-weight: 700;
  color: var(--text-soft);

  border-color: #6ee7b7;

}

.hire-flow-v2 .wf-section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

.hire-flow-v2 .wf-section-right {

  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.hire-flow-v2 .wf-status-pill {
  font-size: 11px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 999px;
}

.hire-flow-v2 .wf-pill-done {
  background: #ecfdf5;
  color: var(--good-deep);
}

.hire-flow-v2 .wf-pill-pending {
  background: #fff8ee;
  color: #b45309;
}

.hire-flow-v2 .wf-pill-wait {
  background: var(--surface-soft);
  color: var(--caption);
}

.hire-flow-v2 .wf-item-check-pending {
  background: #f3f4f6;
  border: 1.5px solid #d1d5db;
  color: #9ca3af;
}

.hire-flow-v2 .wf-pill-active {
  background: #fff7ed;
  color: #c2410c;
}

.hire-flow-v2 .wf-pending-badge {
  font-size: 11px;
  color: #c2410c;
  font-weight: 500;
  flex-shrink: 0;
  padding-top: 2px;
}

.hire-flow-v2 .wf-chevron {
  font-size: 16px;
  color: var(--caption);
  transition: transform 0.2s ease;
  transform: rotate(90deg);
  display: inline-block;
  line-height: 1;
}

.hire-flow-v2 .wf-chevron.open {
  transform: rotate(270deg);
}

.hire-flow-v2 .wf-section-body {
  padding: 0 16px 10px;
}

/* Section items */
.hire-flow-v2 .wf-empty-hint {
  font-size: 12px;

  line-height: 1.6;
  margin: 0;
  padding: 2px 0 4px;
}

.hire-flow-v2 .wf-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line-soft);
}

.hire-flow-v2 .wf-item:last-child {
  border-bottom: none;
}

.hire-flow-v2 .wf-item-check {
  width: 18px;
  height: 18px;
  border-radius: 4px;
  background: var(--good);
  color: #fff;
  font-size: 11px;

  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 2px;
}

.hire-flow-v2 .wf-item-body {
  flex: 1;
  min-width: 0;
}

.hire-flow-v2 .wf-item-title {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 2px;
}

.hire-flow-v2 .wf-item-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
}

.hire-flow-v2 .wf-item-tag {

  padding: 1px 5px;

  color: #4a6cf7;

}

.hire-flow-v2 .wf-item-tag-type {
  background: #f0fdf4;
  color: var(--good-deep);
}

.hire-flow-v2 .wf-item-tag-dep {
  background: #fef3f2;
  color: #be123c;
}

.hire-flow-v2 .wf-item-hint {
  font-size: 11px;
  color: var(--caption);
  margin: 0;
  line-height: 1.5;
}

.hire-flow-v2 .wf-confirmed {
  font-size: 11px;
  color: var(--good-deep);
  font-weight: 500;
  flex-shrink: 0;
  padding-top: 2px;
}

/* Package section */
.hire-flow-v2 .wf-pkg-stats {
  display: flex;
  gap: 0;
  margin-bottom: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}

.hire-flow-v2 .wf-pkg-stat {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 4px;
  border-right: 1px solid var(--line);
}

.hire-flow-v2 .wf-pkg-stat:last-child {
  border-right: none;
}

.hire-flow-v2 .wf-pkg-num {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
}

.hire-flow-v2 .wf-pkg-label {
  font-size: 10px;
  color: var(--caption);
  margin-top: 2px;
}

.hire-flow-v2 .wf-pkg-btn {
  width: 100%;

  border-radius: 8px;

  color: var(--caption);

}

.hire-flow-v2 .wf-pkg-btn:disabled {

.hire-flow-v2 .wf-pkg-btn-ready {
  background: var(--accent);

}

.hire-flow-v2 .wf-pkg-note {
  font-size: 10px;
  color: var(--caption);
  margin: 0;
  text-align: center;
}

.hire-flow-v2 .panel-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  padding: 16px 18px 14px;
  border-bottom: 1px solid var(--line);
}

.hire-flow-v2 .employee-chip {

.hire-flow-v2 .employee-chip strong,

.hire-flow-v2 .chat-feed {

.hire-flow-v2 .message-row.user .bubble {

.hire-flow-v2 .inline-action,
.hire-flow-v2 .tool-btn,
.hire-flow-v2 .ghost-btn,
.hire-flow-v2 .primary-btn,
.hire-flow-v2 .send-btn,

.hire-flow-v2 .inline-action,
.hire-flow-v2 .tool-btn,

.hire-flow-v2 .skip-ai-btn {

.hire-flow-v2 .skip-ai-btn:hover {

  border-color: #a5b4fc;
}

.hire-flow-v2 .primary-btn,

.hire-flow-v2 .todo-status {

.hire-flow-v2 .status-icon {

function ensureHireV2Styles() {
  if (document.getElementById(HIRE_V2_STYLE_ID)) return;
  const style = document.createElement("style");
  style.id = HIRE_V2_STYLE_ID;
  style.textContent = HIRE_V2_STYLES;
  document.head.appendChild(style);
}

function clampPhase(value) {
  const num = Number(value) || 1;
  return Math.max(1, Math.min(num, 6));
}

function docsProgress(flow) {
  if (hasUploadedBusinessFile(flow)) return 1;
  return DOC_REQUIREMENTS.length ? flow.docs.done.length / DOC_REQUIREMENTS.length : 0;
}

function skillsProgress(flow) {
  return Math.min(flow.skills.adopted.length, 1);
}

function integrationsProgress(flow) {
  return Math.min(flow.integrations.done.length / INTEGRATION_DEFINITIONS.length, 1);
}

function packageProgress(flow) {
  return flow.package.generated ? 1 : 0;
}

function progressForStep(step, flow) {
  if (step.id === "docs") return docsProgress(flow);
  if (step.id === "skills") return skillsProgress(flow);
  if (step.id === "integrations") return integrationsProgress(flow);
  return packageProgress(flow);
}

function mapPhaseToProcessIndex(phase) {
  if (phase <= 3) return 0;
  if (phase === 4) return 1;
  if (phase === 5) return 2;
  return 3;
}

function uniqueId(prefix) {
  return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
}

function createMessage(role, payload) {
  return {
    id: uniqueId(role),
    role,
    title: payload.title || "",
    text: payload.text || "",
    card: payload.card || null,
    actions: payload.actions || [],
    typing: !!payload.typing
  };
}

function createIntroMessages(template, existing, isBranchFlow) {
  const assistantName = existing ? existing.name : template.name;
  const roleLabel = isBranchFlow ? "私人定制数字员工" : "部门数字员工";
  const scenario = existing
    ? `我们会基于「${assistantName}」继续推进雇佣环节。`
    : `我们会基于「${template.name}」模板完成一条新的部门版雇佣流程。`;

  return [
    createMessage("agent", {
      title: `我是${assistantName}`,
      text: `${scenario} 这次我会像一位即将上岗的新同事一样，主动告诉你我还缺什么。`,
      card: {
        type: "identity",
        nickname: assistantName,
        role: roleLabel,
        style: "友好、清晰、稳妥",
        highlights: ["业务理解", "技能配置", "外部系统连接"]
      }
    }),
    createMessage("agent", {
      title: "这些是我要完成的入职事项",
      text: "资料、技能、系统和实例包会在同一条会话里逐步闭环。右侧会同步记录每一项进度。",
      actions: [{ label: "开始第一步", action: "startDocs", primary: true }]
    })
  ];
}

function buildInitialFlow(template, existing, savedFlow) {
  const completed = existing ? Math.max(0, Math.min(existing.hireProgress || 0, 6)) : 0;
  const minPhase = completed >= 6 ? 6 : Math.max(1, completed + 1);
  const base = {
    currentPhase: minPhase,
    todoRevealed: minPhase > 1,
    background: "original",
    messages: createIntroMessages(template, existing, existing && existing.type === "private_branch"),
    docs: {
      interactions: 0,
      done: [],
      sources: {},
      notes: [],
      todoItems: []
    },
    skills: {
      adopted: [],
      ignored: [],
      customCount: 0,
      coveredTypes: [],
      generated: [],
      todoItems: []
    },
    integrations: {
      configs: {},
      done: [],
      failed: [],
      todoItems: []
    },
    package: {
      generated: false,
      meta: null
    }
  };

  if (!savedFlow) return base;

  const next = {
    ...base,
    ...savedFlow,
    currentPhase: Math.max(minPhase, clampPhase(savedFlow.currentPhase)),
    todoRevealed: savedFlow.todoRevealed || minPhase > 1,
    background: savedFlow.background === "cool" ? "cool" : "original",
    docs: {
      ...base.docs,
      ...(savedFlow.docs || {}),
      done: Array.isArray(savedFlow.docs && savedFlow.docs.done) ? savedFlow.docs.done : [],
      todoItems: Array.isArray(savedFlow.docs && savedFlow.docs.todoItems) ? savedFlow.docs.todoItems : []
    },
    skills: {
      ...base.skills,
      ...(savedFlow.skills || {}),
      adopted: Array.isArray(savedFlow.skills && savedFlow.skills.adopted) ? savedFlow.skills.adopted : [],
      ignored: Array.isArray(savedFlow.skills && savedFlow.skills.ignored) ? savedFlow.skills.ignored : [],
      coveredTypes: Array.isArray(savedFlow.skills && savedFlow.skills.coveredTypes) ? savedFlow.skills.coveredTypes : [],
      generated: Array.isArray(savedFlow.skills && savedFlow.skills.generated) ? savedFlow.skills.generated : [],
      todoItems: Array.isArray(savedFlow.skills && savedFlow.skills.todoItems) ? savedFlow.skills.todoItems : []
    },
    integrations: {
      ...base.integrations,
      ...(savedFlow.integrations || {}),
      done: Array.isArray(savedFlow.integrations && savedFlow.integrations.done) ? savedFlow.integrations.done : [],
      todoItems: Array.isArray(savedFlow.integrations && savedFlow.integrations.todoItems) ? savedFlow.integrations.todoItems : []
    },
    package: {
      ...base.package,
      ...(savedFlow.package || {})
    }
  };

  if (!Array.isArray(next.messages) || !next.messages.length) next.messages = base.messages;
  return next;
}

function readFlowCache(cacheKey) {
  try {
    const raw = window.localStorage && window.localStorage.getItem(cacheKey);
    return raw ? JSON.parse(raw) : null;
  } catch (error) {
    return null;
  }
}

function writeFlowCache(cacheKey, flow) {
  try {
    if (!window.localStorage) return;
    window.localStorage.setItem(cacheKey, JSON.stringify(flow));
  } catch (error) {
    // Prototype cache failures should not block the UI.
  }
}

function clearFlowCache(cacheKey) {
  try {
    if (window.localStorage) window.localStorage.removeItem(cacheKey);
  } catch (error) {
    // Ignore cache cleanup failures.
  }
}

function detectDocCoverage(input) {
  const source = `${input || ""}`;
  return DOC_REQUIREMENTS.filter(item => item.patterns.some(pattern => pattern.test(source))).map(item => item.id);
}

function hasUploadedBusinessFile(flow) {
  const sources = (flow && flow.docs && flow.docs.sources) || {};
  return Object.values(sources).some(item => item && item.source === "upload");
}

function normalizeUploadedDocCoverage(files, recognized) {
  if (recognized.length) return recognized;
  if (files && files.length && DOC_REQUIREMENTS.length) return [DOC_REQUIREMENTS[0].id];
  return recognized;
}

function findDocLabel(docId) {
  const target = DOC_REQUIREMENTS.find(item => item.id === docId);
  return target ? target.label : docId;
}

function buildMaterialsCard(doneIds) {
  return {
    type: "materials",
    items: DOC_REQUIREMENTS.map(item => ({
      name: item.label,
      desc: item.desc,
      status: doneIds.includes(item.id) ? "已覆盖" : "待补充"
    }))
  };
}

function inferSkillSeed(text) {
  const source = `${text || ""}`;
  if (/简历|resume|cv|排序|rank/i.test(source)) {
    return {
      name: "候选人匹配排序",
      type: "查询类技能",
      description: "根据岗位要求自动对候选人资料排序，并输出排序依据。"
    };
  }
  if (/面试|录音|纪要|minutes|summary|转写/i.test(source)) {
    return {
      name: "面试纪要整理",
      type: "处理类技能",
      description: "自动整理面试过程中的音频、转写和速记信息，生成结构化纪要。"
    };
  }
  if (/offer|薪资|审批|边界|升级|风险/i.test(source)) {
    return {
      name: "Offer 风险升级",
      type: "升级类技能",
      description: "识别敏感 offer 场景，自动检查审批边界并给出升级建议。"
    };
  }
  return {
    name: "自定义能力草稿",
    type: ["查询类技能", "处理类技能", "升级类技能"][Date.now() % 3],
    description: "根据你的文字描述生成一份可继续编辑的能力定义。"
  };
}

function buildGeneratedSkillFromText(text) {
  const seed = inferSkillSeed(text);
  return {
    id: uniqueId("skill"),
    name: seed.name,
    type: seed.type,
    description: `${seed.description} 当前需求：${text}`,
    dependency: "待确认外部依赖",
    trigger: `当出现「${text.slice(0, 20)}${text.length > 20 ? "…" : ""}」相关场景时触发`
  };
}

function buildSkillFromFile(file) {
  const base = file.name.replace(/\.[^.]+$/, "");
  const seed = inferSkillSeed(base);
  return {
    id: uniqueId("skill_file"),
    name: base || seed.name,
    type: seed.type,
    description: `已从 ${file.name} 解析出一份技能草稿，可继续编辑后采纳。`,
    dependency: "待确认外部依赖",
    trigger: `上传 ${file.name} 后触发解析`
  };
}

function buildDemoConfig(systemId) {
  const key = systemId || "system";
  return {
    endpoint: `https://demo-${key}.ncrew.local/api`,
    apiKey: `sk-demo-${key}`,
    webhook: `https://demo-${key}.ncrew.local/webhook`,
    timeout: 30,
    __demo: true
  };
}

function validateConfig(config) {
  if (!config.endpoint || !/^https?:\/\//.test(config.endpoint)) {
    return { ok: false, reason: "endpoint 解析失败：地址格式不正确" };
  }
  if (!config.apiKey || !config.apiKey.startsWith("sk-")) {
    return { ok: false, reason: "apiKey 无效：密钥格式需以 sk- 开头" };
  }
  return { ok: true, reason: "连接已就绪" };
}

function normalizeSystemConfig(systemId, config) {
  const demoConfig = buildDemoConfig(systemId);
  const endpoint = config.endpoint || demoConfig.endpoint;
  const apiKey = config.apiKey || demoConfig.apiKey;
  const webhook = config.webhook || demoConfig.webhook;
  const timeout = Number(config.timeout || demoConfig.timeout);
  const usedDemo = !config.endpoint || !config.apiKey;

  return {
    endpoint,
    apiKey,
    webhook,
    timeout,
    __demo: usedDemo
  };
}

function parseIntegrationText(text) {
  const results = [];
  const urlMatch = [...text.matchAll(/https?:\/\/[^\s，,；;]+/g)].map(match => match[0]);
  const keyMatch = [...text.matchAll(/sk-[a-zA-Z0-9-_]+/g)].map(match => match[0]);

  INTEGRATION_DEFINITIONS.forEach((system, index) => {
    if (text.toLowerCase().includes(system.id) || text.includes(system.name.replace("系统", "")) || text.includes(system.name)) {
      results.push({
        systemId: system.id,
        config: {
          endpoint: urlMatch[index] || urlMatch[0] || "",
          apiKey: keyMatch[index] || keyMatch[0] || "",
          webhook: "",
          timeout: 30
        }
      });
    }
  });

  return results;
}

function formatTimestamp(date) {
  const parts = [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, "0"),
    String(date.getDate()).padStart(2, "0"),
    String(date.getHours()).padStart(2, "0"),
    String(date.getMinutes()).padStart(2, "0")
  ];
  return parts.join("");
}

function buildPackageMeta(flow, assistantName) {
  const timestamp = new Date();
  return {
    name: `${assistantName}_实例包_v1.0_${formatTimestamp(timestamp)}`,
    version: "v1.0",
    generatedAt: timestamp.toLocaleString("zh-CN"),
    docsCount: flow.docs.done.length,
    skillsCount: flow.skills.adopted.length,
    integrationsCount: flow.integrations.done.length,
    tree: [
      "manifest.json",
      "knowledge/",
      "  ├─ index.json",
      "  ├─ kb/",
      "  ├─ manual/",
      "  ├─ faq/",
      "  └─ script/",
      "skills/",
      "integrations/",
      "prompts/",
      "policies/"
    ].join("\n")
  };
}

function renderIntegrationSummary(config) {
  if (!config) return "";
  return config.__demo ? `演示配置 · ${config.endpoint}` : config.endpoint;
}

function buildPackagePayload(flow, assistantName) {
  return {
    manifest: {
      employeeName: assistantName,
      role: "数字员工",
      version: flow.package.meta && flow.package.meta.version,
      generatedAt: flow.package.meta && flow.package.meta.generatedAt,
      capabilities: flow.skills.adopted.map(item => item.name)
    },
    knowledge: flow.docs.sources,
    skills: flow.skills.adopted,
    integrations: Object.fromEntries(
      Object.entries(flow.integrations.configs).map(([key, value]) => [
        key,
        { ...value, apiKey: value.apiKey ? "******已加密******" : "" }
      ])
    )
  };
}

function triggerDownload(blob, filename) {
  const anchor = document.createElement("a");
  const url = URL.createObjectURL(blob);
  anchor.href = url;
  anchor.download = filename;
  anchor.click();
  window.setTimeout(() => URL.revokeObjectURL(url), 0);
}

    return (
      <div className="message-detail">
        <ul className="message-list">
          {card.items.map(item => <li key={item.name}><strong>{item.name}</strong>：{item.desc} 当前状态：{item.status}。</li>)}
        </ul>
      </div>
    );

  if (card.type === "fileSummary") {

      <div className="message-detail">
